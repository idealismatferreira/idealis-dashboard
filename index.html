/* ---------- Perguntas bônus ---------- */
/* "09/08/26" — mesmo formato usado nas anamneses */
function hojeCurto() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + p(d.getFullYear() % 100);
}

/* tira o prefixo de data na hora de copiar — o aluno não precisa vê-la */
function semData(t) {
  return String(t || "").replace(/^\s*\d{2}\/\d{2}\/\d{2}\s*:\s*/, "").trim();
}

function PainelPerguntas({ aluno }) {
  const [lista, setLista] = useState(null);
  const [nova, setNova]   = useState("");
  const [erro, setErro]   = useState("");
  const [aviso, setAviso] = useState("");
  const [verUsadas, setVer] = useState(false);

  const carregar = useCallback(async () => {
    const { data, error } = await sb.from("perguntas")
      .select("id, texto, status, criado_em, usada_em")
      .eq("aluno_id", aluno.id)
      .order("criado_em", { ascending: false });
    if (error) { setErro(error.message); setLista([]); return; }
    setLista(data || []);
  }, [aluno.id]);

  useEffect(() => { carregar(); }, [carregar]);

  async function adicionar() {
    const t = nova.trim();
    if (!t) return;
    /* não duplica a data se o texto já vier com uma */
    const jaTem = /^\s*\d{2}\/\d{2}\/\d{2}\s*:/.test(t);
    const texto = jaTem ? t : hojeCurto() + ": " + t;
    const { error } = await sb.from("perguntas")
      .insert({ aluno_id: aluno.id, texto });
    if (error) { setErro(error.message); return; }
    setNova(""); await carregar();
  }

  async function marcar(p, status) {
    const { error } = await sb.from("perguntas")
      .update({ status, usada_em: status === "usada" ? new Date().toISOString() : null })
      .eq("id", p.id);
    if (error) { setErro(error.message); return; }
    await carregar();
  }

  async function remover(p) {
    const { error } = await sb.from("perguntas").delete().eq("id", p.id);
    if (error) { setErro(error.message); return; }
    await carregar();
  }

  const pend = (lista || []).filter(p => p.status === "pendente");
  const resto = (lista || []).filter(p => p.status !== "pendente");

  const [copiado, setCopiado] = useState(null);

  function copiarUma(p) {
    navigator.clipboard.writeText(semData(p.texto));
    setCopiado(p.id);
    setTimeout(() => setCopiado(c => (c === p.id ? null : c)), 1400);
  }

  function copiarPendentes() {
    if (!pend.length) return;
    navigator.clipboard.writeText(pend.map(p => "• " + semData(p.texto)).join("\n"));
    setAviso("Perguntas copiadas (sem as datas).");
  }

  return (
    <div>
      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}

      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        <input value={nova} onChange={e => setNova(e.target.value)}
          onKeyDown={e => e.key === "Enter" && adicionar()}
          placeholder={hojeCurto() + ": nova pergunta para puxar assunto..."}
          style={{ marginBottom: 0 }} />
        <button onClick={adicionar} disabled={!nova.trim()}
          style={{ width: "auto", padding: "11px 18px" }}>Adicionar</button>
      </div>

      {lista === null ? <div className="msg">Carregando...</div> : (
        <>
          <div className="sec-h" style={{ justifyContent: "space-between" }}>
            <b>Pendentes ({pend.length})</b>
            {pend.length > 0 && (
              <button className="btn-sec" style={{ padding: "4px 10px", fontSize: 11 }}
                onClick={copiarPendentes}>Copiar todas</button>
            )}
          </div>
          {pend.length === 0
            ? <div className="vazio-nota">Nenhuma pergunta pendente.</div>
            : pend.map(p => (
                <div className="pq-it" key={p.id}>
                  <span className="txt">
                    {/^\s*(\d{2}\/\d{2}\/\d{2})\s*:/.test(p.texto) && (
                      <span className="pq-data">
                        {p.texto.match(/^\s*(\d{2}\/\d{2}\/\d{2})/)[1]}
                      </span>
                    )}
                    {semData(p.texto)}
                  </span>
                  <span className="bt">
                    <button className="btn-sec ico" title="Copiar pergunta"
                      aria-label="Copiar pergunta" onClick={() => copiarUma(p)}>
                      {copiado === p.id ? <IconeCheck /> : <IconeCopiar />}
                    </button>
                    <button className="btn-sec" onClick={() => marcar(p, "usada")}>usei</button>
                    <button className="btn-sec" onClick={() => remover(p)}>×</button>
                  </span>
                </div>
              ))}

          {resto.length > 0 && (
            <>
              <div className="sec-h" style={{ marginTop: 24 }}>
                <b style={{ color: "var(--mut)" }}>
                  Já usadas ({resto.length})
                </b>
                <button className="btn-sec" style={{ padding: "3px 9px", fontSize: 11 }}
                  onClick={() => setVer(v => !v)}>{verUsadas ? "ocultar" : "mostrar"}</button>
              </div>
              {verUsadas && resto.map(p => (
                <div className="pq-it usada" key={p.id}>
                  <span className="txt">
                    {/^\s*(\d{2}\/\d{2}\/\d{2})\s*:/.test(p.texto) && (
                      <span className="pq-data">
                        {p.texto.match(/^\s*(\d{2}\/\d{2}\/\d{2})/)[1]}
                      </span>
                    )}
                    {semData(p.texto)}
                    {p.usada_em && (
                      <span style={{ color: "var(--mut)", fontSize: 11 }}>
                        {" · " + new Date(p.usada_em).toLocaleDateString("pt-BR")}
                      </span>
                    )}
                  </span>
                  <span className="bt">
                    <button className="btn-sec ico" title="Copiar pergunta"
                      aria-label="Copiar pergunta" onClick={() => copiarUma(p)}>
                      {copiado === p.id ? <IconeCheck /> : <IconeCopiar />}
                    </button>
                    <button className="btn-sec" onClick={() => marcar(p, "pendente")}>voltar</button>
                    <button className="btn-sec" onClick={() => remover(p)}>×</button>
                  </span>
                </div>
              ))}
            </>
          )}
        </>
      )}
    </div>
  );
}


/* ---------- Planejamento de Periodização ---------- */
const PL_COR = {
  bg: "#000000", titulo: "#6BDBDC", aluno: "#DBFF00", label: "#67F0F6",
  fase: "#EFFF82", nome: "#E1EF86", data: "#EEFF7D",
  texto: "#EAFF80", obs: "#FF1919", linha: "#16201F"
};
const PL_LABELS = ["Início", "Objetivo", "Métodos", "Observações"];

function dISO(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function dBR(iso) {
  if (!iso) return "";
  const [a, m, d] = String(iso).slice(0, 10).split("-");
  return d + "/" + m + "/" + a.slice(2);
}
function parseISO(iso) { return new Date(String(iso).slice(0, 10) + "T12:00:00"); }
function addDias(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function proxSegunda(d) {
  const x = new Date(d.getTime());
  const w = x.getDay();
  x.setDate(x.getDate() + (w === 1 ? 0 : (8 - w) % 7));
  return x;
}

/* "Fase de Hipertrofia de Qualidade I" -> "Hipertrofia de Qualidade" */
function nucleoFase(nome) {
  return String(nome || "").trim()
    .replace(/^Fase\s+(de\s+|d[ao]\s+)?/i, "")
    .replace(/\s+(I|1)\s*$/, "")
    .trim();
}
function obsAuto(nome, dataII) {
  const n = nucleoFase(nome);
  if (!n || !dataII) return "";
  return '(teremos a fase "' + n + ' II" - ' + dBR(dISO(dataII)) + ")";
}

/* a partir do início da fase 1 e da duração, calcula as 4 fases.
   regra observada nos planejamentos reais:
   fase II = início + duração ; próxima fase = fase II + duração  */
function calcularDatas(inicioISO, semanas) {
  if (!inicioISO) return [];
  const dur = (semanas || 6) * 7;
  const out = [];
  let cur = parseISO(inicioISO);
  for (let i = 0; i < 4; i++) {
    const fim = addDias(cur, dur - 1);
    const faseII = proxSegunda(addDias(cur, dur));
    out.push({ inicio: dISO(cur), fim: dISO(fim), faseII });
    cur = proxSegunda(addDias(faseII, dur));
  }
  return out;
}

function faseVazia(pos) {
  return { posicao: pos, template_id: "", nome: "", inicio: "", fim: "",
           objetivo: "", metodos: "", observacao: "" };
}

/* desenha o planejamento num canvas (fundo preto, para o Photoshop) */
function desenharPlanejamento(plan, fases, aluno) {
  const S = 2, W = 1920, H = 1180;
  const cv = document.createElement("canvas");
  cv.width = W * S; cv.height = H * S;
  const x = cv.getContext("2d");
  x.scale(S, S);
  x.fillStyle = PL_COR.bg; x.fillRect(0, 0, W, H);

  const F = (px, peso) => (peso || 700) + " " + px + "px Sora, system-ui, sans-serif";
  const padL = 40, colLab = 190, gap = 18;
  const colW = (W - padL * 2 - colLab - gap * 3) / 4;
  const cx = i => padL + colLab + i * (colW + gap) + colW / 2;

  /* quebra texto respeitando as quebras de linha originais */
  function linhas(txt, max) {
    const out = [];
    for (const bruto of String(txt || "").split("\n")) {
      const t = bruto.trim();
      if (!t) { out.push(""); continue; }
      let atual = "";
      for (const pal of t.split(/\s+/)) {
        const teste = atual ? atual + " " + pal : pal;
        if (x.measureText(teste).width > max && atual) { out.push(atual); atual = pal; }
        else atual = teste;
      }
      if (atual) out.push(atual);
    }
    return out;
  }
  function bloco(txt, px, cxi, y, cor, tam, lh) {
    x.font = F(tam, 600); x.fillStyle = cor; x.textAlign = "center";
    const ls = linhas(txt, colW - 24);
    ls.forEach((l, i) => x.fillText(l, cxi, y + i * lh));
    return ls.length * lh;
  }

  /* cabeçalho */
  x.textAlign = "center";
  x.font = F(46); x.fillStyle = PL_COR.titulo;
  x.fillText(plan.titulo || "Planejamento de Periodização", W / 2, 92);
  x.font = F(30); x.fillStyle = PL_COR.aluno;
  x.fillText(aluno || "", W / 2, 136);

  /* colunas */
  let y = 232;
  fases.forEach((f, i) => {
    x.font = F(24); x.fillStyle = PL_COR.fase;
    x.fillText("Fase " + (i + 1), cx(i), y);
    bloco(f.nome, 0, cx(i), y + 32, PL_COR.nome, 19, 24);
  });

  /* rótulos e conteúdo, linha a linha */
  /* altura de cada linha calculada pelo conteúdo real, para o
     documento ocupar a página inteira em vez de sobrar espaço embaixo */
  const linhasDoc = [
    { lab: "Início",      get: f => dBR(f.inicio), cor: PL_COR.data,  tam: 30, lh: 38 },
    { lab: "Objetivo",    get: f => f.objetivo,    cor: PL_COR.texto, tam: 21, lh: 28 },
    { lab: "Métodos",     get: f => f.metodos,     cor: PL_COR.texto, tam: 21, lh: 28 },
    { lab: "Observações", get: f => f.observacao,  cor: PL_COR.obs,   tam: 19, lh: 25 }
  ];

  const alturas = linhasDoc.map(L => {
    x.font = F(L.tam, 600);
    const n = Math.max(...fases.map(f => linhas(L.get(f), colW - 24).length), 1);
    return n * L.lh;
  });

  const topo = 322, base = H - 130;
  const usado = alturas.reduce((a, b) => a + b, 0);
  const folga = Math.max(28, (base - topo - usado) / linhasDoc.length);

  let cy = topo;
  linhasDoc.forEach((L, k) => {
    x.textAlign = "right"; x.font = F(25); x.fillStyle = PL_COR.label;
    x.fillText(L.lab, padL + colLab - 22, cy + 4);
    fases.forEach((f, i) => bloco(L.get(f), 0, cx(i), cy, L.cor, L.tam, L.lh));
    cy += alturas[k] + folga;
  });

  /* data de emissão */
  x.textAlign = "right"; x.font = F(38); x.fillStyle = PL_COR.aluno;
  x.fillText(dBR(plan.data_emissao).replace(/(\d{2})$/, "20$1"), W - padL, H - 52);

  return cv;
}

function PainelPlanejamento() {
  const [alunos, setAlunos]   = useState([]);
  const [sel, setSel]         = useState("");
  const [tpls, setTpls]       = useState([]);
  const [cats, setCats]       = useState([]);
  const [plan, setPlan]       = useState(null);
  const [fases, setFases]     = useState([1, 2, 3, 4].map(faseVazia));
  const [erro, setErro]       = useState("");
  const [aviso, setAviso]     = useState("");
  const [busy, setBusy]       = useState(false);
  const [sujo, setSujo]       = useState(false);

  useEffect(() => {
    (async () => {
      const [a, t, c] = await Promise.all([
        sb.from("alunos").select("id, nome").order("nome"),
        sb.from("fase_templates").select("*").eq("ativo", true).order("ordem"),
        sb.from("fase_categorias").select("*").order("ordem")
      ]);
      if (!a.error) { setAlunos(a.data || []); if (a.data && a.data.length) setSel(a.data[0].id); }
      if (!t.error) setTpls(t.data || []);
      if (!c.error) setCats(c.data || []);
    })();
  }, []);

  const carregar = useCallback(async (alunoId) => {
    if (!alunoId) return;
    setErro(""); setAviso(""); setSujo(false);
    const { data, error } = await sb.from("planejamentos")
      .select("*").eq("aluno_id", alunoId)
      .order("data_emissao", { ascending: false }).limit(1);
    if (error) { setErro(error.message); return; }
    const p = (data && data[0]) || null;
    if (!p) {
      setPlan({ aluno_id: alunoId, titulo: "Planejamento de Periodização",
                data_emissao: dISO(new Date()), duracao_semanas: 6 });
      setFases([1, 2, 3, 4].map(faseVazia));
      return;
    }
    setPlan(p);
    const f = await sb.from("fases").select("*")
      .eq("planejamento_id", p.id).order("posicao");
    const mapa = new Map((f.data || []).map(r => [r.posicao, r]));
    setFases([1, 2, 3, 4].map(i => {
      const r = mapa.get(i);
      return r ? {
        id: r.id, posicao: i, template_id: r.template_id || "", nome: r.nome || "",
        inicio: r.inicio || "", fim: r.fim || "", objetivo: r.objetivo || "",
        metodos: r.metodos || "", observacao: r.observacao || ""
      } : faseVazia(i);
    }));
  }, []);

  useEffect(() => { carregar(sel); }, [sel, carregar]);

  function mudarFase(i, campo, valor) {
    setFases(fs => fs.map((f, k) => k === i ? { ...f, [campo]: valor } : f));
    setSujo(true);
  }

  /* aplica o template: nome, objetivo e métodos */
  function aplicarTemplate(i, tid) {
    const t = tpls.find(x => x.id === tid);
    setFases(fs => fs.map((f, k) => {
      if (k !== i) return f;
      if (!t) return { ...f, template_id: "" };
      return { ...f, template_id: tid,
        nome: "Fase de " + t.nome + " I",
        objetivo: t.objetivo, metodos: t.metodos };
    }));
    setSujo(true);
  }

  /* recalcula as 4 datas a partir do início da fase 1 */
  function gerarDatas() {
    const base = fases[0].inicio;
    if (!base) { setErro("Preenche a data de início da Fase 1 primeiro."); return; }
    const dur = (plan && plan.duracao_semanas) || 6;
    const calc = calcularDatas(base, dur);
    setFases(fs => fs.map((f, i) => ({
      ...f,
      inicio: calc[i].inicio,
      fim: calc[i].fim,
      observacao: obsAuto(f.nome, calc[i].faseII) || f.observacao
    })));
    setSujo(true); setErro("");
    setAviso("Datas e observações geradas. Ajusta o que quiser antes de salvar.");
  }

  async function salvar() {
    if (!sel) return;
    const faltando = fases.filter(f => f.nome && !f.inicio);
    if (faltando.length) {
      setErro("Fase " + faltando[0].posicao + " tem nome mas está sem data de início.");
      return;
    }
    setBusy(true); setErro("");
    try {
      let pid = plan && plan.id;
      const corpo = {
        aluno_id: sel,
        titulo: (plan && plan.titulo) || "Planejamento de Periodização",
        data_emissao: (plan && plan.data_emissao) || dISO(new Date()),
        duracao_semanas: (plan && plan.duracao_semanas) || 6
      };
      if (pid) {
        const u = await sb.from("planejamentos")
          .update({ ...corpo, atualizado_em: new Date().toISOString() }).eq("id", pid);
        if (u.error) throw new Error(u.error.message);
      } else {
        const ins = await sb.from("planejamentos").insert(corpo).select("id").single();
        if (ins.error) throw new Error(ins.error.message);
        pid = ins.data.id;
        setPlan(p => ({ ...(p || {}), ...corpo, id: pid }));
      }

      for (const f of fases) {
        if (!f.nome || !f.inicio) continue;
        const dur = (plan && plan.duracao_semanas) || 6;
        const fim = f.fim || dISO(addDias(parseISO(f.inicio), dur * 7 - 1));
        const linha = {
          aluno_id: sel, planejamento_id: pid, posicao: f.posicao,
          template_id: f.template_id || null, nome: f.nome,
          inicio: f.inicio, fim,
          objetivo: f.objetivo || null, metodos: f.metodos || null,
          observacao: f.observacao || null
        };
        if (f.id) {
          const u = await sb.from("fases").update(linha).eq("id", f.id);
          if (u.error) throw new Error(u.error.message);
        } else {
          const ins = await sb.from("fases").insert(linha).select("id").single();
          if (ins.error) throw new Error(ins.error.message);
          const novo = ins.data.id;
          setFases(fs => fs.map(y => y.posicao === f.posicao ? { ...y, id: novo } : y));
        }
      }
      setSujo(false);
      setAviso("Planejamento salvo. As fases já aparecem no App do aluno.");
      await carregar(sel);
    } catch (e) { setErro(e.message); }
    setBusy(false);
  }

  function baixarPng() {
    const nome = (alunos.find(a => a.id === sel) || {}).nome || "";
    const cv = desenharPlanejamento(plan || {}, fases, nome);
    const slug = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase();
    const a = document.createElement("a");
    a.download = "planejamento_" + slug + "_" +
      ((plan && plan.data_emissao) || dISO(new Date())) + ".png";
    a.href = cv.toDataURL("image/png");
    a.click();
    setAviso("PNG baixado em 3840×2360, fundo preto.");
  }

  const nomeAluno = (alunos.find(a => a.id === sel) || {}).nome || "";
  const temX = fases.some(f =>
    (f.objetivo + " " + f.metodos + " " + f.nome).includes("«x»"));

  const grupos = cats.map(c => ({
    ...c, itens: tpls.filter(t => t.categoria_id === c.id)
  })).filter(g => g.itens.length);

  const cel = (f, i, campo, cls, rows) => (
    <textarea className={cls} rows={rows || 3} value={f[campo]}
      onChange={e => mudarFase(i, campo, e.target.value)} />
  );

  return (
    <div>
      <div className="pl-top">
        <select value={sel} onChange={e => setSel(e.target.value)}>
          {alunos.length === 0 && <option value="">nenhum aluno</option>}
          {alunos.map(a => <option key={a.id} value={a.id}>{a.nome}</option>)}
        </select>
        <input type="date" value={(plan && plan.data_emissao) || ""}
          onChange={e => { setPlan(p => ({ ...p, data_emissao: e.target.value })); setSujo(true); }}
          title="Data de emissão" />
        <select value={(plan && plan.duracao_semanas) || 6}
          onChange={e => { setPlan(p => ({ ...p, duracao_semanas: +e.target.value })); setSujo(true); }}
          style={{ minWidth: 130 }}>
          {[4, 5, 6, 7, 8].map(n => <option key={n} value={n}>{n} semanas</option>)}
        </select>
        <button className="btn-sec" onClick={gerarDatas}>Gerar datas</button>
        <button onClick={salvar} disabled={busy || !sujo}>
          {busy ? "Salvando..." : "Salvar"}
        </button>
        <button className="btn-sec" onClick={baixarPng}>Baixar PNG</button>
      </div>

      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}
      {temX && (
        <div className="err" style={{ background: "#2a2418", borderColor: "#5c4a24", color: "#f0a35e" }}>
          ⚠️ Existe <b>«x»</b> em algum campo — é placeholder do template. Substitui antes de exportar.
        </div>
      )}

      <div className="pl-tit">
        <h2>{(plan && plan.titulo) || "Planejamento de Periodização"}</h2>
        <div className="aln">{nomeAluno}</div>
      </div>

      <div className="pl-grid">
        <div className="pl-lab" />
        {fases.map((f, i) => (
          <div className="pl-cel" key={"h" + i}>
            <div className="fnum">Fase {i + 1}</div>
            <select className="tsel" value={f.template_id}
              onChange={e => aplicarTemplate(i, e.target.value)}>
              <option value="">— escolher template —</option>
              {grupos.map(g => (
                <optgroup key={g.id} label={g.nome}>
                  {g.itens.map(t => <option key={t.id} value={t.id}>{t.nome}</option>)}
                </optgroup>
              ))}
            </select>
            <textarea className="fnome" rows={2} value={f.nome}
              onChange={e => mudarFase(i, "nome", e.target.value)}
              placeholder="Nome da fase" />
          </div>
        ))}

        <div className="pl-lab">Início</div>
        {fases.map((f, i) => (
          <div className="pl-cel" key={"d" + i}>
            <input type="date" className="fdata" value={f.inicio}
              onChange={e => mudarFase(i, "inicio", e.target.value)} />
            {f.inicio && f.fim && (
              <div style={{ textAlign: "center", marginTop: 4 }}>
                <span className={"pl-sit " + (
                  dISO(new Date()) < f.inicio ? "futura"
                  : dISO(new Date()) > f.fim ? "encerrada" : "ativa")}>
                  {dISO(new Date()) < f.inicio ? "futura"
                   : dISO(new Date()) > f.fim ? "encerrada" : "ativa"}
                  {" · até " + dBR(f.fim)}
                </span>
              </div>
            )}
          </div>
        ))}

        <div className="pl-lab">Objetivo</div>
        {fases.map((f, i) => <div className="pl-cel" key={"o" + i}>{cel(f, i, "objetivo", "", 5)}</div>)}

        <div className="pl-lab">Métodos</div>
        {fases.map((f, i) => <div className="pl-cel" key={"m" + i}>{cel(f, i, "metodos", "", 5)}</div>)}

        <div className="pl-lab">Observações</div>
        {fases.map((f, i) => <div className="pl-cel" key={"b" + i}>{cel(f, i, "observacao", "fobs", 3)}</div>)}
      </div>

      <div className="pl-hint">
        Preenche a data da <b>Fase 1</b> e clica em <b>Gerar datas</b> — as outras três e as
        observações da "Fase II" saem sozinhas, sempre em segunda-feira. Tudo continua editável.
        <br />
        Salvar cria as fases direto na tabela do App: o aluno passa a ver o planejamento por lá.
      </div>
    </div>
  );
}

/* ---------- Backup ---------- */
const TABELAS_BACKUP = [
  "alunos", "perfis", "treinos", "exercicios", "logs", "sessoes",
  "anamneses", "cardapio", "grupos_exibicao", "modalidades", "perguntas",
  "fases", "planejamentos", "fase_templates", "fase_categorias"
];

function PainelBackup() {
  const [estado, setEstado] = useState("idle");
  const [prog, setProg]     = useState([]);
  const [erro, setErro]     = useState("");

  async function exportar() {
    setEstado("rodando"); setErro(""); setProg([]);
    const dump = {
      gerado_em: new Date().toISOString(),
      projeto: SUPABASE_URL,
      versao: 1,
      tabelas: {}
    };
    const relato = [];

    for (const t of TABELAS_BACKUP) {
      let linhas = [], de = 0, pagina = 1000, erroT = null;
      try {
        for (;;) {
          const { data, error } = await sb.from(t).select("*")
            .range(de, de + pagina - 1);
          if (error) throw new Error(error.message);
          linhas = linhas.concat(data || []);
          if (!data || data.length < pagina) break;
          de += pagina;
          if (de > 200000) break;
        }
        dump.tabelas[t] = linhas;
      } catch (e) {
        erroT = e.message;
        dump.tabelas[t] = { erro: e.message };
      }
      relato.push({ tabela: t, linhas: erroT ? null : linhas.length, erro: erroT });
      setProg([...relato]);
    }

    const total = relato.reduce((a, r) => a + (r.linhas || 0), 0);
    dump.resumo = { total_linhas: total, tabelas: relato };

    const blob = new Blob([JSON.stringify(dump, null, 1)],
      { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "idealis_backup_" +
      new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setEstado("idle");
  }

  async function exportarCsv() {
    setEstado("rodando"); setErro("");
    try {
      const { data, error } = await sb.from("anamneses")
        .select("aluno_id, texto, origem, criado_em");
      if (error) throw new Error(error.message);
      const al = await sb.from("alunos").select("id, nome, status");
      if (al.error) throw new Error(al.error.message);
      const nomes = new Map((al.data || []).map(x => [x.id, x.nome]));
      const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const linhas = [["nome", "criado_em", "origem", "texto"].map(esc).join(",")];
      for (const r of (data || [])) {
        linhas.push([nomes.get(r.aluno_id) || r.aluno_id,
          r.criado_em, r.origem, r.texto].map(esc).join(","));
      }
      const blob = new Blob(["\ufeff" + linhas.join("\r\n")],
        { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "idealis_anamneses_" +
        new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) { setErro(e.message); }
    setEstado("idle");
  }

  return (
    <div>
      <div className="box">
        <h2>Backup completo</h2>
        <p>
          Baixa um JSON com todas as tabelas. Guarda no Drive ou fora do
          computador — backup que mora só no fornecedor não é backup.
          O arquivo respeita as RLS: exporta o que o teu login enxerga.
        </p>
        {erro && <div className="err">{erro}</div>}
        <div className="acoes">
          <button onClick={exportar} disabled={estado !== "idle"}>
            {estado === "rodando" ? "Exportando..." : "Baixar backup (JSON)"}
          </button>
          <button className="btn-sec" onClick={exportarCsv} disabled={estado !== "idle"}>
            Só anamneses (CSV)
          </button>
        </div>
        {prog.length > 0 && (
          <div className="lista" style={{ marginTop: 16 }}>
            {prog.map(r => (
              <div className="item" key={r.tabela}>
                <span className="enm">{r.tabela}</span>
                <span className={"etg" + (r.erro ? " vazio" : "")}>
                  {r.erro ? r.erro : r.linhas + " linha(s)"}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="futuro">
        <b>⚠️ O que este backup NÃO cobre</b>
        Views, policies, funções e triggers não vêm no JSON — só os dados.
        Para reconstruir a estrutura, guarda os scripts SQL junto
        (volume_RECONSTRUIR, anamnese_setup, status_alunos, anamnese_editavel).
        As fotos do Storage também ficam de fora.
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [sessao, setSessao] = useState(undefined);
  const [aba, setAba] = useState("alunos");

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSessao(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSessao(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (sessao === undefined) return <div className="msg">Carregando...</div>;
  if (!sessao) return <Login />;

  return (
    <div>
      <div className="top">
        <Logo size={36} />
        <button className="sair" onClick={() => sb.auth.signOut()}>Sair</button>
      </div>
      <div className="tabs">
        <button className={"tab" + (aba === "alunos" ? " on" : "")}
          onClick={() => setAba("alunos")}>Alunos</button>
        <button className={"tab" + (aba === "volume" ? " on" : "")}
          onClick={() => setAba("volume")}>Volume</button>
        <button className={"tab" + (aba === "catalogo" ? " on" : "")}
          onClick={() => setAba("catalogo")}>Catálogo</button>
        <button className={"tab" + (aba === "planejamento" ? " on" : "")}
          onClick={() => setAba("planejamento")}>Planejamento</button>
        <button className={"tab" + (aba === "backup" ? " on" : "")}
          onClick={() => setAba("backup")}>Backup</button>
      </div>
      {aba === "alunos" ? <PainelAlunos />
        : aba === "volume" ? <PainelVolume />
        : aba === "planejamento" ? <PainelPlanejamento />
        : aba === "backup" ? <PainelBackup />
        : <PainelCatalogo />}
    </div>
  );
}

/* ---------- PWA: instalação e service worker ---------- */
function BotaoInstalar() {
  const [evt, setEvt] = useState(null);
  const [oculto, setOculto] = useState(false);

  useEffect(() => {
    const h = (e) => { e.preventDefault(); setEvt(e); };
    window.addEventListener("beforeinstallprompt", h);
    const ok = () => { setEvt(null); setOculto(true); };
    window.addEventListener("appinstalled", ok);
    return () => {
      window.removeEventListener("beforeinstallprompt", h);
      window.removeEventListener("appinstalled", ok);
    };
  }, []);

  if (!evt || oculto) return null;

  return (
    <div className="instalar">
      <Logo size={30} />
      <div>
        <b>Instalar no celular</b>
        Abre direto da tela inicial, sem barra do navegador.
      </div>
      <button onClick={async () => {
        evt.prompt();
        try { await evt.userChoice; } catch (e) {}
        setEvt(null);
      }}>Instalar</button>
      <button className="x" onClick={() => setOculto(true)}>×</button>
    </div>
  );
}

function Raiz() {
  return <><App /><BotaoInstalar /></>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);

/* registro do SW — com kill switch por ?sw=off */
(function () {
  if (!("serviceWorker" in navigator)) return;
  const desligar = new URLSearchParams(location.search).get("sw") === "off";

  if (desligar) {
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.map(r => r.unregister())))
      .then(() => caches.keys())
      .then(ks => Promise.all(ks.map(k => caches.delete(k))))
      .then(() => console.log("[sw] desregistrado e caches limpos"));
    return;
  }

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => {
        /* procura versão nova toda vez que a aba volta ao foco */
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      })
      .catch(e => console.log("[sw] não registrou:", e.message));
  });
})();
</script>
