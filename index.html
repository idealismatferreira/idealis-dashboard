          </div>

          <div className="ed-lab">Tipo</div>
          <div className={"ed-tog" + (ehCard ? " on" : "")}
            onClick={() => setEhCard(v => !v)}>
            <div className="sw"><i /></div>
            <div>
              <b>🏃 Cardio</b>
              <span>Ative se este exercício for cardio</span>
            </div>
          </div>

          {ehCard ? (
            <>
              <div className="ed-lab">
                Nome do protocolo <i>{duracaoCardio(card) || "—"}</i>
              </div>
              <input value={card.nome}
                onChange={e => setCard(c => ({ ...c, nome: e.target.value }))}
                placeholder='Ex: HIIT 60"/30"' style={{ marginBottom: 0 }} />

              <div className="ed-lab">Repetir o conjunto</div>
              <Chips opcoes={[1,2,3,4,5,6,8,10,12]} valor={card.repetir}

              <input type="number" min="1" value={card.repetir}

              <div className="ed-lab">

              {card.blocos.length === 0 && (
                <div className="ed-cnt" style={{ marginBottom: 8 }}>
                  Nenhum bloco ainda. Ex: 60s Leve + 30s Forte, repetindo 8×.

              )}
              {card.blocos.map((b, i) => (
                <div className="cd-bl" key={i}
                  style={{ borderLeftColor: corNivel(b.nivel) }}>
                  <div className="cd-top">
                    <span className="cd-n">{i + 1}</span>
                    <div className="chips" style={{ flex: 1 }}>
                      {NIVEIS.map(n => (
                        <button key={n.id}
                          className={"chip mini" + (b.nivel === n.id ? " on" : "")}
                          onClick={() => mudarBloco(i, "nivel", n.id)}
                          style={b.nivel === n.id
                            ? { background: n.cor, borderColor: n.cor, color: "#04191c" }
                            : {}}>
                          {n.nome}
                        </button>
                      ))}
                    </div>
                    <div className="cd-ferr">
                      <button onClick={() => moverBloco(i, -1)}>▲</button>
                      <button onClick={() => moverBloco(i, 1)}>▼</button>
                      <button onClick={() => removeBloco(i)}>×</button>

                  </div>
                  <div className="cd-lin">
                    <input value={b.tempo}
                      onChange={e => mudarBloco(i, "tempo", e.target.value)}
                      placeholder="60s" style={{ width: 74, marginBottom: 0 }} />
                    <input value={b.rotulo}
                      onChange={e => mudarBloco(i, "rotulo", e.target.value)}

                  <div className="chips" style={{ marginTop: 6 }}>

          ) : (
          <>

            Método
            {metodo && <i onClick={() => setMetodo(null)}

          </div>

          <button onClick={salvar} disabled={busy || !nome.trim()}>

    </>
  );

/* ---------- Montagem de treino (leitura) ---------- */
/* Fase A: só lê. Nada aqui escreve no banco — o App Idealis
   continua sendo o único que grava treino/exercício por enquanto. */

/* método jsonb -> uma linha de texto por série */
function fmtMetodo(m) {
  if (!m || !Array.isArray(m.series) || !m.series.length) return null;
  return m.series.map((sr, i) => {
    const p = [(i + 1) + "ª"];
    if (sr.reps) p.push(sr.reps);
    if (Array.isArray(sr.blocos) && sr.blocos.length) {
      p.push("[" + sr.blocos
        .map(b => b.pausa ? ("pausa " + b.pausa) : (b.reps || ""))
        .filter(Boolean).join(" → ") + "]");
    }
    if (sr.carga) p.push("· " + sr.carga);
    if (sr.descanso) p.push("· desc " + sr.descanso);
    if (Array.isArray(sr.extensao) && sr.extensao.length) {
      p.push("+ " + sr.extensao.map(x => {
        const det = [x.reducao, x.reps, x.duracao, x.pausa].filter(Boolean).join(" ");
        return det ? (x.tipo || "ext") + " (" + det + ")" : (x.tipo || "ext");
      }).join(" + "));
    }
    return p.join(" ");
  });
}

/* cardio jsonb -> { rep, blocos[] } */
function fmtCardio(c) {
  if (!c || !Array.isArray(c.blocos) || !c.blocos.length) return null;
  return {
    rep: c.repetir ? c.repetir + "x" : "",
    blocos: c.blocos.map(b => (b.tempo || "?") + " " + (b.rotulo || b.nivel || ""))
  };
}

function nSeriesDe(ex) {
  if (ex.metodo && Array.isArray(ex.metodo.series)) return ex.metodo.series.length;
  const m = String(ex.series || "").match(/^\s*(\d+)\s*[x×]/i);
  return m ? +m[1] : null;
}

function situacaoFase(f, hojeISO) {
  if (f.fim && f.fim < hojeISO) return "encerrada";
  if (f.inicio && f.inicio > hojeISO) return "futura";
  return "ativa";
}

function PainelMontagem() {
  const { alunoId: sel, alunos } = usarAluno();
  const { toast, confirmar } = usarUI();
  const [fases, setFases]   = useState([]);
  const [faseSel, setFaseSel] = useState("");
  const [aba, setAbaF]      = useState("atuais");
  const [treinos, setTreinos] = useState([]);
  const [exs, setExs]       = useState({});
  const [erro, setErro]     = useState("");
  const [carregando, setCarr] = useState(false);
  const [editando, setEdit] = useState(null);   // {ex} ou {treinoId, ordem}
  const [relatos, setRelatos] = useState({});

  const hoje = dISO(new Date());

  const carregar = useCallback(async (alunoId) => {
    if (!alunoId) { setFases([]); setTreinos([]); setExs({}); setCarr(false); return; }
    setCarr(true); setErro(""); setTreinos([]); setExs({});
    const f = await sb.from("fases").select("*")
      .eq("aluno_id", alunoId).order("inicio", { ascending: false });
    if (f.error) { setErro(f.error.message); setCarr(false); return; }
    setFases(f.data || []);
    setFaseSel("");
    setCarr(false);
  }, []);

  useEffect(() => { carregar(sel); }, [sel, carregar]);

  /* carrega treinos + exercícios da fase escolhida */
  const abrirFase = useCallback(async (faseId) => {
    setFaseSel(faseId);
    setCarr(true); setErro(""); setTreinos([]); setExs({});
    const t = await sb.from("treinos").select("*")
      .eq("fase_id", faseId).order("ordem");
    if (t.error) { setErro(t.error.message); setCarr(false); return; }
    const lista = t.data || [];
    setTreinos(lista);
    if (lista.length) {
      const e = await sb.from("exercicios").select("*")
        .in("treino_id", lista.map(x => x.id)).order("ordem");
      if (e.error) { setErro(e.error.message); setCarr(false); return; }
      const mapa = {};
      for (const x of (e.data || [])) {
        (mapa[x.treino_id] = mapa[x.treino_id] || []).push(x);
      }
      setExs(mapa);

      /* anotações do aluno por exercício — a tabela pode não existir ainda,
         então falha em silêncio em vez de quebrar a tela */
      const r = await sb.from("relatos")
        .select("id, exercicio_id, exercicio_nome, data, texto, fixado, created_at")
        .in("exercicio_id", (e.data || []).map(x => x.id))
        .order("fixado", { ascending: false })
        .order("data", { ascending: false, nullsFirst: false })
        .order("created_at", { ascending: false });
      if (r.error) { setErro("relatos: " + r.error.message); }
      else {
        const mr = {};
        for (const x of (r.data || [])) {
          (mr[x.exercicio_id] = mr[x.exercicio_id] || []).push(x);
        }
        setRelatos(mr);
      }
    }
    setCarr(false);
  }, []);

  const porAba = fases.filter(f => {
    const st = situacaoFase(f, hoje);
    return aba === "atuais" ? st === "ativa"
         : aba === "anteriores" ? st === "encerrada"
         : st === "futura";
  });

  const cont = {
    atuais: fases.filter(f => situacaoFase(f, hoje) === "ativa").length,
    anteriores: fases.filter(f => situacaoFase(f, hoje) === "encerrada").length,
    futuros: fases.filter(f => situacaoFase(f, hoje) === "futura").length
  };

  async function moverEx(lista, i, dir) {
    const j = i + dir;
    if (j < 0 || j >= lista.length) return;
    const a = lista[i], b = lista[j];
    const oa = a.ordem ?? i, ob = b.ordem ?? j;
    const r1 = await sb.from("exercicios").update({ ordem: ob }).eq("id", a.id);
    const r2 = await sb.from("exercicios").update({ ordem: oa }).eq("id", b.id);
    if (r1.error || r2.error) { setErro((r1.error || r2.error).message); return; }
    await abrirFase(faseSel);
  }

  async function apagarEx(ex) {
    const ok = await confirmar({
      titulo: "Apagar exercício?",
      texto: '"' + ex.nome + '" será removido do treino.',
      alerta: "Os registros de carga do aluno neste exercício vão junto e não voltam.",
      ok: "Apagar", perigo: true
    });
    if (!ok) return;
    const r = await sb.from("exercicios").delete().eq("id", ex.id);
    if (r.error) { toast(r.error.message, "erro"); return; }
    toast("Exercício apagado.");
    await abrirFase(faseSel);
  }

  function Exercicio({ ex, lista, i }) {
    const n = nSeriesDe(ex);
    const met = fmtMetodo(ex.metodo);
    const car = fmtCardio(ex.cardio);
    const reps = String(ex.series || "").replace(/^\s*\d+\s*[x×]\s*/i, "");
    return (
      <div className="mt-ex">
        <div className="ferr">
          <button onClick={() => moverEx(lista, i, -1)} title="Subir">▲</button>
          <button onClick={() => moverEx(lista, i, 1)} title="Descer">▼</button>
          <button onClick={() => setEdit({ ex })} title="Editar">✎</button>
          <button onClick={() => apagarEx(ex)} title="Apagar">×</button>
        </div>
        <div className="lin1">
          <span className="ord">{(ex.ordem ?? 0) + 1}</span>
          <span className="nm">{ex.nome}</span>
          <span className="sr">
            {car ? "cardio" : (n ? n + "×" + (reps ? " " + reps : "") : "—")}
          </span>
        </div>
        {(ex.descanso || (ex.metodo && ex.metodo.nome)) && (
          <div className="sub">
            {ex.descanso && "desc " + ex.descanso}
            {ex.descanso && ex.metodo && ex.metodo.nome && " · "}
            {ex.metodo && ex.metodo.nome}
          </div>
        )}
        {met && (
          <div className="mt-det">
            <div className="tit">{(ex.metodo && ex.metodo.nome) || "Método"}</div>
            {met.map((l, i) => <div key={i}>{l}</div>)}
          </div>
        )}
        {car && (
          <div className="mt-det c">
            <div className="tit">{(ex.cardio && ex.cardio.nome) || "Cardio"}</div>
            <div>{car.rep ? car.rep + " → " : ""}{car.blocos.join("  |  ")}</div>
          </div>
        )}
        {ex.observacao && <div className="obs">“{ex.observacao}”</div>}
        {(() => {
          const todos = relatos[ex.id] || [];
          const fix = todos.filter(r => r.fixado);
          const resto = todos.filter(r => !r.fixado).slice(0, 3);
          const mostrar = [...fix, ...resto];
          const ocultos = todos.length - mostrar.length;
          return (
            <>
              {mostrar.map(r => (
                <div className={"rel" + (r.fixado ? " fix" : "")} key={r.id}>
                  <div className="quem">
                    {r.fixado && "📌 "}
                    {dBR(String(r.data || r.created_at).slice(0, 10))} · aluno
                  </div>
                  <div className="txt">{r.texto}</div>
                </div>
              ))}
              {ocultos > 0 && (
                <div className="rel-mais">+{ocultos} relato(s) mais antigo(s)</div>
              )}
            </>
          );
        })()}
        <div className="mt-tags">
          {ex.metodo && <span className="mt-tag met">método</span>}
          {ex.cardio && <span className="mt-tag car">cardio</span>}
          {ex.filmar && <span className="mt-tag flm">filmar</span>}

/* ---------- Aparelhos das academias do aluno ---------- */
/* Mesma matriz da aba geral, mas filtrada nas academias do aluno.
   É o contexto em que a informação realmente importa. */
function PainelAparelhosAluno({ aluno }) {
  const [eqs, setEqs]     = useState([]);
  const [acs, setAcs]     = useState([]);
  const [mat, setMat]     = useState({});
  const [busca, setBusca] = useState("");
  const [cat, setCat]     = useState("");
  const [soFalta, setSoFalta] = useState(false);
  const [erro, setErro]   = useState("");
  const [carr, setCarr]   = useState(true);

  const carregar = useCallback(async () => {
    setCarr(true); setErro("");
    const v = await sb.from("aluno_academias")
      .select("academia_id, principal, academias(id, nome, cidade)")
      .eq("aluno_id", aluno.id);
    if (v.error) { setErro(v.error.message); setCarr(false); return; }
    const minhas = (v.data || []).map(x => x.academias).filter(Boolean);
    setAcs(minhas);
    if (!minhas.length) { setCarr(false); return; }

    const [e, m] = await Promise.all([
      sb.from("equipamentos").select("*").eq("ativo", true)
        .order("categoria").order("ordem").order("nome"),
      sb.from("academia_equipamentos").select("*")
        .in("academia_id", minhas.map(a => a.id))
    ]);
    if (e.error || m.error) { setErro((e.error || m.error).message); setCarr(false); return; }
    setEqs(e.data || []);
    const mp = {};
    for (const x of (m.data || [])) {
      mp[x.academia_id + "|" + x.equipamento_id] = { estado: x.estado, detalhe: x.detalhe };
    }
    setMat(mp); setCarr(false);
  }, [aluno.id]);

  useEffect(() => { carregar(); }, [carregar]);

  async function gravar(acId, eqId, estado, detalhe) {
    const k = acId + "|" + eqId;
    const antes = mat[k];
    setMat(m => {
      const n = { ...m };
      if (estado) n[k] = { estado, detalhe: detalhe ?? null }; else delete n[k];
      return n;
    });
    const r = estado
      ? await sb.from("academia_equipamentos").upsert({
          academia_id: acId, equipamento_id: eqId, estado,
          detalhe: detalhe ?? null, atualizado_em: new Date().toISOString()
        }, { onConflict: "academia_id,equipamento_id" })
      : await sb.from("academia_equipamentos").delete()
          .eq("academia_id", acId).eq("equipamento_id", eqId);
    if (r.error) {
      setErro(r.error.message);
      setMat(m => { const n = { ...m }; if (antes) n[k] = antes; else delete n[k]; return n; });
    }
  }

  function clicar(acId, eqId) {
    const at = mat[acId + "|" + eqId];
    const prox = CICLO[at ? at.estado : "undefined"];
    gravar(acId, eqId, prox, prox === "tem" ? (at && at.detalhe) : null);
  }

  function editarDetalhe(acId, eqId, nomeEq) {
    const at = mat[acId + "|" + eqId];
    if (!at || at.estado !== "tem") return;
    const v = window.prompt('Faixa ou quantidade de "' + nomeEq + '" (ex: 1~5)',
      at.detalhe || "");
    if (v === null) return;
    gravar(acId, eqId, "tem", v.trim() || null);
  }

  if (carr) return <div className="msg">Carregando...</div>;
  if (erro)  return <div className="err">{erro}</div>;
  if (!acs.length) return (
    <div className="sem-aluno">
      <b>Sem academia vinculada</b>
      Vincula uma academia na aba <b>Academias</b> para ver os aparelhos aqui.
    </div>
  );

  const cats = [...new Set(eqs.map(e => e.categoria))];
  const semMarca = e => acs.every(a => !mat[a.id + "|" + e.id]);
  const visiveis = eqs.filter(e =>
    (!cat || e.categoria === cat) &&
    (!busca.trim() || cbCasa(e.nome + " " + e.categoria, busca)) &&
    (!soFalta || semMarca(e)));

  const totalMarcado = eqs.filter(e => !semMarca(e)).length;
  const faltam = eqs.length - totalMarcado;

  const linhas = [];
  let catAtual = null;
  for (const e of visiveis) {
    if (e.categoria !== catAtual) { catAtual = e.categoria; linhas.push({ cat: catAtual }); }
    linhas.push({ eq: e });
  }

  return (
    <div>
      <div className="ed-cnt" style={{ marginBottom: 11, lineHeight: 1.7 }}>
        {acs.map(a => a.nome).join(" · ")}
        <br />
        <b style={{ color: faltam ? "var(--warn)" : "var(--accent)" }}>
          {totalMarcado} de {eqs.length} equipamentos marcados
        </b>
        {faltam > 0 && " · faltam " + faltam + " sem marcação"}
      </div>

      <div className="ap-bar">
        <div style={{ position: "relative", flex: "0 1 200px" }}>
          <input value={busca} onChange={e => setBusca(e.target.value)}
            placeholder="Buscar equipamento..." />
          {busca && <button className="cb-lim" onClick={() => setBusca("")}>×</button>}
        </div>
        <button className={"fbtn" + (soFalta ? " on" : "")}
          onClick={() => setSoFalta(v => !v)}>
          {soFalta ? "Vendo só os que faltam" : "Só o que falta"}
        </button>
      </div>
      <div className="ap-bar">
        <button className={"fbtn" + (!cat ? " on" : "")} onClick={() => setCat("")}>Todas</button>
        {cats.map(c => (
          <button key={c} className={"fbtn" + (cat === c ? " on" : "")}
            onClick={() => setCat(c)}>{c}</button>
        ))}
      </div>

      {visiveis.length === 0
        ? <div className="msg">
            {soFalta ? "Tudo marcado nesta seleção. 🎉" : "Nada encontrado."}
          </div>
        : (
        <div className="ap-wrap" style={{ maxHeight: "none" }}>
          <table className="ap-tab solo">
            <thead>
              <tr>
                <th className="eq">Equipamento</th>
                {acs.map(a => <th key={a.id} title={a.nome}>
                  <span className="ap-h-nome">{a.nome}</span></th>)}
              </tr>
            </thead>
            <tbody>
              {linhas.map((l, i) => l.cat ? (
                <tr className="ap-cat" key={"c" + i}>
                  <td className="eq">{l.cat}</td>
                  {acs.map(a => <td key={a.id} />)}
                </tr>
              ) : (
                <tr key={l.eq.id}>
                  <td className="eq" title={l.eq.nome}>{l.eq.nome}</td>
                  {acs.map(a => {
                    const v = mat[a.id + "|" + l.eq.id];
                    const st = v ? v.estado : "nao_tem";
                    return (
                      <td key={a.id} className={"ap-cel " + st}
                        onClick={() => clicar(a.id, l.eq.id)}
                        onDoubleClick={ev => { ev.preventDefault();
                          editarDetalhe(a.id, l.eq.id, l.eq.nome); }}
                        title="clique: alterna · duplo clique: faixa">
                        {st === "tem" && v.detalhe
                          ? <span className="det">{v.detalhe}</span>
                          : <span className="v">
                              {st === "tem" ? "✓" : st === "incerto" ? "?" : ""}
                            </span>}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="ap-leg">
        <span><b>clique</b> alterna · <b>duplo clique</b> anota faixa</span>
      </div>
    </div>
  );
}

/* ---------- Academias do aluno ---------- */
function PainelAcademiasAluno({ aluno }) {
  const [acs, setAcs]   = useState([]);
  const [meus, setMeus] = useState(new Set());
  const [inv, setInv]   = useState({});
  const [erro, setErro] = useState("");
  const [busca, setBusca] = useState("");
  const [carr, setCarr] = useState(true);

  const carregar = useCallback(async () => {
    setCarr(true); setErro("");
    const [a, v, m] = await Promise.all([
      sb.from("academias").select("id, nome, cidade").eq("ativa", true).order("nome"),
      sb.from("aluno_academias").select("academia_id, principal").eq("aluno_id", aluno.id),
      sb.from("academia_equipamentos").select("academia_id")
    ]);
    if (a.error || v.error) { setErro((a.error || v.error).message); setCarr(false); return; }
    setAcs(a.data || []);
    setMeus(new Set((v.data || []).map(x => x.academia_id)));
    const cnt = {};
    for (const x of (m.error ? [] : (m.data || []))) {
      cnt[x.academia_id] = (cnt[x.academia_id] || 0) + 1;
    }
    setInv(cnt); setCarr(false);
  }, [aluno.id]);

  useEffect(() => { carregar(); }, [carregar]);

  async function alternar(ac) {
    const tinha = meus.has(ac.id);
    setMeus(m => { const n = new Set(m); tinha ? n.delete(ac.id) : n.add(ac.id); return n; });
    const r = tinha
      ? await sb.from("aluno_academias").delete()
          .eq("aluno_id", aluno.id).eq("academia_id", ac.id)
      : await sb.from("aluno_academias")
          .insert({ aluno_id: aluno.id, academia_id: ac.id });
    if (r.error) {
      setErro(r.error.message);
      setMeus(m => { const n = new Set(m); tinha ? n.add(ac.id) : n.delete(ac.id); return n; });
    }
  }

  const lista = acs.filter(a => !busca.trim() || cbCasa(a.nome + " " + (a.cidade || ""), busca));
  const ordenada = [...lista].sort((x, y) => {
    const mx = meus.has(x.id), my = meus.has(y.id);
    if (mx !== my) return mx ? -1 : 1;
    return String(x.nome).localeCompare(String(y.nome), "pt-BR");
  });

  return (
    <div>
      {erro && <div className="err">{erro}</div>}
      <div style={{ position: "relative", marginBottom: 14 }}>
        <input value={busca} onChange={e => setBusca(e.target.value)}
          placeholder="Buscar academia..." style={{ marginBottom: 0 }} />
        {busca && <button className="cb-lim" onClick={() => setBusca("")}>×</button>}
      </div>
      <div className="ed-cnt" style={{ marginBottom: 10 }}>
        {meus.size === 0 ? "Nenhuma academia vinculada."
          : meus.size + " academia(s) vinculada(s) · clique para alternar"}
      </div>
      {carr ? <div className="msg">Carregando...</div>
       : ordenada.map(a => {
          const on = meus.has(a.id);
          const n = inv[a.id] || 0;
          return (
            <div key={a.id} className={"ac-chip" + (on ? " on" : "")}
              onClick={() => alternar(a)}>
              <span className="bx">{on ? "✓" : ""}</span>
              <span>{a.nome}{a.cidade ? " · " + a.cidade : ""}</span>
              <span className={"inv" + (n === 0 ? " zero" : "")}>
                {n === 0 ? "sem inventário" : n + " marcados"}
              </span>
            </div>
          );
        })}
    </div>
  );
}

/* pega o primeiro campo que existir — os nomes das views podem variar */
const campo = (o, ...nomes) => {
  for (const n of nomes) if (o && o[n] !== undefined && o[n] !== null) return o[n];
  return null;
};

/* Heatmap em CANVAS, não SVG.
   87 alunos × 56 dias daria ~4.900 nós no DOM e travaria a lista.
   Em canvas é 1 elemento por aluno, desenhado uma vez.

   ATENÇÃO ao alinhamento: a grade precisa começar num DOMINGO.
   Antes eu montava blocos de 7 dias corridos a partir de "56 dias atrás",
   então cada dia caía numa linha errada e o desenho não tinha relação
   com a agenda real. */

/* mesma escala do App Idealis: menos → mais volume */
const HM_CORES = ["#16232a", "#1a5f63", "#0d9aa3", "#00daef", "#dbff00"];
const HM_SEMANAS = 8;

function gradeHeatmap() {
  const hoje = new Date();
  const dom = new Date(hoje);
  dom.setHours(12, 0, 0, 0);
  dom.setDate(dom.getDate() - dom.getDay());     /* domingo desta semana */
  const ini = new Date(dom);
  ini.setDate(ini.getDate() - 7 * (HM_SEMANAS - 1));
  const cels = [];
  for (let i = 0; i < HM_SEMANAS * 7; i++) {
    const d = new Date(ini.getTime() + i * 864e5);
    cels.push({ iso: dISO(d), col: Math.floor(i / 7), lin: d.getDay(),
                futuro: d > hoje });
  }
  return cels;
}

function Heatmap({ dias, nome }) {
  const ref = React.useRef(null);
  const CEL = 5, GAP = 1, COLS = HM_SEMANAS, LINS = 7;

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const w = COLS * (CEL + GAP) - GAP, h = LINS * (CEL + GAP) - GAP;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + "px"; cv.style.height = h + "px";
    const x = cv.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);

    const mapa = dias || {};
    for (const c of gradeHeatmap()) {
      const v = mapa[c.iso] || 0;
      const nivel = v <= 0 ? 0 : Math.min(4, v);
      x.globalAlpha = c.futuro ? 0.3 : 1;
      x.fillStyle = HM_CORES[nivel];
      x.fillRect(c.col * (CEL + GAP), c.lin * (CEL + GAP), CEL, CEL);
    }
    x.globalAlpha = 1;
  }, [dias]);

  /* tooltip com os dias reais, para conferir contra o app */
  const mapa = dias || {};
  const marcados = Object.keys(mapa).filter(k => mapa[k] > 0).sort().slice(-10);
  const titulo = (nome ? nome + " · " : "") + HM_SEMANAS + " semanas" +
    (marcados.length
      ? "\núltimos treinos: " + marcados.map(k => dBR(k)).join(", ")
      : "\nnenhum treino registrado no período");

  return <canvas ref={ref} className="ac-hm" title={titulo} />;
}

function PainelAcompanhamento() {
  const { setAlunoId } = usarAluno();
  const [linhas, setLinhas] = useState(null);
  const [cal, setCal]       = useState({});
  const [resumo, setResumo] = useState({});
  const [semana, setSemana] = useState(undefined);
  const [erro, setErro]     = useState("");
  const [diag, setDiag]     = useState("");
  const [busca, setBusca]   = useState("");
  const [aberto, setAberto] = useState(null);
  const [ordem, setOrdem]   = useState("risco");

  const carregar = useCallback(async () => {
    setErro(""); setDiag("");
    const [ac, sm] = await Promise.all([
      sb.from("v_acompanhamento").select("*"),
      sb.from("v_semana_atual").select("*")
    ]);
    if (ac.error) { setErro("v_acompanhamento: " + ac.error.message); setLinhas([]); return; }
    const dados = ac.data || [];
    setLinhas(dados);
    setSemana(sm.error ? null : ((sm.data && sm.data[0]) || null));

    /* se os campos esperados não vierem, mostra o que veio em vez de quebrar */
    if (dados.length) {
      const k = Object.keys(dados[0]);
      const faltando = ["semana", "tarefas_feitas", "tarefas_total", "treinos_7d"]
        .filter(x => !k.includes(x));
      if (faltando.length) {
        setDiag("Campos não encontrados em v_acompanhamento: " + faltando.join(", ") +
          "\nColunas disponíveis: " + k.join(", "));
      }
    }

    /* v_acompanhamento.treinos_7d conta ACESSOS ao app.
       v_treinos_resumo separa: dias com treino concluído × acessos. */
    const rs = await sb.from("v_treinos_resumo").select("*");
    if (!rs.error) {
      const m = {};
      for (const r of (rs.data || [])) m[r.aluno_id] = r;
      setResumo(m);
    }

    /* calendário em UMA consulta, agrupado no cliente */
    const cl = await sb.from("v_calendario_treinos").select("*");
    if (!cl.error) {
      const m = {};
      for (const r of (cl.data || [])) {
        const aid = campo(r, "aluno_id", "aluno");
        const dt = String(campo(r, "data", "dia") || "").slice(0, 10);
        const vz = campo(r, "vezes", "treinos", "qtd") || 1;
        if (!aid || !dt) continue;
        (m[aid] = m[aid] || {})[dt] = vz;
      }
      setCal(m);
    }
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  /* badge: só o que dá para afirmar com os dados desta view.
     Vermelho por red flag é certeza; amarelo aqui é sinal operacional. */
  function risco(l) {
    const rf = campo(l, "red_flags_abertas", "red_flags") || 0;
    if (rf > 0) return { n: "r", txt: rf + " red flag(s) aberta(s)" };

    const aid = campo(l, "aluno_id", "id");
    const rz  = resumo[aid] || {};
    const dias    = rz.dias_7d ?? null;
    const acessos = rz.acessos_7d ?? 0;
    const abertos = rz.nao_concluidos_7d ?? 0;
    const feitas  = campo(l, "tarefas_feitas") || 0;
    const total   = campo(l, "tarefas_total") || 0;

    if (dias === 0 && acessos === 0)
      return { n: "a", txt: "não abriu o app nos últimos 7 dias" };
    if (dias === 0 && acessos > 0)
      return { n: "a", txt: "abriu o app " + acessos + "× mas não concluiu nenhum treino" };
    /* abre bastante e conclui pouco: sinal de desistência no meio */
    if (dias > 0 && abertos >= 2 && abertos > dias)
      return { n: "a", txt: abertos + " treino(s) abertos sem concluir contra " +
        dias + " concluído(s)" };
    if (total > 0 && feitas === 0)
      return { n: "a", txt: "nenhuma tarefa entregue nesta semana" };
    return { n: "v", txt: (dias || 0) + " dia(s) com treino concluído em 7 dias" };
  }

  const visiveis = (linhas || [])
    .filter(l => !busca.trim() || cbCasa(String(campo(l, "aluno", "nome") || ""), busca))
    .map(l => ({ l, r: risco(l) }))
    .sort((a, b) => {
      if (ordem === "risco") {
        const p = { r: 0, a: 1, v: 2 };
        if (p[a.r.n] !== p[b.r.n]) return p[a.r.n] - p[b.r.n];
      }
      if (ordem === "treinos") {
        const ta = (resumo[campo(a.l, "aluno_id", "id")] || {}).dias_7d ?? 0;
        const tb = (resumo[campo(b.l, "aluno_id", "id")] || {}).dias_7d ?? 0;
        if (ta !== tb) return ta - tb;
      }
      return String(campo(a.l, "aluno", "nome") || "")
        .localeCompare(String(campo(b.l, "aluno", "nome") || ""), "pt-BR");
    });

  const cont = (linhas || []).reduce((acc, l) => {
    acc[risco(l).n]++; return acc;
  }, { r: 0, a: 0, v: 0 });

  return (
    <div>
      {semana === undefined ? null : semana ? (
        <div className="ac-ciclo">
          <div>
            <div className="sem">
              Semana {campo(semana, "semana", "numero", "semana_atual") || "?"}
            </div>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="rot">{campo(semana, "rotulo", "semana_rotulo") || "—"}</div>
            <div className="det">
              {campo(semana, "nota", "observacao") ||
                "timeline global · vale para todos os alunos"}
            </div>
          </div>
          <div style={{ display: "flex", gap: 14 }}>
            <div className="ac-num"><b style={{ color: "var(--alert)" }}>{cont.r}</b>
              <span>atenção alta</span></div>
            <div className="ac-num"><b style={{ color: "var(--warn)" }}>{cont.a}</b>
              <span>observar</span></div>
            <div className="ac-num"><b style={{ color: "var(--accent)" }}>{cont.v}</b>
              <span>estável</span></div>
          </div>
        </div>
      ) : (
        <div className="ac-ciclo vazio">
          <div className="sem">—</div>
          <div style={{ flex: 1 }}>
            <div className="rot">Nenhum ciclo ativo</div>
            <div className="det">
              <code>v_semana_atual</code> voltou vazia. Ou o ciclo terminou,
              ou você está entre ciclos. A lista abaixo continua funcionando.
            </div>
          </div>
        </div>
      )}

      {erro && <div className="err">{erro}</div>}
      {diag && <div className="ac-diag">{diag}</div>}

      <div className="ap-bar">
        <div style={{ position: "relative", flex: "0 1 230px" }}>
          <input value={busca} onChange={e => setBusca(e.target.value)}
            placeholder="Buscar aluno..." />
          {busca && <button className="cb-lim" onClick={() => setBusca("")}>×</button>}
        </div>
        <button className={"fbtn" + (ordem === "risco" ? " on" : "")}
          onClick={() => setOrdem("risco")}>Por atenção</button>
        <button className={"fbtn" + (ordem === "treinos" ? " on" : "")}
          onClick={() => setOrdem("treinos")}>Por treinos</button>
        <button className={"fbtn" + (ordem === "nome" ? " on" : "")}
          onClick={() => setOrdem("nome")}>Por nome</button>
        <span style={{ flex: 1 }} />
        <span className="ed-cnt">{visiveis.length} aluno(s)</span>
      </div>

      {linhas === null ? <div className="msg">Carregando...</div>
       : visiveis.length === 0 ? <div className="msg">Nenhum aluno encontrado.</div>
       : (
        <>
          <div className="ac-head">
            <span />
            <span>Aluno</span>
            <span>treinou</span>
            <span>8 semanas</span>
            <span>Semana</span>
            <span />
          </div>
          {visiveis.map(({ l, r }) => {
            const aid  = campo(l, "aluno_id", "id");
            const nome = campo(l, "aluno", "nome") || "(sem nome)";
            const rz   = resumo[aid] || {};
            const dias = rz.dias_7d ?? campo(l, "treinos_7d", "treinos") ?? 0;
            const aces = rz.acessos_7d ?? null;
            const feitas = campo(l, "tarefas_feitas") || 0;
            const total  = campo(l, "tarefas_total") || 0;
            const sem    = campo(l, "semana", "semana_atual");
            const rot    = campo(l, "semana_rotulo");
            const entrou = campo(l, "entrou_na_semana");
            /* aluno que entrou depois: mostra a ordem dele, não a global */
            const minhaSem = (sem && entrou && entrou > 1)
              ? (sem - entrou + 1) : null;
            return (
              <div className={"ac-lin " + r.n} key={aid || nome}
                onClick={() => { if (aid) { setAlunoId(aid); setAberto({ id: aid, nome }); } }}>
                {campo(l, "foto_url")
                  ? <img className="av" style={{ width: 32, height: 32 }}
                      src={campo(l, "foto_url")} alt=""
                      onError={e => { e.target.style.visibility = "hidden"; }} />
                  : <div className="ph" style={{ width: 32, height: 32, fontSize: 11 }}>
                      {iniciais(nome)}
                    </div>}
                <div className="ac-nome">
                  {nome}
                  {minhaSem && <i>entrou na semana {entrou} · {minhaSem}ª dele</i>}
                </div>
                <div className={"ac-num" + (dias === 0 ? " zero" : "")}
                  title={"dias com treino concluído nos últimos 7 dias" +
                    (aces !== null ? "\napp acessado " + aces + "×" : "")}>
                  <b>{dias}</b>
                  <span>{aces !== null && aces > 0
                    ? "de " + aces + " acessos" : "treinos"}</span>
                </div>
                <Heatmap dias={cal[aid]} nome={nome} />
                <div className="ac-tar">
                  <div className="top">
                    <b>{sem ? "Sem " + sem + (campo(l, "semanas") ? "/" + campo(l, "semanas") : "")
                        : "—"}{rot ? " · " + rot : ""}</b>
                    <span>{total ? feitas + "/" + total : "—"}</span>
                  </div>
                  <div className="ac-bar">
                    <i className={feitas && feitas < total ? "parcial" : ""}
                      style={{ width: total ? Math.round(feitas / total * 100) + "%" : "0%" }} />
                  </div>
                </div>
                <span className={"ac-badge " + r.n} title={r.txt}
                  onClick={e => e.stopPropagation()} />
              </div>
            );
          })}
        </>
      )}

      {aberto && (
        <DrawerAnamnese aluno={{ id: aberto.id, nome: aberto.nome }}
          onFechar={() => setAberto(null)} />
      )}

      <div className="ap-leg" style={{ marginTop: 12 }}>
        <span><b>8 semanas</b> de treinos <b>concluídos</b> · coluna = semana, linha = dia (domingo em cima)</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          menos
          {HM_CORES.slice(1).map(c => (
            <i key={c} style={{ width: 9, height: 9, borderRadius: 2, background: c,
                                display: "inline-block" }} />
          ))}
          mais volume
        </span>
        <span>passa o mouse para ver as datas</span>
        <span>o número à esquerda é <b>dias treinados</b>, não acessos ao app</span>
      </div>

      <div className="pl-hint" style={{ marginTop: 12 }}>
        Clica no aluno para abrir a ficha. O ponto colorido é sinal operacional
        (red flag, ausência de treino, tarefas não entregues) — os sinais clínicos
        de irritabilidade e mecanismo entram na aba Dores.
      </div>
    </div>
  );
}

/* ---------- Aparelhos por academia ---------- */
/* Ausência de linha em academia_equipamentos SIGNIFICA "não tem".
   Por isso o ciclo apaga a linha em vez de gravar 'nao_tem' — mantém
   a tabela pequena e faz "academia sem marcação = não inventariada". */
const CICLO = { undefined: "tem", nao_tem: "tem", tem: "incerto", incerto: null };

function PainelAparelhos() {
  const { toast, confirmar } = usarUI();
  const [eqs, setEqs]       = useState([]);
  const [acs, setAcs]       = useState([]);
  const [mat, setMat]       = useState({});   // "acad|equip" -> {estado, detalhe}
  const [busca, setBusca]   = useState("");
  const [buscaAc, setBuscaAc] = useState("");
  const [foco, setFoco]     = useState("");
  const [cat, setCat]       = useState("");
  const [erro, setErro]     = useState("");
  const [aviso, setAviso]   = useState("");
  const [carr, setCarr]     = useState(true);
  const [novoEq, setNovoEq] = useState("");
  const [novaCat, setNovaCat] = useState("Acessórios");
  const [novaAc, setNovaAc] = useState("");
  const [copiaDe, setCopiaDe] = useState("");
  const [copiaPara, setCopiaPara] = useState("");

  const carregar = useCallback(async () => {
    setCarr(true); setErro("");
    const [e, a, m] = await Promise.all([
      sb.from("equipamentos").select("*").eq("ativo", true)
        .order("categoria").order("ordem").order("nome"),
      sb.from("academias").select("*").eq("ativa", true).order("nome"),
      sb.from("academia_equipamentos").select("*")
    ]);
    if (e.error || a.error || m.error) {
      setErro((e.error || a.error || m.error).message); setCarr(false); return;
    }
    setEqs(e.data || []); setAcs(a.data || []);
    const mp = {};
    for (const x of (m.data || [])) {
      mp[x.academia_id + "|" + x.equipamento_id] = { estado: x.estado, detalhe: x.detalhe };
    }
    setMat(mp); setCarr(false);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  async function gravar(acId, eqId, estado, detalhe) {
    const k = acId + "|" + eqId;
    const antes = mat[k];
    /* otimista: pinta na hora, desfaz se o banco recusar */
    setMat(m => {
      const n = { ...m };
      if (estado) n[k] = { estado, detalhe: detalhe ?? null };
      else delete n[k];
      return n;
    });
    let r;
    if (estado) {
      r = await sb.from("academia_equipamentos").upsert({
        academia_id: acId, equipamento_id: eqId, estado,
        detalhe: detalhe ?? null, atualizado_em: new Date().toISOString()
      }, { onConflict: "academia_id,equipamento_id" });
    } else {
      r = await sb.from("academia_equipamentos").delete()
        .eq("academia_id", acId).eq("equipamento_id", eqId);
    }
    if (r.error) {
      setErro(r.error.message);
      setMat(m => { const n = { ...m }; if (antes) n[k] = antes; else delete n[k]; return n; });
    }
  }

  function clicar(acId, eqId) {
    const at = mat[acId + "|" + eqId];
    const prox = CICLO[at ? at.estado : "undefined"];
    gravar(acId, eqId, prox, prox === "tem" ? (at && at.detalhe) : null);
  }

  function editarDetalhe(acId, eqId, nomeEq) {
    const at = mat[acId + "|" + eqId];
    if (!at || at.estado !== "tem") {
      setAviso("Marca como ✅ primeiro para poder anotar a faixa."); return;
    }
    const v = window.prompt(
      'Faixa ou quantidade de "' + nomeEq + '"\n(ex: 1~5, 1~10, 2 — vazio para limpar)',
      at.detalhe || "");
    if (v === null) return;
    gravar(acId, eqId, "tem", v.trim() || null);
  }

  async function marcarCategoria(acId, categoria) {
    const lista = eqs.filter(e => e.categoria === categoria);
    const todos = lista.every(e => (mat[acId + "|" + e.id] || {}).estado === "tem");
    if (todos) {
      const r = await sb.from("academia_equipamentos").delete()
        .eq("academia_id", acId).in("equipamento_id", lista.map(e => e.id));
      if (r.error) { setErro(r.error.message); return; }
    } else {
      const r = await sb.from("academia_equipamentos").upsert(
        lista.map(e => ({ academia_id: acId, equipamento_id: e.id, estado: "tem",
                          atualizado_em: new Date().toISOString() })),
        { onConflict: "academia_id,equipamento_id" });
      if (r.error) { setErro(r.error.message); return; }
    }
    await carregar();
  }

  async function addEquip() {
    const n = novoEq.trim();
    if (!n) return;
    const maxOrd = Math.max(0, ...eqs.filter(e => e.categoria === novaCat)
      .map(e => e.ordem || 0));
    const r = await sb.from("equipamentos")
      .insert({ nome: n, categoria: novaCat, ordem: maxOrd + 10 });
    if (r.error) { setErro(r.error.message); return; }
    setNovoEq(""); setAviso('Equipamento "' + n + '" adicionado.');
    await carregar();
  }

  async function addAcademia() {
    const n = novaAc.trim();
    if (!n) return;
    const r = await sb.from("academias").insert({ nome: n });
    if (r.error) { setErro(r.error.message); return; }
    setNovaAc(""); setAviso('Academia "' + n + '" adicionada.');
    await carregar();
  }

  async function copiar() {
    if (!copiaDe || !copiaPara || copiaDe === copiaPara) {
      setErro("Escolhe duas academias diferentes."); return;
    }
    const nomeDe = (acs.find(a => a.id === copiaDe) || {}).nome;
    const nomePara = (acs.find(a => a.id === copiaPara) || {}).nome;
    const jaTem = Object.keys(mat).filter(k => k.startsWith(copiaPara + "|")).length;
    const ok = await confirmar({
      titulo: "Copiar inventário?",
      texto: 'De "' + nomeDe + '" para "' + nomePara + '".',
      alerta: jaTem ? nomePara + " já tem " + jaTem +
        " marcação(ões). Todas serão substituídas." : null,
      ok: "Copiar", perigo: !!jaTem
    });
    if (!ok) return;
    const linhas = Object.entries(mat)
      .filter(([k]) => k.startsWith(copiaDe + "|"))
      .map(([k, v]) => ({
        academia_id: copiaPara, equipamento_id: k.split("|")[1],
        estado: v.estado, detalhe: v.detalhe,
        atualizado_em: new Date().toISOString()
      }));
    if (!linhas.length) { setErro("A academia de origem não tem marcações."); return; }
    const del = await sb.from("academia_equipamentos").delete().eq("academia_id", copiaPara);
    if (del.error) { setErro(del.error.message); return; }
    const r = await sb.from("academia_equipamentos").upsert(linhas,
      { onConflict: "academia_id,equipamento_id" });
    if (r.error) { setErro(r.error.message); return; }
    setAviso(linhas.length + " marcação(ões) copiada(s) para " + nomePara + ".");
    await carregar();
  }

  /* foco vence tudo: mostra só a academia escolhida */
  const acsVis = foco
    ? acs.filter(a => a.id === foco)
    : acs.filter(a => !buscaAc.trim() || cbCasa(a.nome + " " + (a.cidade || ""), buscaAc));

  const cats = [...new Set(eqs.map(e => e.categoria))];
  const visiveis = eqs.filter(e =>
    (!cat || e.categoria === cat) &&
    (!busca.trim() || cbCasa(e.nome + " " + e.categoria, busca)));

  const contaAc = ac => {
    let tem = 0, inc = 0;
    for (const e of eqs) {
      const v = mat[ac.id + "|" + e.id];
      if (!v) continue;
      if (v.estado === "tem") tem++;
      else if (v.estado === "incerto") inc++;
    }
    return { tem, inc, total: tem + inc };
  };

  /* agrupa mantendo a ordem das categorias */
  const linhas = [];
  let catAtual = null;
  for (const e of visiveis) {
    if (e.categoria !== catAtual) { catAtual = e.categoria; linhas.push({ cat: catAtual }); }
    linhas.push({ eq: e });
  }

  return (
    <div>
      <div className="ap-bar">
        <div style={{ position: "relative", flex: "0 1 230px" }}>
          <input value={busca} onChange={e => setBusca(e.target.value)}
            placeholder="Buscar equipamento..." />
          {busca && <button className="cb-lim" onClick={() => setBusca("")}>×</button>}
        </div>
        <button className={"fbtn" + (!cat ? " on" : "")} onClick={() => setCat("")}>
          Todas ({eqs.length})
        </button>
        {cats.map(c => (
          <button key={c} className={"fbtn" + (cat === c ? " on" : "")}
            onClick={() => setCat(c)}>
            {c} ({eqs.filter(e => e.categoria === c).length})
          </button>
        ))}
      </div>

      <div className="ap-bar">
        <div style={{ position: "relative", flex: "0 1 230px" }}>
          <input value={buscaAc} onChange={e => { setBuscaAc(e.target.value); setFoco(""); }}
            placeholder="Buscar academia..." />
          {buscaAc && <button className="cb-lim"
            onClick={() => setBuscaAc("")}>×</button>}
        </div>
        {foco ? (
          <button className="fbtn on" onClick={() => setFoco("")}>
            {(acs.find(a => a.id === foco) || {}).nome} · ver todas
          </button>
        ) : (
          <span className="ed-cnt">
            {acsVis.length} de {acs.length} academia(s) · clique no nome para focar
          </span>
        )}
      </div>

      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}

      {carr ? <div className="msg">Carregando matriz...</div>
       : acs.length === 0 ? <div className="msg">Nenhuma academia cadastrada.</div>
       : acsVis.length === 0 ? <div className="msg">
           Nenhuma academia encontrada para "{buscaAc.trim()}".</div>
       : (
        <div className="ap-wrap">
          <table className={"ap-tab" + (foco ? " solo" : "")}>
            <thead>
              <tr>
                <th className="eq">Equipamento</th>
                {acsVis.map(a => {
                  const c = contaAc(a);
                  return (
                    <th key={a.id} className={"cl" + (foco === a.id ? " foco" : "")}
                      title={a.nome + "\nclique para ver só esta academia"}
                      onClick={() => setFoco(f => f === a.id ? "" : a.id)}>
                      <span className="ap-h-nome">{a.nome}</span>
                      <span className={"ap-h-cnt" + (c.total === 0 ? " zero" : "")}>
                        {c.total === 0 ? "não inventariada"
                          : c.tem + " de " + eqs.length + (c.inc ? " · " + c.inc + "?" : "")}
                      </span>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {linhas.map((l, i) => l.cat ? (
                <tr className="ap-cat" key={"c" + i}>
                  <td className="eq">{l.cat}</td>
                  {acsVis.map(a => (
                    <td key={a.id} style={{ textAlign: "center" }}>
                      <button className="mk" title={"Marcar/desmarcar toda a categoria em " + a.nome}
                        onClick={() => marcarCategoria(a.id, l.cat)}>✓ tudo</button>
                    </td>
                  ))}
                </tr>
              ) : (
                <tr key={l.eq.id}>
                  <td className="eq" title={l.eq.nome}>{l.eq.nome}</td>
                  {acsVis.map(a => {
                    const v = mat[a.id + "|" + l.eq.id];
                    const st = v ? v.estado : "nao_tem";
                    return (
                      <td key={a.id} className={"ap-cel " + st}
                        onClick={() => clicar(a.id, l.eq.id)}
                        onDoubleClick={e => { e.preventDefault();
                          editarDetalhe(a.id, l.eq.id, l.eq.nome); }}
                        title={l.eq.nome + " · " + a.nome +
                          "\nclique: alterna · duplo clique: faixa/quantidade"}>
                        {st === "tem" && v.detalhe
                          ? <span className="det">{v.detalhe}</span>
                          : <span className="v">
                              {st === "tem" ? "✓" : st === "incerto" ? "?" : ""}
                            </span>}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="ap-leg">
        <span><b>clique</b> alterna: vazio → ✓ tem → ? incerto → vazio</span>
        <span><b>duplo clique</b> anota faixa (ex: halteres 1~5)</span>
        <span><b>vazio</b> = não tem</span>
        <span>academia sem nenhuma marcação = ainda não inventariada</span>
      </div>

      <div className="ap-add">
        <b style={{ fontSize: 12 }}>Novo equipamento</b>
        <input value={novoEq} onChange={e => setNovoEq(e.target.value)}
          onKeyDown={e => e.key === "Enter" && addEquip()}
          placeholder="Nome do equipamento" />
        <select value={novaCat} onChange={e => setNovaCat(e.target.value)}>
          {cats.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <button onClick={addEquip} disabled={!novoEq.trim()}>Adicionar</button>
      </div>

      <div className="ap-add">
        <b style={{ fontSize: 12 }}>Nova academia</b>
        <input value={novaAc} onChange={e => setNovaAc(e.target.value)}
          onKeyDown={e => e.key === "Enter" && addAcademia()}
          placeholder="Nome da academia" />
        <button onClick={addAcademia} disabled={!novaAc.trim()}>Adicionar</button>
      </div>

      <div className="ap-add">
        <b style={{ fontSize: 12 }}>Copiar inventário</b>
        <select value={copiaDe} onChange={e => setCopiaDe(e.target.value)}>
          <option value="">de...</option>
          {acs.map(a => <option key={a.id} value={a.id}>{a.nome}</option>)}
        </select>
        <select value={copiaPara} onChange={e => setCopiaPara(e.target.value)}>
          <option value="">para...</option>
          {acs.map(a => <option key={a.id} value={a.id}>{a.nome}</option>)}
        </select>
        <button className="btn-sec" onClick={copiar}
          disabled={!copiaDe || !copiaPara}>Copiar</button>
      </div>
    </div>
  );
}

/* ---------- Backup ---------- */
const TABELAS_BACKUP = [
  "alunos", "perfis", "treinos", "exercicios", "logs", "sessoes",
  "anamneses", "cardapio", "grupos_exibicao", "modalidades", "perguntas",
  "fases", "planejamentos", "fase_templates", "fase_categorias", "metodos",
  "equipamentos", "academias", "academia_equipamentos", "aluno_academias",
  "anamnese_secoes", "ocorrencia_tipos", "anamnese_entradas"
];

function PainelBackup() {
  const [estado, setEstado] = useState("idle");
  const [prog, setProg]     = useState([]);
  const [erro, setErro]     = useState("");

  async function exportar() {
    setEstado("rodando"); setErro(""); setProg([]);
    const dump = {
      gerado_em: new Date().toISOString(),
      projeto: SUPABASE_URL,
      versao: 1,
      tabelas: {}
    };
    const relato = [];

    for (const t of TABELAS_BACKUP) {
      let linhas = [], de = 0, pagina = 1000, erroT = null;
      try {
        for (;;) {
          const { data, error } = await sb.from(t).select("*")
            .range(de, de + pagina - 1);
          if (error) throw new Error(error.message);
          linhas = linhas.concat(data || []);
          if (!data || data.length < pagina) break;
          de += pagina;
          if (de > 200000) break;
        }
        dump.tabelas[t] = linhas;
      } catch (e) {
        erroT = e.message;
        dump.tabelas[t] = { erro: e.message };
      }
      relato.push({ tabela: t, linhas: erroT ? null : linhas.length, erro: erroT });
      setProg([...relato]);
    }

    const total = relato.reduce((a, r) => a + (r.linhas || 0), 0);
    dump.resumo = { total_linhas: total, tabelas: relato };

    const blob = new Blob([JSON.stringify(dump, null, 1)],
      { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "idealis_backup_" +
      new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setEstado("idle");
  }

  async function exportarCsv() {
    setEstado("rodando"); setErro("");
    try {
      const { data, error } = await sb.from("anamneses")
        .select("aluno_id, texto, origem, criado_em");
      if (error) throw new Error(error.message);
      const al = await sb.from("alunos").select("id, nome, status");
      if (al.error) throw new Error(al.error.message);
      const nomes = new Map((al.data || []).map(x => [x.id, x.nome]));
      const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const linhas = [["nome", "criado_em", "origem", "texto"].map(esc).join(",")];
      for (const r of (data || [])) {
        linhas.push([nomes.get(r.aluno_id) || r.aluno_id,
          r.criado_em, r.origem, r.texto].map(esc).join(","));
      }
      const blob = new Blob(["\ufeff" + linhas.join("\r\n")],
        { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "idealis_anamneses_" +
        new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) { setErro(e.message); }
    setEstado("idle");
  }

  return (
    <div>
      <div className="box">
        <h2>Backup completo</h2>
        <p>
          Baixa um JSON com todas as tabelas. Guarda no Drive ou fora do
          computador — backup que mora só no fornecedor não é backup.
          O arquivo respeita as RLS: exporta o que o teu login enxerga.
        </p>
        {erro && <div className="err">{erro}</div>}
        <div className="acoes">
          <button onClick={exportar} disabled={estado !== "idle"}>
            {estado === "rodando" ? "Exportando..." : "Baixar backup (JSON)"}
          </button>
          <button className="btn-sec" onClick={exportarCsv} disabled={estado !== "idle"}>
            Só anamneses (CSV)
          </button>
        </div>
        {prog.length > 0 && (
          <div className="lista" style={{ marginTop: 16 }}>
            {prog.map(r => (
              <div className="item" key={r.tabela}>
                <span className="enm">{r.tabela}</span>
                <span className={"etg" + (r.erro ? " vazio" : "")}>
                  {r.erro ? r.erro : r.linhas + " linha(s)"}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="futuro">
        <b>⚠️ O que este backup NÃO cobre</b>
        Views, policies, funções e triggers não vêm no JSON — só os dados.
        Para reconstruir a estrutura, guarda os scripts SQL junto
        (volume_RECONSTRUIR, anamnese_setup, status_alunos, anamnese_editavel).
        As fotos do Storage também ficam de fora.
      </div>
    </div>
  );
}

/* ---------- App ---------- */
const ABAS_VALIDAS = ["alunos","acompanhamento","volume","montagem","planejamento",
                      "catalogo","aparelhos","backup"];

function App() {
  const [sessao, setSessao] = useState(undefined);
  /* aba na URL: F5 não perde o lugar, e dá para abrir duas janelas
     comparando alunos diferentes */
  const [aba, setAba] = useState(() => {
    const h = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    return ABAS_VALIDAS.includes(h) ? h : "alunos";
  });

  useEffect(() => {
    const novo = "#/" + aba;
    if (!location.hash.startsWith(novo)) history.replaceState(null, "", novo);
  }, [aba]);

  useEffect(() => {
    const t = () => {
      const h = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
      if (ABAS_VALIDAS.includes(h)) setAba(h);
    };
    window.addEventListener("hashchange", t);
    return () => window.removeEventListener("hashchange", t);
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSessao(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSessao(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (sessao === undefined) return <div className="msg">Carregando...</div>;
  if (!sessao) return <Login />;

  const abasComAluno = ["volume", "montagem", "planejamento"];

  return (
    <ProvedorUI>
    <ProvedorAluno>
    <div>
      <div className="top">
        <Logo size={36} />
        <button className="sair" onClick={() => sb.auth.signOut()}>Sair</button>
      </div>
      <div className="tabs">
        <button className={"tab" + (aba === "alunos" ? " on" : "")}
          onClick={() => setAba("alunos")}>Alunos</button>
        <button className={"tab" + (aba === "acompanhamento" ? " on" : "")}
          onClick={() => setAba("acompanhamento")}>Acompanhamento</button>
        <button className={"tab" + (aba === "volume" ? " on" : "")}
          onClick={() => setAba("volume")}>Volume</button>
        <button className={"tab" + (aba === "catalogo" ? " on" : "")}
          onClick={() => setAba("catalogo")}>Catálogo</button>
        <button className={"tab" + (aba === "montagem" ? " on" : "")}
          onClick={() => setAba("montagem")}>Treinos</button>
        <button className={"tab" + (aba === "planejamento" ? " on" : "")}
          onClick={() => setAba("planejamento")}>Planejamento</button>
        <button className={"tab" + (aba === "aparelhos" ? " on" : "")}
          onClick={() => setAba("aparelhos")}>Aparelhos Geral</button>
        <button className={"tab eng" + (aba === "backup" ? " on" : "")}
          title="Backup e exportação"
          onClick={() => setAba("backup")}>⚙</button>
      </div>
      {abasComAluno.includes(aba) && <BarraAluno />}

      {aba === "alunos" ? <PainelAlunos />
        : aba === "acompanhamento" ? <PainelAcompanhamento />
        : aba === "volume" ? <PainelVolume />
        : aba === "montagem" ? <PainelMontagem />
        : aba === "planejamento" ? <PainelPlanejamento />
        : aba === "aparelhos" ? <PainelAparelhos />
        : aba === "backup" ? <PainelBackup />
        : <PainelCatalogo />}
    </div>
    </ProvedorAluno>
    </ProvedorUI>
  );
}

/* ---------- PWA: instalação e service worker ---------- */
function BotaoInstalar() {
  const [evt, setEvt] = useState(null);
  const [oculto, setOculto] = useState(false);

  useEffect(() => {
    const h = (e) => { e.preventDefault(); setEvt(e); };
    window.addEventListener("beforeinstallprompt", h);
    const ok = () => { setEvt(null); setOculto(true); };
    window.addEventListener("appinstalled", ok);
    return () => {
      window.removeEventListener("beforeinstallprompt", h);
      window.removeEventListener("appinstalled", ok);
    };
  }, []);

  if (!evt || oculto) return null;

  return (
    <div className="instalar">
      <Logo size={30} />
      <div>
        <b>Instalar no celular</b>
        Abre direto da tela inicial, sem barra do navegador.
      </div>
      <button onClick={async () => {
        evt.prompt();
        try { await evt.userChoice; } catch (e) {}
        setEvt(null);
      }}>Instalar</button>
      <button className="x" onClick={() => setOculto(true)}>×</button>
    </div>
  );
}

function Raiz() {
  return <><App /><BotaoInstalar /></>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);

/* registro do SW — com kill switch por ?sw=off */
(function () {
  if (!("serviceWorker" in navigator)) return;
  const desligar = new URLSearchParams(location.search).get("sw") === "off";

  if (desligar) {
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.map(r => r.unregister())))
      .then(() => caches.keys())
      .then(ks => Promise.all(ks.map(k => caches.delete(k))))
      .then(() => console.log("[sw] desregistrado e caches limpos"));
    return;
  }

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => {
        /* procura versão nova toda vez que a aba volta ao foco */
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      })
      .catch(e => console.log("[sw] não registrou:", e.message));
  });
})();
</script>
