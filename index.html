<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idealis · Dashboard</title>
<meta name="description" content="Painel do treinador Idealis.">
<meta name="theme-color" content="#0b0f10">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Idealis">
<meta name="mobile-web-app-capable" content="yes">
<!-- VERSOES FIXADAS de proposito. Babel 8 gera "import" e quebra com React UMD.
     Nao troque por URL sem versao (@babel/standalone sem numero). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
  :root{
    --bg:#0b0f10; --card:#131a1c; --line:#1f2b2d;
    --txt:#e6edf3; --mut:#89a0a3; --accent:#00daef;
    --warn:#f0a35e; --alert:#e05c5c; --marca:#ddff00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:'Sora',system-ui,-apple-system,sans-serif;min-height:100vh}
  #root{max-width:1100px;margin:0 auto;
    padding:calc(40px + env(safe-area-inset-top)) 24px calc(80px + env(safe-area-inset-bottom))}
  .instalar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    background:var(--card);border:1px solid var(--marca);border-radius:12px;
    padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:50;
    box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:520px;margin:0 auto}
  .instalar div{flex:1;font-size:13px;line-height:1.45}
  .instalar b{display:block;font-size:14px;margin-bottom:2px}
  .instalar button{width:auto;padding:9px 16px;font-size:13px;flex-shrink:0}
  .instalar .x{background:none;border:none;color:var(--mut);font-size:20px;
    padding:0 4px;width:auto;line-height:1}
  .login{max-width:380px;margin:12vh auto;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:32px}
  .login h1{font-size:20px;margin-bottom:4px}
  .login p{color:var(--mut);font-size:13px;margin-bottom:24px}
  input{width:100%;padding:11px 13px;margin-bottom:12px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);
    font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  textarea{width:100%;min-height:110px;padding:11px 13px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);
    font-size:12px;font-family:ui-monospace,monospace;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  button{padding:11px;background:var(--accent);color:#04191c;border:none;
    border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;
    font-family:inherit;width:100%}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-sec{background:transparent;border:1px solid var(--line);color:var(--txt);
    width:auto;padding:9px 16px;font-size:13px;font-weight:500}
  .btn-sec:hover{border-color:var(--accent);filter:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .top h1{font-size:24px}
  .login p{color:var(--mut);font-size:13px;margin-bottom:24px}
  .sair{width:auto;padding:7px 14px;background:transparent;
    border:1px solid var(--line);color:var(--mut);font-size:12px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .tab{background:none;border:none;color:var(--mut);padding:11px 18px;
    font-size:14px;font-weight:500;cursor:pointer;width:auto;
    border-bottom:2px solid transparent;border-radius:0;font-family:inherit}
  .tab:hover{color:var(--txt);filter:none}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
  .row{display:flex;align-items:center;gap:16px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:10px;padding:14px 18px;margin-bottom:8px}
  .row.w{border-left-color:var(--warn)}
  .row.a{border-left-color:var(--alert)}
  .row.ok{border-left-color:var(--accent)}
  .av{width:46px;height:46px;border-radius:50%;object-fit:cover;
    background:var(--line);flex-shrink:0}
  .ph{width:46px;height:46px;border-radius:50%;background:var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:600;
    color:var(--mut);flex-shrink:0;font-size:15px}
  .nome{flex:1;font-size:15px;font-weight:500}
  .dias{text-align:right;min-width:110px}
  .dias b{font-size:19px;font-weight:600;display:block;line-height:1.2}
  .dias span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .msg{color:var(--mut);text-align:center;padding:50px 0;font-size:14px}
  .err{background:#2d1618;border:1px solid #5c2427;color:#f5a3a3;
    padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .box{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:22px;margin-bottom:16px}
  .box h2{font-size:16px;margin-bottom:6px}
  .box p{color:var(--mut);font-size:13px;line-height:1.55;margin-bottom:16px}
  .acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .acoes button{width:auto;padding:10px 20px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--line);border-radius:10px;padding:16px 18px}
  .kpi.g{border-left-color:var(--accent)}
  .kpi.w{border-left-color:var(--warn)}
  .kpi.r{border-left-color:var(--alert)}
  .kpi b{font-size:26px;font-weight:600;display:block;line-height:1.15}
  .kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .barra{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0 6px}
  .barra i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .status{font-size:13px;color:var(--mut)}
  .lista{max-height:420px;overflow-y:auto;border:1px solid var(--line);
    border-radius:10px;background:var(--card)}
  .item{display:flex;gap:14px;align-items:baseline;padding:11px 16px;
    border-bottom:1px solid var(--line);font-size:13px}
  .item:last-child{border-bottom:none}
  .item .eid{color:var(--mut);font-family:ui-monospace,monospace;
    font-size:11px;min-width:46px}
  .item .enm{flex:1;font-weight:500}
  .item .etg{color:var(--warn);font-size:11px;text-align:right;max-width:52%}
  .item .etg.vazio{color:var(--alert)}
  .ok-msg{background:#08282c;border:1px solid #17555c;color:#7fe6f2;
    padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  select{padding:9px 12px;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;color:var(--txt);font-size:14px;font-family:inherit;min-width:220px}
  select:focus{outline:none;border-color:var(--accent)}
  .vol-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .vol{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
  .vol th,.vol td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center}
  .vol th{color:var(--accent);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.7px}
  .vol th.l,.vol td.l{text-align:left;font-weight:500}
  .vol td.z{color:#33454a}
  .vol td.tt{font-weight:700;color:var(--accent)}
  .vol tr.tot td{border-top:2px solid var(--line);border-bottom:none;
    font-weight:700;padding-top:10px}
  .vol tr.sec.al td{color:var(--warn)}
  .vol tr.sec td{color:var(--mut);font-size:10px;text-transform:uppercase;
    letter-spacing:.8px;text-align:left;padding-top:18px;border-bottom:1px solid var(--line)}
  .vol .sc{font-size:9px;color:var(--warn);margin-left:1px;font-weight:500}
  .pend-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;
    background:#2a2118;color:var(--warn);text-transform:uppercase;letter-spacing:.5px}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,94vw);
    background:var(--card);border-left:1px solid var(--line);z-index:41;
    display:flex;flex-direction:column}
  .dr-top{padding:20px 24px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
  .dr-top h2{font-size:18px;margin-bottom:3px}
  .dr-top .meta{color:var(--mut);font-size:12px}
  .dr-x{position:absolute;top:16px;right:20px;background:none;border:none;
    color:var(--mut);font-size:22px;cursor:pointer;width:auto;padding:0 6px;line-height:1}
  .dr-x:hover{color:var(--txt);filter:none}
  .dr-acoes{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px;
    border-bottom:1px solid var(--line);flex-shrink:0}
  .dr-acoes button{width:auto;padding:8px 14px;font-size:12px}
  .dr-body{overflow-y:auto;padding:18px 24px 40px;flex:1}
  .sec-card{margin-bottom:16px}
  .sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
  .sec-h b{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent)}
  .sec-h i{font-style:normal;font-size:10px;color:var(--mut)}
  .sec-card.dor .sec-h b{color:#ff8f6b}
  .sec-card.vazia .sec-h b{color:#4a5a5d}
  .ent{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #182224;
    font-size:13px;line-height:1.5}
  .ent:last-child{border-bottom:none}
  .ent .dt{color:var(--accent);font-size:11px;font-family:ui-monospace,monospace;
    flex-shrink:0;min-width:62px;padding-top:2px}
  .ent .dt.sem{color:#4a5a5d}
  .sec-card.dor .ent .dt{color:#ff8f6b}
  .ent .tx{flex:1}
  .vazio-nota{font-size:12px;color:#4a5a5d;font-style:italic}
  .dr-copiar{position:absolute;top:15px;right:52px;display:flex;gap:2px}
  .dr-copiar .ico{padding:6px 9px}
  .dr-copiar .car{padding:6px 6px;font-size:11px}
  .dr-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--card);
    border:1px solid var(--accent);border-radius:8px;z-index:60;min-width:200px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden}
  .dr-menu div{padding:10px 13px;font-size:12px;cursor:pointer;
    border-bottom:1px solid #182224;white-space:nowrap}
  .dr-menu div:last-child{border-bottom:none}
  .dr-menu div:hover{background:#0f2a2e;color:var(--accent)}
  .nv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:640px){ .nv-grid{grid-template-columns:1fr} }
  .fbtn.mais{background:var(--accent);color:#04191c;border-color:var(--accent);
    font-weight:700;padding:7px 15px}
  .ent.en2{align-items:flex-start;position:relative;padding-right:74px}
  .ent.en2.arq{opacity:.42}
  .en-ferr{position:absolute;right:0;top:4px;display:flex;gap:3px;opacity:0;
    transition:opacity .15s}
  .ent.en2:hover .en-ferr{opacity:1}
  .en-ferr button{width:auto;padding:2px 6px;font-size:11px;background:var(--card);
    border:1px solid var(--line);color:var(--mut);border-radius:5px}
  .en-ferr button:hover{border-color:var(--accent);color:var(--accent);filter:none}
  .en-tags{display:inline-flex;gap:5px;flex-wrap:wrap;margin-left:8px;
    vertical-align:middle}
  .en-tag{font-size:9px;padding:2px 7px;border-radius:4px;background:#16232a;
    color:var(--mut);letter-spacing:.3px;white-space:nowrap}
  .en-tag.ex{background:#0f2a2e;color:var(--accent)}
  .en-tag.rg{background:#241a2e;color:#c9a6ff}
  .en-tag.es{background:#12240f;color:#a7e58c;font-weight:600}
  .mig-cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;
    align-items:start}
  .mig-al{padding:9px 12px;border:1px solid var(--line);border-radius:9px;
    margin-bottom:6px;cursor:pointer;background:var(--bg)}
  .mig-al:hover{border-color:var(--accent)}
  .mig-al.on{border-color:var(--accent);background:#0d1c1f}
  .mig-al.feito{opacity:.6}
  .mig-al b{display:block;font-size:13px;font-weight:500;margin-bottom:2px}
  .mig-al span{font-size:10px;color:var(--mut)}
  .mig-al.feito span{color:var(--accent)}
  .mig-sec{margin-bottom:14px}
  .mig-sh{font-size:10px;text-transform:uppercase;letter-spacing:.9px;
    color:var(--accent);margin-bottom:5px}
  .mig-sh i{font-style:normal;color:var(--mut);margin-left:5px}
  .mig-it{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #182224;
    font-size:12px;line-height:1.5}
  .mig-it:last-child{border-bottom:none}
  .mig-it .dt{color:var(--accent);font-family:ui-monospace,monospace;font-size:11px;
    min-width:62px;flex-shrink:0}
  .mig-it .dt.sem{color:#3d4d50}
  .mig-it .tx{flex:1}
  @media (max-width: 900px){ .mig-cols{grid-template-columns:1fr} }
  .sec-h{align-items:center}
  .sec-lapis{background:none;border:1px solid transparent;color:#3d4d50;
    width:auto;padding:2px 7px;font-size:12px;border-radius:6px;cursor:pointer}
  .sec-card:hover .sec-lapis{color:var(--mut);border-color:var(--line)}
  .sec-lapis:hover{color:var(--accent) !important;border-color:var(--accent) !important;
    filter:none}
  .sec-bloq{font-size:11px;opacity:.35;cursor:help}
  .sec-ed{margin-top:6px}
  .sec-ed textarea{font-size:13px;line-height:1.55;min-height:70px}
  .sec-vazias{background:none;border:1px dashed var(--line);color:var(--mut);
    width:100%;padding:9px;font-size:11px;border-radius:9px;margin-top:6px;
    cursor:pointer}
  .sec-vazias:hover{border-color:var(--accent);color:var(--accent);filter:none}
  .raw{width:100%;min-height:300px;font-size:12px;line-height:1.6}
  .hist-it{display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid #182224;font-size:12px;color:var(--mut)}
  .hist-it b{color:var(--txt);font-weight:500}
  .row.clik{cursor:pointer}
  .row.clik:hover{border-color:var(--accent)}
  .badge-an{font-size:10px;padding:3px 8px;border-radius:5px;background:#0f2a2e;
    color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
  .badge-an.sem{background:#241a12;color:var(--warn)}
  .dias-chip{display:none}
  .filtros{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .fbtn{background:transparent;border:1px solid var(--line);color:var(--mut);
    width:auto;padding:7px 14px;font-size:12px;border-radius:20px;font-weight:500}
  .fbtn:hover{border-color:var(--accent);color:var(--txt);filter:none}
  .fbtn.on{background:var(--accent);color:#04191c;border-color:var(--accent)}
  .row.inativo{opacity:.55}
  .st-tag{font-size:9px;padding:2px 7px;border-radius:4px;background:#2a2418;
    color:var(--warn);text-transform:uppercase;letter-spacing:.5px;margin-left:8px}
  .imp-grp{margin-bottom:20px}
  .imp-grp>h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;
    margin-bottom:8px;color:var(--accent)}
  .imp-grp.warn>h3{color:var(--warn)}
  .imp-grp.off>h3{color:var(--mut)}
  .imp-it{display:flex;align-items:center;gap:12px;padding:9px 14px;
    border-bottom:1px solid #182224;font-size:13px}
  .imp-it:last-child{border-bottom:none}
  .imp-it input[type=checkbox]{width:16px;height:16px;margin:0;flex-shrink:0;
    accent-color:var(--accent);cursor:pointer}
  .imp-it .n1{flex:1;font-weight:500}
  .imp-it .seta{color:var(--mut);font-size:11px}
  .imp-it .n2{flex:1;color:var(--mut)}
  .imp-it .ch{font-size:10px;color:var(--mut);white-space:nowrap}
  .imp-it select{min-width:0;flex:1;padding:5px 8px;font-size:12px}
  .fam{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--mut);margin:26px 0 10px;padding-bottom:6px;
    border-bottom:1px solid var(--line)}
  .fam:first-child{margin-top:0}
  .mod-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
  .mod-h b{font-size:13px;font-weight:600}
  .mod-h i{font-style:normal;font-size:11px;color:var(--mut)}
  .mod-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .mod-sel{background:var(--bg);border:1px solid var(--line);color:var(--mut);
    font-size:11px;padding:4px 7px;border-radius:6px;font-family:inherit;
    min-width:0;max-width:190px;cursor:pointer;text-overflow:ellipsis}
  .mod-sel:hover{border-color:var(--accent);color:var(--txt)}
  .pq-badge{font-size:10px;padding:3px 8px;border-radius:5px;
    background:#2b2410;color:#dbff00;margin-left:8px;letter-spacing:.4px}
  .pq-it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;
    border-bottom:1px solid #182224;font-size:13px;line-height:1.5}
  .pq-it:last-child{border-bottom:none}
  .pq-it.usada{opacity:.45}
  .pq-it .txt{flex:1}
  .pq-it .bt{display:flex;gap:6px;flex-shrink:0}
  .pq-it .bt button{width:auto;padding:4px 9px;font-size:11px}
  .btn-sec.ico{display:inline-flex;align-items:center;justify-content:center;
    padding:5px 8px;color:var(--mut)}
  .btn-sec.ico:hover{color:var(--accent);border-color:var(--accent)}
  .pq-data{color:var(--accent);font-size:11px;font-family:ui-monospace,monospace;
    margin-right:6px;opacity:.85}

  /* ================= MOBILE ================= */
  @media (max-width: 720px){
    #root{padding:20px 14px 60px}
    .top{margin-bottom:16px}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin-bottom:20px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:10px 13px;font-size:13px;white-space:nowrap;flex-shrink:0}

    /* linha do aluno: GRID de 2 linhas fixas.
       flex-wrap nao serve aqui porque quebra por espaco disponivel,
       nao por estrutura — o select cabia ao lado e espremia o nome. */
    .row{display:grid;align-items:center;
      grid-template-columns:auto minmax(0,1fr) auto;
      grid-template-areas:
        "av   nome nome"
        "av   sel  btn";
      gap:8px 10px;padding:12px 13px}
    .av,.ph{grid-area:av;width:38px;height:38px;font-size:13px;align-self:start}
    .nome{grid-area:nome;min-width:0;font-size:14px;line-height:1.3;
      display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
    .dias{grid-area:nome;display:none}
    .mod-sel{grid-area:sel;max-width:none;width:100%;padding:7px 9px;font-size:12px}
    .row > .fbtn{grid-area:btn;margin:0;white-space:nowrap}
    .badge-an,.st-tag,.pq-badge{font-size:9px;padding:2px 6px;margin-left:0}
    /* o tempo sem treinar vira um chip dentro do nome */
    .dias-chip{display:inline-block;font-size:9px;padding:2px 7px;border-radius:5px;
      background:#1b2427;color:var(--mut);letter-spacing:.4px;
      text-transform:uppercase;white-space:nowrap}
    .dias-chip.w{background:#2a2418;color:var(--warn)}
    .dias-chip.a{background:#2d1618;color:#f5a3a3}
    .dias-chip.ok{background:#0f2a2e;color:var(--accent)}

    .filtros{gap:5px}
    .fbtn{padding:6px 11px;font-size:11px}

    /* drawer vira tela cheia */
    .drawer{width:100vw;max-width:100vw}
    .dr-top{padding:16px 16px 13px}
    .dr-top h2{font-size:16px;padding-right:34px}
    .dr-acoes{padding:11px 16px;gap:6px}

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ============ CONFIG ============ */
const SUPABASE_URL      = "https://lbnemzhwibcarhkaifoy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AH0V90ZsYBYpm8M_H0zQPg_zg9po7uo";
const CATALOGO_URL      = "https://script.google.com/macros/s/AKfycbyi183noK7vugBRyh5AMMcgey2Ksz2oqQvKGAfZ8Q-ZcJU0ag4TxzuiAS6oDP0u3BI7/exec";
const LOTE = 150;
/* Escrita de volta no Sheets (opcional). Deixe WTAN_URL vazio para desligar. */
const WTAN_URL   = "";
const WTAN_TOKEN = "MUDE-ISTO-123";
/* ================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- helpers de transformação ---------- */
const tags = s => String(s ?? "").split("|").map(t => t.trim()).filter(Boolean);
const bool = v => String(v ?? "").trim().toUpperCase() === "X";
const txt  = v => { const s = String(v ?? "").trim(); return s || null; };
const idNum = v => {
  if (v === null || v === undefined || String(v).trim() === "") return NaN;
  const n = Number(v);
  return Number.isInteger(n) && n > 0 ? n : NaN;
};

function transformar(l) {
  return {
    id: idNum(l.id),
    exercicio: String(l.exercicio ?? "").trim(),
    grupos: tags(l.grupo),
    contextos: tags(l.contexto),
    subgrupo: txt(l.subgrupo),
    musculo_alvo: txt(l.musculo_alvo),
    equipamento: txt(l.equipamento),
    em_casa: bool(l.em_casa),
    video_proprio: bool(l.video_proprio),
    a_filmar: bool(l.a_filmar),
    isometrico: bool(l.isometrico),
    unilateral: bool(l.unilateral),
    bi_set: bool(l.bi_set),
    observacao: txt(l.observacao),
    video_url: txt(l.video_url),
    bruto: l,
    sincronizado_em: new Date().toISOString()
  };
}

function preparar(linhas) {
  const vistos = new Set(), validos = [], ignorados = [];
  for (const l of linhas) {
    const t = transformar(l);
    if (!Number.isFinite(t.id)) { ignorados.push({ id: l?.id, nome: l?.exercicio, motivo: "id inválido" }); continue; }
    if (!t.exercicio)           { ignorados.push({ id: l?.id, nome: "(sem nome)", motivo: "nome vazio" }); continue; }
    if (vistos.has(t.id))       { ignorados.push({ id: l?.id, nome: l?.exercicio, motivo: "id duplicado" }); continue; }
    vistos.add(t.id); validos.push(t);
  }
  return { validos, ignorados };
}

/* ---------- Logo ---------- */
const LOGO_D = "M2275 5059 c-2091 -256 -2975 -2790 -1490 -4274 1489 -1489 4049 -587 4275 1507 171 1591 -1207 2960 -2785 2767z m525 -264 c1560 -184 2461 -1815 1780 -3220 -439 -905 -1452 -1415 -2435 -1226 -1460 281 -2253 1860 -1605 3196 411 848 1336 1359 2260 1250z M2960 4367 c-41 -56 -139 -190 -219 -297 -223 -300 -430 -584 -427 -587 1 -2 38 9 82 23 43 14 160 51 259 83 99 32 240 78 313 101 98 32 132 47 132 59 0 9 -5 68 -10 131 -6 63 -19 220 -29 348 -10 128 -21 235 -23 237 -2 3 -37 -41 -78 -98z M2850 3467 c-19 -6 -195 -64 -390 -128 l-355 -117 -140 -190 c-77 -104 -209 -284 -293 -398 -84 -115 -169 -230 -188 -256 -36 -48 -36 -48 505 -48 l541 0 -167 -227 c-92 -126 -257 -352 -368 -503 -111 -151 -254 -347 -319 -435 l-118 -160 673 -3 c672 -2 672 -2 768 52 53 29 123 68 156 86 162 88 283 155 310 171 29 18 16 19 -518 19 l-548 0 40 56 c133 185 780 1053 879 1179 l71 90 -544 3 c-300 1 -545 5 -545 8 0 5 37 57 165 229 45 61 161 217 258 348 97 130 173 237 169 236 -4 -1 -23 -6 -42 -12z";
const LOGO_T = "translate(0.000000,512.000000) scale(0.100000,-0.100000)";

function Logo({ size = 34, cor }) {
  return (
    <svg viewBox="0 0 512 512" width={size} height={size}
      xmlns="http://www.w3.org/2000/svg"
      fill={cor || "var(--marca)"} aria-label="Idealis"

/* ---------- Login ---------- */
function Login() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro]   = useState("");
  const [busy, setBusy]   = useState(false);

  async function entrar() {
    if (!email || !senha) { setErro("Preenche os dois campos."); return; }
    setBusy(true); setErro("");
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    setBusy(false);
    if (error) setErro(error.message);
  }

  return (
    <div className="login">
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
        <Logo size={64} />
      </div>
      <p style={{ textAlign: "center" }}>Painel do treinador</p>
      {erro && <div className="err">{erro}</div>}
      <input type="email" placeholder="E-mail" value={email}
        onChange={e => setEmail(e.target.value)}
        onKeyDown={e => e.key === "Enter" && entrar()} />
      <input type="password" placeholder="Senha" value={senha}
        onChange={e => setSenha(e.target.value)}
        onKeyDown={e => e.key === "Enter" && entrar()} />
      <button onClick={entrar} disabled={busy}>{busy ? "Entrando..." : "Entrar"}</button>
    </div>
  );
}

/* ---------- Alunos ---------- */
function iniciais(nome) {
  return String(nome || "?").trim().split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
}

function LinhaAluno({ a, onAbrir, onStatus, onModalidade, modalidades }) {
  const d = a.dias_sem_treinar;
  const cls = (d === null ? "a" : d >= 10 ? "a" : d >= 5 ? "w" : "ok") +
    (a.status !== "ativo" ? " inativo" : "");
  return (
    <div className={"row clik " + cls} onClick={() => onAbrir(a)}>
      {a.foto_url
        ? <img className="av" src={a.foto_url} alt=""
            onError={e => { e.target.style.visibility = "hidden"; }} />
        : <div className="ph">{iniciais(a.nome)}</div>}
      <div className="nome">
        {a.nome}
        <span className={"badge-an" + (a.tem_anamnese ? "" : " sem")}
          style={{ marginLeft: 10 }}>
          {a.tem_anamnese ? "anamnese" : "sem anamnese"}
        </span>
        {a.status !== "ativo" && <span className="st-tag">{a.status}</span>}
        {a.perguntas_pendentes > 0 &&
          <span className="pq-badge">{a.perguntas_pendentes} pergunta(s)</span>}
        <span className={"dias-chip " + cls.trim().split(" ")[0]}>
          {d === null ? "sem registro"
            : d === 0 ? "treinou hoje"
            : d === 1 ? "1 dia atrás"
            : d + " dias atrás"}
        </span>
      </div>
      <select className="mod-sel" value={a.modalidade_id || ""}
        onClick={e => e.stopPropagation()}
        onChange={e => { e.stopPropagation();
          onModalidade(a, e.target.value || null); }}>
        <option value="">sem formato</option>
        {modalidades.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
      </select>
      <button className="fbtn" style={{ marginRight: 4 }}
        onClick={e => { e.stopPropagation();
          onStatus(a, a.status === "ativo" ? "inativo" : "ativo"); }}>
        {a.status === "ativo" ? "Inativar" : "Reativar"}
      </button>
      <div className="dias">
        {d === null
          ? <><b style={{ color: "var(--alert)" }}>—</b><span>sem registro</span></>
          : d === 0
            ? <><b style={{ color: "var(--accent)" }}>hoje</b><span>último treino</span></>
            : <><b>{d}</b><span>{d === 1 ? "dia atrás" : "dias atrás"}</span></>}
      </div>
    </div>
  );
}

function PainelAlunos() {
  const [alunos, setAlunos] = useState(null);
  const [erro, setErro] = useState("");
  const [aberto, setAberto] = useState(null);
  const [filtro, setFiltro] = useState("ativo");
  const [importar, setImportar] = useState(false);
  const [migrar, setMigrar] = useState(false);
  const [novo, setNovo] = useState(false);
  const [mods, setMods] = useState([]);
  const [busca, setBusca] = useState("");

  const carregar = useCallback(async () => {
    const m = await sb.from("modalidades").select("*")
      .eq("ativa", true).order("ordem");
    if (!m.error) setMods(m.data || []);
    const { data, error } = await sb.from("vw_alunos_painel").select("*");
    if (error) { setErro(error.message); setAlunos([]); return; }
    const ord = [...(data || [])].sort((x, y) => {
      if (x.dias_sem_treinar === null && y.dias_sem_treinar !== null) return -1;
      if (y.dias_sem_treinar === null && x.dias_sem_treinar !== null) return 1;
      if (x.dias_sem_treinar === null && y.dias_sem_treinar === null)
        return String(x.nome).localeCompare(String(y.nome), "pt-BR");
      return y.dias_sem_treinar - x.dias_sem_treinar;
    });
    setAlunos(ord);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  async function mudarModalidade(aluno, id) {
    const { error } = await sb.from("alunos")
      .update({ modalidade_id: id }).eq("id", aluno.id);
    if (error) { setErro(error.message); return; }
    await carregar();
  }

  async function mudarStatus(aluno, novo) {
    const { error } = await sb.from("alunos")
      .update({ status: novo }).eq("id", aluno.id);
    if (error) { setErro(error.message); return; }
    await carregar();
  }

  const visiveis = (alunos || [])
    .filter(a =>
      filtro === "todos" ? true :
      filtro === "ativo" ? a.status === "ativo" :
      a.status !== "ativo")
    .filter(a => !busca.trim() ||
      cbCasa((a.nome || "") + " " + (a.modalidade_nome || ""), busca));
  const nAtivos = (alunos || []).filter(a => a.status === "ativo").length;
  const nOutros = (alunos || []).length - nAtivos;

  /* agrupa: família > modalidade > alunos */
  const familias = [];
  const idxF = new Map();
  const ordemAluno = (x, y) => {
    if (x.dias_sem_treinar === null && y.dias_sem_treinar !== null) return -1;
    if (y.dias_sem_treinar === null && x.dias_sem_treinar !== null) return 1;
    if (x.dias_sem_treinar === null) return String(x.nome).localeCompare(String(y.nome), "pt-BR");
    return y.dias_sem_treinar - x.dias_sem_treinar;
  };
  for (const a of visiveis) {
    const fam = a.modalidade_familia || "Sem formato definido";
    const mid = a.modalidade_id || "__none";
    if (!idxF.has(fam)) {
      idxF.set(fam, { nome: fam, ordem: a.modalidade_ordem || 999, mods: new Map() });
      familias.push(idxF.get(fam));
    }
    const F = idxF.get(fam);
    F.ordem = Math.min(F.ordem, a.modalidade_ordem || 999);
    if (!F.mods.has(mid)) {
      F.mods.set(mid, {
        id: mid, nome: a.modalidade_nome || "Sem formato",
        cor: a.modalidade_cor || "#3d454f",
        ordem: a.modalidade_ordem || 999, alunos: []
      });
    }
    F.mods.get(mid).alunos.push(a);
  }
  familias.sort((x, y) => x.ordem - y.ordem);
  for (const F of familias) {
    F.lista = [...F.mods.values()].sort((x, y) => x.ordem - y.ordem);
    F.lista.forEach(m => m.alunos.sort(ordemAluno));
  }

  return (
    <div>
      <div className="filtros">
        <button className={"fbtn" + (filtro === "ativo" ? " on" : "")}
          onClick={() => setFiltro("ativo")}>Ativos ({nAtivos})</button>
        <button className={"fbtn" + (filtro === "inativo" ? " on" : "")}
          onClick={() => setFiltro("inativo")}>Inativos ({nOutros})</button>
        <button className={"fbtn" + (filtro === "todos" ? " on" : "")}
          onClick={() => setFiltro("todos")}>Todos</button>
        <div className="busca-alunos">
          <input value={busca} onChange={e => setBusca(e.target.value)}
            placeholder="Buscar aluno..." />
          {busca && (
            <button className="cb-lim" onClick={() => setBusca("")} title="Limpar">×</button>
          )}
        </div>
        <span style={{ flex: 1 }} />
        <button className="fbtn mais" onClick={() => setNovo(true)}>+ Aluno</button>
        <button className="fbtn" onClick={() => setMigrar(true)}>Migrar anamneses</button>
        <button className="fbtn" onClick={() => setImportar(true)}>Importar do Sheets</button>
      </div>
      <div className="sub">
        {alunos === null ? "Carregando..."
          : visiveis.length + " aluno(s)" +
            (busca.trim() ? ' encontrado(s) para "' + busca.trim() + '"'
                          : " · ordenado por tempo sem treinar")}
      </div>
      {erro && <div className="err">{erro}</div>}
      {alunos === null
        ? <div className="msg">Buscando dados...</div>
        : visiveis.length === 0
          ? <div className="msg">
              {busca.trim() ? 'Nenhum aluno encontrado para "' + busca.trim() + '".' :
               filtro === "ativo" ? "Nenhum aluno ativo." :
               filtro === "inativo" ? "Nenhum aluno inativo." :
               "Nenhum aluno visível. Confere as policies de RLS."}
            </div>
          : familias.map(F => (
              <div key={F.nome}>
                <div className="fam">{F.nome}</div>
                {F.lista.map(M => (
                  <div key={M.id}>
                    <div className="mod-h">
                      <span className="mod-dot" style={{ background: M.cor }} />
                      <b>{M.nome}</b>
                      <i>{M.alunos.length}</i>
                    </div>
                    {M.alunos.map(a => (
                      <LinhaAluno key={a.id} a={a} onAbrir={setAberto}
                        onStatus={mudarStatus} onModalidade={mudarModalidade}
                        modalidades={mods} />
                    ))}
                  </div>
                ))}
              </div>
            ))}
      {aberto && (
        <DrawerAnamnese
          aluno={aberto}
          onFechar={() => { setAberto(null); carregar(); }}
        />
      )}
      {novo && (
        <ModalNovoAluno onFechar={() => setNovo(false)}
          onCriado={async () => { setNovo(false); await carregar(); }} />
      )}
      {migrar && <PainelMigracao onFechar={() => { setMigrar(false); carregar(); }} />}
      {importar && (
        <ModalImportar
          alunos={alunos || []}
          onFechar={() => setImportar(false)}
          onPronto={carregar}
        />
      )}
    </div>
  );
}

/* ---------- Catálogo ---------- */
function PainelCatalogo() {
  const [fase, setFase]         = useState("idle");
  const [prog, setProg]         = useState(0);
  const [erro, setErro]         = useState("");
  const [aviso, setAviso]       = useState("");
  const [ignorados, setIgnor]   = useState([]);
  const [linhas, setLinhas]     = useState(null);
  const [manual, setManual]     = useState(false);
  const [colado, setColado]     = useState("");
  const [naoMap, setNaoMap]     = useState([]);
  const [url, setUrl]           = useState(CATALOGO_URL);
  const [editUrl, setEditUrl]   = useState(false);

  const carregarEstado = useCallback(async () => {
    const { data, error } = await sb
      .from("cardapio")
      .select("id, exercicio, grupos, subgrupo, musculo_alvo, sincronizado_em")
      .order("exercicio");
    if (error) { setErro(error.message); return; }
    setLinhas(data || []);
    const nm = await sb.from("vw_grupos_nao_mapeados").select("*");
    if (!nm.error) setNaoMap(nm.data || []);
  }, []);

  useEffect(() => { carregarEstado(); }, [carregarEstado]);

  async function gravar(brutos) {
    const { validos, ignorados: ign } = preparar(brutos);
    setIgnor(ign);
    if (!validos.length) { setErro("Nenhum exercício válido no retorno."); setFase("idle"); return; }

    setFase("gravando"); setProg(0);
    for (let i = 0; i < validos.length; i += LOTE) {
      const lote = validos.slice(i, i + LOTE);
      const { error } = await sb.from("cardapio").upsert(lote, { onConflict: "id" });
      if (error) {
        setErro("Erro ao gravar (lote " + (Math.floor(i / LOTE) + 1) + "): " + error.message);
        setFase("idle"); await carregarEstado(); return;
      }
      setProg(Math.min(i + LOTE, validos.length) / validos.length);
    }
    setAviso(validos.length + " exercícios sincronizados." +
      (ign.length ? " " + ign.length + " ignorado(s), lista abaixo." : ""));
    setFase("idle");
    await carregarEstado();
  }

  async function sincronizar() {
    setErro(""); setAviso(""); setIgnor([]); setManual(false);
    setFase("buscando");
    let json;
    try {
      const sep = url.indexOf("?") >= 0 ? "&" : "?";
      const r = await fetch(url + sep + "_t=" + Date.now(),
        { method: "GET", redirect: "follow", cache: "no-store" });
      if (r.status === 404) {
        throw new Error("HTTP 404 — a implantação do Apps Script não existe nessa URL. " +
          "Pega a URL atual em Implantar → Gerenciar implantações e cola no campo acima.");
      }
      if (r.status === 401 || r.status === 403) {
        throw new Error("HTTP " + r.status + " — a implantação existe mas está privada. " +
          "Em Gerenciar implantações, muda 'Quem tem acesso' para 'Qualquer pessoa'.");
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      json = await r.json();
    } catch (e) {
      const rede = /Failed to fetch|NetworkError|load failed/i.test(e.message);
      setErro(rede
        ? "O navegador bloqueou a requisição (CORS ou rede). Usa o plano B abaixo."
        : e.message);
      setEditUrl(true);

/* grava de volta na planilha WTAN; devolve {ok, erro} */
async function gravarNoSheets(aluno, texto) {
  if (!WTAN_URL) return { ok: false, erro: "sem URL configurada", pulou: true };
  if (!aluno.sheets_linha) return { ok: false, erro: "aluno sem linha do Sheets", pulou: true };
  try {
    const sep = WTAN_URL.indexOf("?") >= 0 ? "&" : "?";
    const r = await fetch(WTAN_URL + sep + "_t=" + Date.now(), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        token: WTAN_TOKEN, linha: aluno.sheets_linha, nome: aluno.nome, texto: texto
      }),
      redirect: "follow", cache: "no-store"
    });
    if (!r.ok) return { ok: false, erro: "HTTP " + r.status };
    const j = await r.json();
    return j.ok ? { ok: true } : { ok: false, erro: j.erro || "erro no script" };
  } catch (e) {
    return { ok: false, erro: e.message };
  }
}

/* ---------- Anamnese ---------- */
const SECOES_ANAMNESE = [
  "Obj", "Diag", "Dor/Pat", "Tempo", "Dif. Exerc", "Pref. Treino", "Pref. Exerc",
  "Músc + responsivo", "Músc - responsivo", "Coord", "Obs Gerais",
  "Supl/Med", "Hist", "Outras Ativs"
];
const DESTAQUE = new Set(["Dor/Pat", "Diag"]);
/* ignora o que está entre parênteses: "Coord (Coordenação)" casa com "Coord" */
const normSec = t => String(t || "").replace(/\*/g, "").replace(/\([^)]*\)/g, " ")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/\s+/g, " ").trim();
const CANON_SEC = new Map(SECOES_ANAMNESE.map(x => [normSec(x), x]));

function parseAnamnese(txt) {
  const linhas = String(txt || "").replace(/\r/g, "").split("\n");
  const out = [];
  let atual = null;
  const abrir = (rot, conhecida) => {
    atual = { rotulo: rot, conhecida, entradas: [] };
    out.push(atual);
  };
  for (const raw of linhas) {
    const l = raw.trim();
    if (!l) continue;
    const m = l.match(/^-\s*([^:]{1,26}?)\s*:\s*(.*)$/);
    if (m) {
      const rot = m[1].replace(/\*/g, "").trim();
      const canon = CANON_SEC.get(normSec(rot));
      abrir(canon || rot, !!canon);
      if (m[2].trim()) atual.entradas.push(m[2].trim());
      continue;
    }
    if (!atual) abrir("(sem seção)", false);
    atual.entradas.push(l);
  }
  return out;
}

/* separa "25/07/26: texto" -> { data, texto, ano } */
function fatiarEntrada(e) {
  const m = String(e).match(/^(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)\s*:{0,2}\s*(.*)$/);
  if (!m) return { data: null, texto: String(e), ts: null };
  const p = m[1].split("/");
  let ts = null;
  if (p.length === 3) {
    let a = parseInt(p[2], 10);
    if (a < 100) a += 2000;
    const mes = parseInt(p[1], 10), dia = parseInt(p[0], 10);
    if (a > 2000 && a < 2100 && mes >= 1 && mes <= 12) ts = new Date(a, mes - 1, dia).getTime();
  }
  return { data: m[1], texto: m[2], ts };
}

/* texto só com entradas recentes (mantém sem data, que não dá pra datar) */
function resumirAnamnese(txt, meses) {
  const corte = Date.now() - meses * 30.44 * 864e5;
  const secs = parseAnamnese(txt);
  const out = [];
  for (const s of secs) {
    const mantidas = s.entradas.filter(e => {
      const f = fatiarEntrada(e);
      return f.ts === null || f.ts >= corte;
    });
    if (!mantidas.length) continue;
    out.push("- " + s.rotulo + ":");
    mantidas.forEach(e => out.push(e));
  }
  return out.join("\n");
}


/* nome curto na planilha -> nome legível na tela */
const SECAO_NOME = {
  "Obj": "Objetivos",
  "Diag": "Diagnóstico",
  "Dor/Pat": "Dor / Patologia",
  "Tempo": "Tempo de treino",
  "Dif. Exerc": "Dificuldade em exercícios",
  "Pref. Treino": "Preferências de treino",
  "Pref. Exerc": "Preferências de exercícios",
  "Músc + responsivo": "Músculo mais responsivo",
  "Músc - responsivo": "Músculo menos responsivo",
  "Coord": "Coordenação",
  "Obs Gerais": "Observações gerais",
  "Supl/Med": "Suplementos e medicamentos",
  "Hist": "Histórico",
  "Outras Ativs": "Outras atividades"
};
const nomeSecao = r => SECAO_NOME[r] || r;

/* ---------- Edição cirúrgica de uma seção ----------
   NÃO remonta o texto inteiro: acha as linhas daquela seção no texto
   original e troca só elas, preservando o cabeçalho byte a byte.
   Remontar tudo alteraria espaços e quebraria seções vizinhas — testei. */
function limitesSecao(txt, rotulo) {
  const linhas = String(txt).replace(/\r/g, "").split("\n");
  let ini = -1, fim = linhas.length;
  for (let i = 0; i < linhas.length; i++) {
    const m = linhas[i].trim().match(/^-\s*([^:]{1,26}?)\s*:\s*(.*)$/);
    if (!m) continue;
    const rot = CANON_SEC.get(normSec(m[1].replace(/\*/g, "").trim())) || m[1].trim();
    if (ini === -1 && rot === rotulo) { ini = i; continue; }
    if (ini !== -1) { fim = i; break; }
  }
  return { linhas, ini, fim };
}

function corpoSecao(txt, rotulo) {
  const { linhas, ini, fim } = limitesSecao(txt, rotulo);
  if (ini === -1) return null;
  const m = linhas[ini].trim().match(/^-\s*[^:]{1,26}?\s*:\s*(.*)$/);
  const naMesmaLinha = m && m[1].trim() ? [m[1].trim()] : [];
  return [...naMesmaLinha, ...linhas.slice(ini + 1, fim)]
    .filter(l => l.trim() !== "").join("\n");
}

function substituirSecao(txt, rotulo, novoCorpo) {
  const { linhas, ini, fim } = limitesSecao(txt, rotulo);
  if (ini === -1) return null;

  const cab = linhas[ini];
  const m = cab.match(/^(\s*-\s*[^:]{1,26}?\s*:)(.*)$/);
  const prefixo = m ? m[1] : "- " + rotulo + ":";
  /* a planilha às vezes traz o conteúdo na MESMA linha do rótulo
     ("- Diag: Possui fascite plantar"). Se era assim e continua cabendo
     numa linha, mantém assim — senão o formato mudaria sozinho. */
  const eraInline = !!(m && m[2].trim());
  const sufixoCab = m ? m[2].match(/^(\s*)/)[1] : " ";

  const corpo = String(novoCorpo).replace(/\r/g, "").split("\n")
    .filter(l => l.trim() !== "");

  /* preserva as linhas em branco no fim do bloco (inclusive a quebra
     final do arquivo, que some se a seção for a última) */
  const cauda = [];
  for (let i = fim - 1; i > ini && linhas[i].trim() === ""; i--) cauda.unshift(linhas[i]);

  let bloco;
  if (eraInline && corpo.length <= 1) {
    bloco = [prefixo + sufixoCab + (corpo[0] || "")];
    if (!corpo.length) bloco = [prefixo];
  } else {
    bloco = [prefixo, ...corpo];
  }

  return [...linhas.slice(0, ini), ...bloco, ...cauda, ...linhas.slice(fim)].join("\n");
}

/* quantas vezes esse rótulo aparece no texto */
function contarSecao(txt, rotulo) {
  let n = 0;
  for (const l of String(txt).replace(/\r/g, "").split("\n")) {
    const m = l.trim().match(/^-\s*([^:]{1,26}?)\s*:\s*(.*)$/);
    if (!m) continue;
    const rot = CANON_SEC.get(normSec(m[1].replace(/\*/g, "").trim())) || m[1].trim();
    if (rot === rotulo) n++;
  }
  return n;
}

/* o corpo digitado não pode conter algo que o parser leia como cabeçalho,
   senão o texto se reorganiza sozinho ao salvar */
function linhaVirariaSecao(linha) {
  return /^-\s*[^:]{1,26}?\s*:/.test(String(linha).trim());
}
function corpoTemCabecalho(corpo) {
  return String(corpo).replace(/\r/g, "").split("\n").filter(linhaVirariaSecao);
}

/* uma seção só é editável se:
   1) aparecer uma única vez no texto
   2) salvar SEM MUDAR NADA devolver o texto byte a byte idêntico
   Se qualquer uma falhar, mostra cadeado em vez do lápis. */
function secaoSegura(txt, rotulo) {
  try {
    if (contarSecao(txt, rotulo) !== 1) return false;
    const corpo = corpoSecao(txt, rotulo);
    if (corpo === null) return false;
    return substituirSecao(txt, rotulo, corpo) === txt;
  } catch (e) { return false; }
}

function DrawerAnamnese({ aluno, onFechar }) {
  useEsc(true, onFechar);
  const [atual, setAtual]     = useState(undefined);
  const [hist, setHist]       = useState([]);
  const [modo, setModo]       = useState("secoes");
  const [rascunho, setRasc]   = useState("");
  const [erro, setErro]       = useState("");
  const [aviso, setAviso]     = useState("");
  const [salvando, setSalv]   = useState(false);
  const [edicao, setEdicao]   = useState("");
  const [sujo, setSujo]       = useState(false);
  const [ents, setEnts]       = useState(null);  // entradas segmentadas
  const [secDefs, setSecDefs] = useState([]);
  const [secEdit, setSecEdit] = useState(null);   // rótulo em edição
  const [secTexto, setSecTexto] = useState("");
  const [verVazias, setVerVazias] = useState(false);
  const [menuCopiar, setMenuCopiar] = useState(false);

  const carregar = useCallback(async () => {
    setErro("");
    const { data, error } = await sb
      .from("anamneses")
      .select("id, seq, texto, origem, criado_em, atualizado_em, congelada")
      .eq("aluno_id", aluno.id)
      .order("criado_em", { ascending: false })
      .order("seq", { ascending: false });
    if (error) { setErro(error.message); setAtual(null); return; }
    setHist(data || []);
    const a = (data && data[0]) || null;
    setAtual(a);
    setEdicao(a ? a.texto : "");
    setSujo(false);

    const [en, se] = await Promise.all([
      sb.from("vw_anamnese_entradas").select("*").eq("aluno_id", aluno.id),
      sb.from("anamnese_secoes").select("*").eq("ativa", true).order("ordem")
    ]);
    setEnts(en.error ? [] : (en.data || []));
    setSecDefs(se.error ? [] : (se.data || []));
  }, [aluno.id]);

  useEffect(() => { carregar(); }, [carregar]);

  async function salvar() {
    if (!rascunho.trim()) { setErro("Cola o texto da anamnese antes de salvar."); return; }
    setSalv(true); setErro("");
    const { error } = await sb.from("anamneses")
      .insert({ aluno_id: aluno.id, texto: rascunho, origem: "colado" });
    setSalv(false);
    if (error) { setErro(error.message); return; }
    setRasc(""); setAviso("Versão salva."); setModo("secoes");
    await carregar();
  }

  async function salvarEdicao() {
    if (!atual) { setErro("Não há versão para editar."); return; }
    setSalv(true); setErro(""); setAviso("");
    const { error } = await sb.from("anamneses")
      .update({ texto: edicao, atualizado_em: new Date().toISOString() })
      .eq("id", atual.id);
    if (error) { setSalv(false); setErro(error.message); return; }

    let msg = "Salvo no Supabase.";
    const r = await gravarNoSheets(aluno, edicao);
    if (r.ok)            msg += " Planilha WTAN atualizada.";
    else if (!r.pulou)   msg += " ⚠️ Não gravou no Sheets: " + r.erro;

    setSalv(false); setSujo(false); setAviso(msg);
    await carregar();
  }

  function abrirSecao(rot) {
    if (!atual) return;
    setSecEdit(rot);
    setSecTexto(corpoSecao(atual.texto, rot) || "");
  }

  async function salvarSecao() {
    if (!atual || !secEdit) return;

    /* o corpo não pode conter linha que o parser leia como cabeçalho */
    const intrusas = corpoTemCabecalho(secTexto);
    if (intrusas.length) {
      setErro('Esta linha seria lida como uma seção nova e reorganizaria o texto: "' +
        intrusas[0].trim() + '". Tira o hífen do começo ou os dois-pontos.');
      return;
    }

    setSalv(true); setErro("");

    /* relê do banco antes de gravar: se mudou desde que a tela abriu
       (você editou no App, ou em outra aba), aborta em vez de sobrescrever */
    const chk = await sb.from("anamneses").select("id, texto")
      .eq("id", atual.id).single();
    if (chk.error) { setSalv(false); setErro(chk.error.message); return; }
    if (chk.data.texto !== atual.texto) {
      setSalv(false);
      setErro("Esta anamnese mudou em outro lugar depois que você abriu. " +
        "Nada foi salvo — fecha e abre de novo para pegar a versão nova.");
      return;
    }

    const novo = substituirSecao(atual.texto, secEdit, secTexto);
    if (novo === null) { setSalv(false); setErro("Não achei essa seção no texto."); return; }
    if (novo === atual.texto) { setSalv(false); setSecEdit(null); return; }

    /* congela a versão anterior uma vez por dia, para sempre existir o "ontem" */
    const hojeStr = new Date().toISOString().slice(0, 10);
    const jaCongelouHoje = hist.some(h =>
      h.congelada && String(h.criado_em).slice(0, 10) === hojeStr);
    if (!jaCongelouHoje) {
      await sb.from("anamneses").update({ congelada: true }).eq("id", atual.id);
      const ins = await sb.from("anamneses")
        .insert({ aluno_id: aluno.id, texto: novo, origem: "app" });
      if (ins.error) { setSalv(false); setErro(ins.error.message); return; }
    } else {
      const up = await sb.from("anamneses")
        .update({ texto: novo, atualizado_em: new Date().toISOString() })
        .eq("id", atual.id);
      if (up.error) { setSalv(false); setErro(up.error.message); return; }
    }

    let msg = nomeSecao(secEdit) + " salva.";
    const r = await gravarNoSheets(aluno, novo);
    if (r.ok) msg += " Planilha atualizada.";
    else if (!r.pulou) msg += " ⚠️ Não gravou no Sheets: " + r.erro;

    setSalv(false); setSecEdit(null); setAviso(msg);
    await carregar();
  }

  async function congelar() {
    if (!atual) return;
    setSalv(true); setErro("");
    const { error } = await sb.from("anamneses")
      .update({ congelada: true }).eq("id", atual.id);
    if (error) { setSalv(false); setErro(error.message); return; }
    const ins = await sb.from("anamneses")
      .insert({ aluno_id: aluno.id, texto: edicao, origem: "app" });
    setSalv(false);
    if (ins.error) { setErro(ins.error.message); return; }
    setAviso("Versão congelada. A cópia nova é a editável agora.");
    await carregar();
  }

  const temEnt = !!(ents && ents.length);

  /* depois da migração, copiar SEMPRE vem das entradas — o texto
     original não acompanha as edições feitas por lá */
  function txtCopiar(meses, modo) {
    if (temEnt) {
      const corpo = entradasParaTexto(secDefs, ents, meses, modo);
      if (modo === "planilha") return corpo;
      const cab = "ANAMNESE · " + aluno.nome +
        (meses ? "  (últimos " + meses + " meses)" : "") +
        "\n" + "─".repeat(46) + "\n";
      return cab + corpo;
    }
    if (!atual) return "";
    return meses ? resumirAnamnese(atual.texto, meses) : atual.texto;
  }

  function copiar(texto, msg) {
    navigator.clipboard.writeText(texto);
    setAviso(msg);
  }

  const secs = atual ? parseAnamnese(atual.texto) : [];
  const mapa = new Map(secs.map(x => [x.rotulo, x]));
  const ordenadas = [
    ...SECOES_ANAMNESE.map(r => mapa.get(r) || { rotulo: r, conhecida: true, entradas: [] }),

                  {temEnt && atual && (
                    <div onClick={() => { copiar(atual.texto,
                      "Texto original (anterior à migração) copiado."); setMenuCopiar(false); }}

                  )}
                </div>
              )}
            </div>
          )}
          <h2>{aluno.nome}</h2>
          <div className="meta">
            {atual === undefined ? "carregando..."
              : atual === null ? "sem anamnese registrada"

        <div className="dr-acoes">
          <button className="btn-sec" onClick={() => setModo("entradas")}>Entradas</button>

          <button className="btn-sec" onClick={() => setModo("perguntas")}>
            Perguntas{aluno.perguntas_pendentes ? " (" + aluno.perguntas_pendentes + ")" : ""}

          <button className="btn-sec" onClick={() => setModo("academias")}>
            Academias

          <button className="btn-sec" onClick={() => setModo("aparelhos")}>
            Aparelhos
          </button>
          <button className="btn-sec" onClick={() => setModo("colar")}>Colar nova</button>

        </div>

        <div className="dr-body">

            </div>

          {modo === "entradas" ? (
            <PainelEntradas aluno={aluno} />

            <PainelAparelhosAluno aluno={aluno} />
          ) : modo === "academias" ? (
            <PainelAcademiasAluno aluno={aluno} />
          ) : modo === "perguntas" ? (
            <PainelPerguntas aluno={aluno} />
          ) : modo === "colar" ? (
            <>
              <p style={{ color: "var(--mut)", fontSize: 13, marginBottom: 12, lineHeight: 1.55 }}>

              </p>
              <textarea className="raw" value={rascunho}
                onChange={e => setRasc(e.target.value)}
                placeholder={"- Obj:\n25/07/26: ...\n- Diag:\n..."} />

                <button onClick={salvar} disabled={salvando || !rascunho.trim()}>
                  {salvando ? "Salvando..." : "Salvar versão"}
                </button>
                <span className="status">
                  {rascunho ? parseAnamnese(rascunho).length + " seção(ões) detectada(s)" : ""}
                </span>
              </div>
            </>
          ) : modo === "editar" ? (
            atual ? (
              <>
                <div style={{ display: "flex", justifyContent: "space-between",
                              alignItems: "center", marginBottom: 8, fontSize: 12,
                              color: "var(--mut)" }}>
                  <span>
                    Editando a versão atual. Salvar sobrescreve
                    {WTAN_URL && aluno.sheets_linha
                      ? " e atualiza a linha " + aluno.sheets_linha + " do Sheets."
                      : "."}
                  </span>
                  <span>{edicao.length} chars</span>
                </div>
                <textarea className="raw" value={edicao}
                  onChange={e => { setEdicao(e.target.value); setSujo(true); }} />
                <div className="acoes" style={{ marginTop: 12 }}>
                  <button onClick={salvarEdicao} disabled={salvando || !sujo}>
                    {salvando ? "Salvando..." : "Salvar"}
                  </button>
                  <button className="btn-sec" onClick={congelar} disabled={salvando}>
                    Congelar versão
                  </button>
                  {sujo && (
                    <button className="btn-sec"
                      onClick={() => { setEdicao(atual.texto); setSujo(false); }}>
                      Descartar
                    </button>
                  )}
                  <span className="status">
                    {parseAnamnese(edicao).length} seção(ões)
                  </span>
                </div>
              </>
            ) : <div className="vazio-nota">Nada registrado ainda. Usa "Colar nova".</div>
          ) : modo === "hist" ? (
            hist.map(h => (
              <div className="hist-it" key={h.id}>
                <span>
                  <b>{new Date(h.criado_em).toLocaleString("pt-BR")}</b> · {h.origem}
                  {h.congelada && <span className="st-tag">congelada</span>}
                  {h.atualizado_em && <span style={{ marginLeft: 8, fontSize: 11 }}>
                    editada {new Date(h.atualizado_em).toLocaleDateString("pt-BR")}</span>}
                </span>
                <span>
                  {h.texto.length} caracteres
                  <button className="btn-sec" style={{ marginLeft: 10, padding: "4px 10px", fontSize: 11 }}
                    onClick={() => copiar(h.texto, "Versão copiada.")}>copiar</button>
                </span>
              </div>
            ))
          ) : atual === undefined ? (
            <div className="msg">Buscando...</div>
          ) : atual === null ? (
            <div className="msg">
              Nenhuma anamnese ainda. Usa "Colar nova" para trazer do Sheets.
            </div>
          ) : (
            (() => {
              const cheias = ordenadas.filter(x => x.entradas.length);
              const vazias = ordenadas.filter(x => !x.entradas.length);
              const lista = verVazias ? ordenadas : cheias;
              return (
                <>
                  {lista.map(sec => {
                    const cls = "sec-card" + (DESTAQUE.has(sec.rotulo) ? " dor" : "") +
                      (sec.entradas.length ? "" : " vazia");
                    const editavel = atual && sec.conhecida &&
                      secaoSegura(atual.texto, sec.rotulo);
                    const emEdicao = secEdit === sec.rotulo;
                    return (
                      <div className={cls} key={sec.rotulo}>
                        <div className="sec-h">
                          <b>{nomeSecao(sec.rotulo)}</b>
                          {!sec.conhecida && <i>rótulo fora do padrão</i>}
                          {sec.entradas.length > 1 && <i>{sec.entradas.length} entradas</i>}
                          <span style={{ flex: 1 }} />
                          {!emEdicao && (editavel ? (
                            <button className="sec-lapis" title={"Editar " + nomeSecao(sec.rotulo)}
                              onClick={() => abrirSecao(sec.rotulo)}>✎</button>
                          ) : sec.conhecida && atual ? (
                            <span className="sec-bloq"
                              title={contarSecao(atual.texto, sec.rotulo) > 1
                                ? "Este rótulo aparece " + contarSecao(atual.texto, sec.rotulo) +
                                  "x no texto. Edição por seção ficaria ambígua — use a aba Editar."
                                : "O formato desta seção (linha em branco no meio, por exemplo) " +
                                  "não permite edição segura. Use a aba Editar."}>
                              🔒
                            </span>
                          ) : null)}
                        </div>

                        {emEdicao ? (
                          <div className="sec-ed">
                            <textarea value={secTexto} rows={Math.max(3, secTexto.split("\n").length + 1)}
                              onChange={e => setSecTexto(e.target.value)}
                              placeholder={"Uma entrada por linha. Ex:\n" + hojeCurto() + ": ..."} />
                            <div className="acoes" style={{ marginTop: 8 }}>
                              <button onClick={salvarSecao} disabled={salvando}>
                                {salvando ? "Salvando..." : "Salvar seção"}
                              </button>
                              <button className="btn-sec" onClick={() => setSecEdit(null)}>
                                Cancelar
                              </button>
                              <span className="status">só esta seção é alterada</span>
                            </div>
                          </div>
                        ) : sec.entradas.length === 0
                          ? <div className="vazio-nota">—</div>
                          : sec.entradas.map((e, i) => {
                              const f = fatiarEntrada(e);
                              return (
                                <div className="ent" key={i}>
                                  <span className={"dt" + (f.data ? "" : " sem")}>
                                    {f.data || "—"}
                                  </span>
                                  <span className="tx">{f.texto}</span>
                                </div>
                              );
                            })}
                      </div>
                    );
                  })}
                  {atual && SECOES_ANAMNESE.filter(r =>
                    contarSecao(atual.texto, r) > 1).length > 0 && (
                    <div className="err" style={{ background: "#2a2418",
                      borderColor: "#5c4a24", color: "#f0a35e", marginTop: 10 }}>
                      ⚠️ Rótulo repetido no texto:{" "}
                      {SECOES_ANAMNESE.filter(r => contarSecao(atual.texto, r) > 1)
                        .map(nomeSecao).join(", ")}. A tela mostra as entradas juntas,
                      mas o texto original tem duas seções separadas. Vale unificar na aba Editar.
                    </div>
                  )}
                  {vazias.length > 0 && (
                    <button className="sec-vazias" onClick={() => setVerVazias(v => !v)}>
                      {verVazias
                        ? "ocultar seções vazias"
                        : vazias.length + " seção(ões) vazia(s) · mostrar"}
                    </button>
                  )}
                </>
              );
            })()
          )}
        </div>
      </div>
    </>
  );
}


/* ---------- Importação de alunos + anamneses ---------- */
const chaveNome = t => String(t || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/[^a-z0-9]+/g, " ").trim();

/* heurística: isso parece nome de pessoa, ou é linha de anotação? */
function nomeSuspeito(n) {
  const t = String(n || "").trim();
  if (!t) return "vazio";
  if (t.length > 45) return "muito longo";
  if (/[\/;]|\s-\s|:/.test(t)) return "tem separador";
  if (/\d/.test(t)) return "tem número";
  const sa = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (sa === sa.toUpperCase() && t.split(/\s+/).length > 1) return "tudo maiúsculo";
  if (/\b(medidas|fotos|perguntas|anamnese|legenda|obs|full)\b/i.test(t))
    return "palavra de seção";
  if (t.split(/\s+/).length > 6) return "palavras demais";
  return null;
}

function conciliar(doSheets, noBanco) {
  const porChave = new Map(), porPrimeiro = new Map();
  for (const a of noBanco) {
    const k = chaveNome(a.nome);
    if (!porChave.has(k)) porChave.set(k, []);
    porChave.get(k).push(a);
    const p = k.split(" ")[0];
    if (!porPrimeiro.has(p)) porPrimeiro.set(p, []);
    porPrimeiro.get(p).push(a);
  }
  return doSheets.map(s => {
    const k = chaveNome(s.nome);
    const nSec = parseAnamnese(s.texto || "").filter(x => x.conhecida).length;
    if (!k || !String(s.texto || "").trim())
      return { ...s, tipo: "invalido", alvo: null, cands: [], nSec, motivo: "sem nome ou texto" };
    const susp = nomeSuspeito(s.nome);
    if (susp && !(porChave.get(k) || []).length)
      return { ...s, tipo: "suspeito", alvo: null, cands: [], nSec, motivo: susp };
    const ex = porChave.get(k) || [];
    if (ex.length === 1) return { ...s, tipo: "exato", alvo: ex[0], cands: ex, nSec };
    if (ex.length > 1)   return { ...s, tipo: "ambiguo", alvo: null, cands: ex, nSec };
    const toks = k.split(" ");
    const cands = (porPrimeiro.get(toks[0]) || []).filter(a => {
      const y = chaveNome(a.nome).split(" ");
      if (toks.length === 1 || y.length === 1) return true;
      return y.some(w => toks.includes(w) && w !== toks[0]) ||
             toks.every(t => y.includes(t)) || y.every(t => toks.includes(t));
    });
    if (cands.length === 1) return { ...s, tipo: "provavel", alvo: cands[0], cands, nSec };
    if (cands.length > 1)   return { ...s, tipo: "ambiguo", alvo: null, cands, nSec };
    return { ...s, tipo: "novo", alvo: null, cands: [], nSec };
  });
}

function ModalImportar({ alunos, onFechar, onPronto }) {
  useEsc(true, onFechar);
  const [url, setUrl]       = useState("");
  const [colado, setColado] = useState("");
  const [linhas, setLinhas] = useState(null);
  const [sel, setSel]       = useState({});
  const [alvos, setAlvos]   = useState({});
  const [erro, setErro]     = useState("");
  const [aviso, setAviso]   = useState("");
  const [busy, setBusy]     = useState(false);
  const [prog, setProg]     = useState(0);

  function processar(arr) {
    if (!Array.isArray(arr) || !arr.length) {
      setErro("Não achei nenhuma anamnese no retorno."); return;
    }
    const r = conciliar(arr, alunos);
    setLinhas(r);
    const s = {}, a = {};
    r.forEach((x, i) => {
      s[i] = x.tipo === "exato" || x.tipo === "provavel" || x.tipo === "novo";
      if (x.tipo === "suspeito") s[i] = false;
      if (x.alvo) a[i] = x.alvo.id;
    });
    setSel(s); setAlvos(a); setErro("");
  }

  async function buscar() {
    if (!url.trim()) { setErro("Cola a URL do Apps Script."); return; }
    setBusy(true); setErro("");
    try {
      const u = url.trim();
      const sep = u.indexOf("?") >= 0 ? "&" : "?";
      const rr = await fetch(u + sep + "_t=" + Date.now(),
        { method: "GET", redirect: "follow", cache: "no-store" });
      if (rr.status === 404) throw new Error(
        "HTTP 404 — confere se a URL termina em /exec e se a implantação está " +
        "publicada com acesso 'Qualquer pessoa'. Se acabou de publicar, espera 1 min.");
      if (!rr.ok) throw new Error("HTTP " + rr.status);
      const j = await rr.json();
      if (j.ok === false) throw new Error(j.erro || "o script retornou erro");
      processar(j.anamneses || j);
    } catch (e) {
      setErro("Não consegui buscar: " + e.message + ". Usa o campo de colar abaixo.");
    }
    setBusy(false);
  }

  function processarColado() {
    try {
      const j = JSON.parse(colado);
      processar(Array.isArray(j) ? j : (j.anamneses || []));
    } catch (e) { setErro("JSON inválido: " + e.message); }
  }

  async function gravar() {
    const escolhidas = (linhas || []).map((l, i) => ({ l, i }))
      .filter(({ i }) => sel[i]);
    if (!escolhidas.length) { setErro("Nada selecionado."); return; }
    setBusy(true); setErro(""); setProg(0);

    let criados = 0, atualizados = 0, falhas = 0;
    for (let k = 0; k < escolhidas.length; k++) {
      const { l, i } = escolhidas[k];
      try {
        let alunoId = alvos[i] || null;
        if (!alunoId) {
          const ins = await sb.from("alunos")
            .insert({ nome: l.nome, status: "ativo",
                      sheets_linha: l.linha || null })
            .select("id").single();
          if (ins.error) throw new Error(ins.error.message);
          alunoId = ins.data.id; criados++;
        } else {
          if (l.linha) {
            await sb.from("alunos")
              .update({ sheets_linha: l.linha }).eq("id", alunoId);
          }
          atualizados++;
        }
        const an = await sb.from("anamneses")
          .insert({ aluno_id: alunoId, texto: l.texto, origem: "sheets" });
        if (an.error) throw new Error(an.error.message);
      } catch (e) {
        falhas++;
        console.error("falha em " + l.nome + ": " + e.message);
      }
      setProg((k + 1) / escolhidas.length);
    }
    setBusy(false);
    setAviso(criados + " aluno(s) criado(s), " + atualizados +
      " atualizado(s)" + (falhas ? ", " + falhas + " falha(s) — ver console" : "") + ".");
    onPronto();
  }

  const grupos = linhas ? {
    exato:    linhas.map((l, i) => ({ l, i })).filter(x => x.l.tipo === "exato"),
    provavel: linhas.map((l, i) => ({ l, i })).filter(x => x.l.tipo === "provavel"),
    novo:     linhas.map((l, i) => ({ l, i })).filter(x => x.l.tipo === "novo"),
    ambiguo:  linhas.map((l, i) => ({ l, i })).filter(x => x.l.tipo === "ambiguo"),
    suspeito: linhas.map((l, i) => ({ l, i })).filter(x => x.l.tipo === "suspeito"),
    invalido: linhas.map((l, i) => ({ l, i })).filter(x => x.l.tipo === "invalido")
  } : null;

  const marcados = Object.values(sel).filter(Boolean).length;

  const item = ({ l, i }, comSelect) => (
    <div className="imp-it" key={i}>
      <input type="checkbox" checked={!!sel[i]}
        onChange={e => setSel({ ...sel, [i]: e.target.checked })} />
      <span className="n1">{l.nome}</span>
      <span className="seta">→</span>
      {comSelect ? (
        <select value={alvos[i] || ""}
          onChange={e => setAlvos({ ...alvos, [i]: e.target.value || null })}>
          <option value="">criar aluno novo</option>
          {(l.cands.length ? l.cands : alunos).map(c =>
            <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
      ) : (
        <span className="n2">{l.alvo ? l.alvo.nome : "criar aluno novo"}</span>
      )}
      <span className="ch">
        {String(l.texto || "").length} chars
        {l.nSec === 0 && <span className="st-tag">texto corrido</span>}
      </span>
    </div>
  );

  return (
    <>
      <div className="drawer-bg" onClick={onFechar} />
      <div className="drawer" style={{ width: "min(880px,96vw)" }}>
        <div className="dr-top">
          <button className="dr-x" onClick={onFechar}>×</button>
          <h2>Importar do Sheets</h2>
          <div className="meta">
            Traz nome + anamnese. Alunos existentes recebem versão nova, não duplicam.
          </div>
        </div>
        <div className="dr-body">
          {erro && <div className="err">{erro}</div>}
          {aviso && <div className="ok-msg">{aviso}</div>}

          {!linhas ? (
            <>
              <div className="box">
                <h2>Opção 1 · URL do Apps Script</h2>
                <p>Publica o script na planilha WTAN e cola a URL que termina em /exec.</p>
                <input value={url} onChange={e => setUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  style={{ fontFamily: "ui-monospace,monospace", fontSize: 12 }} />
                <div className="acoes">
                  <button onClick={buscar} disabled={busy || !url.trim()}>
                    {busy ? "Buscando..." : "Buscar"}
                  </button>
                </div>
              </div>
              <div className="box">
                <h2>Opção 2 · Colar JSON</h2>
                <p>Abre a URL numa aba, copia tudo e cola aqui.</p>
                <textarea className="raw" style={{ minHeight: 160 }}
                  value={colado} onChange={e => setColado(e.target.value)}
                  placeholder='{"ok":true,"anamneses":[{"nome":"...","texto":"..."}]}' />
                <div className="acoes" style={{ marginTop: 10 }}>
                  <button className="btn-sec" onClick={processarColado}
                    disabled={!colado.trim()}>Processar</button>
                </div>
              </div>
            </>
          ) : (
            <>
              <div className="cards" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
                <div className="kpi g"><b>{grupos.exato.length}</b><span>já existe</span></div>
                <div className="kpi w"><b>{grupos.provavel.length}</b><span>provável</span></div>

                      <div className="imp-it" key={i}>
                        <span className="n1" style={{ color: "var(--mut)" }}>
                          {l.nome || "(sem nome)"}

                        <span className="ch">{String(l.texto || "").length} chars</span>
                      </div>
