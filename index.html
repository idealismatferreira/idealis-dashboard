<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idealis · Dashboard</title>
<!-- VERSOES FIXADAS de proposito. Babel 8 gera "import" e quebra com React UMD.
     Nao troque por URL sem versao (@babel/standalone sem numero). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --line:#232a33;
    --txt:#e6edf3; --mut:#8b949e; --accent:#7fd858;
    --warn:#f0a35e; --alert:#e05c5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:'Sora',system-ui,-apple-system,sans-serif;min-height:100vh}
  #root{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
  .login{max-width:380px;margin:12vh auto;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:32px}
  .login h1{font-size:20px;margin-bottom:4px}
  .login p{color:var(--mut);font-size:13px;margin-bottom:24px}
  input{width:100%;padding:11px 13px;margin-bottom:12px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);
    font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  textarea{width:100%;min-height:110px;padding:11px 13px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);
    font-size:12px;font-family:ui-monospace,monospace;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  button{padding:11px;background:var(--accent);color:#0e1116;border:none;
    border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;
    font-family:inherit;width:100%}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-sec{background:transparent;border:1px solid var(--line);color:var(--txt);
    width:auto;padding:9px 16px;font-size:13px;font-weight:500}
  .btn-sec:hover{border-color:var(--accent);filter:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .top h1{font-size:24px}
  .sair{width:auto;padding:7px 14px;background:transparent;
    border:1px solid var(--line);color:var(--mut);font-size:12px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .tab{background:none;border:none;color:var(--mut);padding:11px 18px;
    font-size:14px;font-weight:500;cursor:pointer;width:auto;
    border-bottom:2px solid transparent;border-radius:0;font-family:inherit}
  .tab:hover{color:var(--txt);filter:none}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
  .row{display:flex;align-items:center;gap:16px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:10px;padding:14px 18px;margin-bottom:8px}
  .row.w{border-left-color:var(--warn)}
  .row.a{border-left-color:var(--alert)}
  .row.ok{border-left-color:var(--accent)}
  .av{width:46px;height:46px;border-radius:50%;object-fit:cover;
    background:var(--line);flex-shrink:0}
  .ph{width:46px;height:46px;border-radius:50%;background:var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:600;
    color:var(--mut);flex-shrink:0;font-size:15px}
  .nome{flex:1;font-size:15px;font-weight:500}
  .dias{text-align:right;min-width:110px}
  .dias b{font-size:19px;font-weight:600;display:block;line-height:1.2}
  .dias span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .msg{color:var(--mut);text-align:center;padding:50px 0;font-size:14px}
  .err{background:#2d1618;border:1px solid #5c2427;color:#f5a3a3;
    padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .box{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:22px;margin-bottom:16px}
  .box h2{font-size:16px;margin-bottom:6px}
  .box p{color:var(--mut);font-size:13px;line-height:1.55;margin-bottom:16px}
  .acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .acoes button{width:auto;padding:10px 20px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--line);border-radius:10px;padding:16px 18px}
  .kpi.g{border-left-color:var(--accent)}
  .kpi.w{border-left-color:var(--warn)}
  .kpi.r{border-left-color:var(--alert)}
  .kpi b{font-size:26px;font-weight:600;display:block;line-height:1.15}
  .kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .barra{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0 6px}
  .barra i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .status{font-size:13px;color:var(--mut)}
  .lista{max-height:420px;overflow-y:auto;border:1px solid var(--line);
    border-radius:10px;background:var(--card)}
  .item{display:flex;gap:14px;align-items:baseline;padding:11px 16px;
    border-bottom:1px solid var(--line);font-size:13px}
  .item:last-child{border-bottom:none}
  .item .eid{color:var(--mut);font-family:ui-monospace,monospace;
    font-size:11px;min-width:46px}
  .item .enm{flex:1;font-weight:500}
  .item .etg{color:var(--warn);font-size:11px;text-align:right;max-width:52%}
  .item .etg.vazio{color:var(--alert)}
  .ok-msg{background:#12240f;border:1px solid #2c4f22;color:#a7e58c;
    padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  select{padding:9px 12px;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;color:var(--txt);font-size:14px;font-family:inherit;min-width:220px}
  select:focus{outline:none;border-color:var(--accent)}
  .vol{width:100%;border-collapse:collapse;font-size:13px}
  .vol th,.vol td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center}
  .vol th{color:var(--accent);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.7px}
  .vol th.l,.vol td.l{text-align:left;font-weight:500}
  .vol td.z{color:#3d454f}
  .vol td.tt{font-weight:700;color:var(--accent)}
  .vol tr.tot td{border-top:2px solid var(--line);border-bottom:none;
    font-weight:700;padding-top:10px}
  .vol tr.sec td{color:var(--mut);font-size:10px;text-transform:uppercase;
    letter-spacing:.8px;text-align:left;padding-top:18px;border-bottom:1px solid var(--line)}
  .pend-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;
    background:#2a2118;color:var(--warn);text-transform:uppercase;letter-spacing:.5px}
  .futuro{border:1px dashed var(--line);border-radius:12px;padding:18px 22px;
    color:var(--mut);font-size:13px;line-height:1.6}
  .futuro b{color:var(--txt);display:block;margin-bottom:5px;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ============ CONFIG ============ */
const SUPABASE_URL      = "https://lbnemzhwibcarhkaifoy.supabase.co";
const SUPABASE_ANON_KEY = "COLE_SUA_PUBLISHABLE_KEY_AQUI";
const CATALOGO_URL      = "https://script.google.com/macros/s/AKfycbyi183noK7vugBRyh5AMMcgey2Ksz2oqQvKGAfZ8Q-ZcJU0ag4TxzuiAS6oDP0u3BI7/exec";
const LOTE = 150;
/* ================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- helpers de transformação ---------- */
const tags = s => String(s ?? "").split("|").map(t => t.trim()).filter(Boolean);
const bool = v => String(v ?? "").trim().toUpperCase() === "X";
const txt  = v => { const s = String(v ?? "").trim(); return s || null; };
const idNum = v => {
  if (v === null || v === undefined || String(v).trim() === "") return NaN;
  const n = Number(v);
  return Number.isInteger(n) && n > 0 ? n : NaN;
};

function transformar(l) {
  return {
    id: idNum(l.id),
    exercicio: String(l.exercicio ?? "").trim(),
    grupos: tags(l.grupo),
    contextos: tags(l.contexto),
    subgrupo: txt(l.subgrupo),
    musculo_alvo: txt(l.musculo_alvo),
    equipamento: txt(l.equipamento),
    em_casa: bool(l.em_casa),
    video_proprio: bool(l.video_proprio),
    a_filmar: bool(l.a_filmar),
    isometrico: bool(l.isometrico),
    unilateral: bool(l.unilateral),
    bi_set: bool(l.bi_set),
    observacao: txt(l.observacao),
    video_url: txt(l.video_url),
    bruto: l,
    sincronizado_em: new Date().toISOString()
  };
}

function preparar(linhas) {
  const vistos = new Set(), validos = [], ignorados = [];
  for (const l of linhas) {
    const t = transformar(l);
    if (!Number.isFinite(t.id)) { ignorados.push({ id: l?.id, nome: l?.exercicio, motivo: "id inválido" }); continue; }
    if (!t.exercicio)           { ignorados.push({ id: l?.id, nome: "(sem nome)", motivo: "nome vazio" }); continue; }
    if (vistos.has(t.id))       { ignorados.push({ id: l?.id, nome: l?.exercicio, motivo: "id duplicado" }); continue; }
    vistos.add(t.id); validos.push(t);
  }
  return { validos, ignorados };
}

/* ---------- Login ---------- */
function Login() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro]   = useState("");
  const [busy, setBusy]   = useState(false);

  async function entrar() {
    if (!email || !senha) { setErro("Preenche os dois campos."); return; }
    setBusy(true); setErro("");
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    setBusy(false);
    if (error) setErro(error.message);
  }

  return (
    <div className="login">
      <h1>Idealis</h1>
      <p>Painel do treinador</p>
      {erro && <div className="err">{erro}</div>}
      <input type="email" placeholder="E-mail" value={email}
        onChange={e => setEmail(e.target.value)}
        onKeyDown={e => e.key === "Enter" && entrar()} />
      <input type="password" placeholder="Senha" value={senha}
        onChange={e => setSenha(e.target.value)}
        onKeyDown={e => e.key === "Enter" && entrar()} />
      <button onClick={entrar} disabled={busy}>{busy ? "Entrando..." : "Entrar"}</button>
    </div>
  );
}

/* ---------- Alunos ---------- */
function iniciais(nome) {
  return String(nome || "?").trim().split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
}

function LinhaAluno({ a }) {
  const d = a.dias_sem_treinar;
  const cls = d === null ? "a" : d >= 10 ? "a" : d >= 5 ? "w" : "ok";
  return (
    <div className={"row " + cls}>
      {a.foto_url
        ? <img className="av" src={a.foto_url} alt=""
            onError={e => { e.target.style.visibility = "hidden"; }} />
        : <div className="ph">{iniciais(a.nome)}</div>}
      <div className="nome">{a.nome}</div>
      <div className="dias">
        {d === null
          ? <><b style={{ color: "var(--alert)" }}>—</b><span>sem registro</span></>
          : d === 0
            ? <><b style={{ color: "var(--accent)" }}>hoje</b><span>último treino</span></>
            : <><b>{d}</b><span>{d === 1 ? "dia atrás" : "dias atrás"}</span></>}
      </div>
    </div>
  );
}

function PainelAlunos() {
  const [alunos, setAlunos] = useState(null);
  const [erro, setErro] = useState("");

  const carregar = useCallback(async () => {
    const { data, error } = await sb.from("vw_alunos_ultimo_treino").select("*");
    if (error) { setErro(error.message); setAlunos([]); return; }
    const ord = [...data].sort((x, y) => {
      if (x.dias_sem_treinar === null) return -1;
      if (y.dias_sem_treinar === null) return 1;
      return y.dias_sem_treinar - x.dias_sem_treinar;
    });
    setAlunos(ord);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  return (
    <div>
      <div className="sub">
        {alunos === null ? "Carregando..." : alunos.length + " aluno(s) · ordenado por tempo sem treinar"}
      </div>
      {erro && <div className="err">{erro}</div>}
      {alunos === null
        ? <div className="msg">Buscando dados...</div>
        : alunos.length === 0
          ? <div className="msg">Nenhum aluno visível. Confere as policies de RLS.</div>
          : alunos.map(a => <LinhaAluno key={a.id} a={a} />)}
    </div>
  );
}

/* ---------- Catálogo ---------- */
function PainelCatalogo() {
  const [fase, setFase]         = useState("idle");
  const [prog, setProg]         = useState(0);
  const [erro, setErro]         = useState("");
  const [aviso, setAviso]       = useState("");
  const [ignorados, setIgnor]   = useState([]);
  const [linhas, setLinhas]     = useState(null);
  const [manual, setManual]     = useState(false);
  const [colado, setColado]     = useState("");

  const carregarEstado = useCallback(async () => {
    const { data, error } = await sb
      .from("cardapio")
      .select("id, exercicio, grupos, subgrupo, musculo_alvo, sincronizado_em")
      .order("exercicio");
    if (error) { setErro(error.message); return; }
    setLinhas(data || []);
  }, []);

  useEffect(() => { carregarEstado(); }, [carregarEstado]);

  async function gravar(brutos) {
    const { validos, ignorados: ign } = preparar(brutos);
    setIgnor(ign);
    if (!validos.length) { setErro("Nenhum exercício válido no retorno."); setFase("idle"); return; }

    setFase("gravando"); setProg(0);
    for (let i = 0; i < validos.length; i += LOTE) {
      const lote = validos.slice(i, i + LOTE);
      const { error } = await sb.from("cardapio").upsert(lote, { onConflict: "id" });
      if (error) {
        setErro("Erro ao gravar (lote " + (Math.floor(i / LOTE) + 1) + "): " + error.message);
        setFase("idle"); await carregarEstado(); return;
      }
      setProg(Math.min(i + LOTE, validos.length) / validos.length);
    }
    setAviso(validos.length + " exercícios sincronizados." +
      (ign.length ? " " + ign.length + " ignorado(s), lista abaixo." : ""));
    setFase("idle");
    await carregarEstado();
  }

  async function sincronizar() {
    setErro(""); setAviso(""); setIgnor([]); setManual(false);
    setFase("buscando");
    let json;
    try {
      const r = await fetch(CATALOGO_URL, { method: "GET", redirect: "follow" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      json = await r.json();
    } catch (e) {
      setErro("Não consegui buscar o Catálogo pelo navegador (" + e.message +
        "). Provável bloqueio de CORS. Usa o plano B abaixo.");
      setManual(true); setFase("idle"); return;
    }
    if (!json || json.ok !== true || !Array.isArray(json.exercicios)) {
      setErro("Resposta inesperada do Catálogo. Esperava { ok: true, exercicios: [...] }.");
      setFase("idle"); return;
    }
    await gravar(json.exercicios);
  }

  async function sincronizarColado() {
    setErro(""); setAviso(""); setIgnor([]);
    let json;
    try { json = JSON.parse(colado); }
    catch (e) { setErro("JSON inválido: " + e.message); return; }
    const arr = Array.isArray(json) ? json : json.exercicios;
    if (!Array.isArray(arr)) { setErro("Não achei a lista de exercícios no JSON colado."); return; }
    await gravar(arr);
  }

  const stats = (linhas || []).reduce((a, l) => {
    const n = (l.grupos || []).length;
    if (n === 0) a.sem++; else if (n === 1) a.mig++; else a.pend++;
    return a;
  }, { mig: 0, pend: 0, sem: 0 });

  const problemas = (linhas || [])
    .filter(l => (l.grupos || []).length !== 1)
    .sort((a, b) => (b.grupos || []).length - (a.grupos || []).length);

  function copiarPendencias() {
    const txt = problemas
      .map(l => l.id + "\t" + l.exercicio + "\t" + ((l.grupos || []).join(" | ") || "(sem grupo)"))
      .join("\n");
    navigator.clipboard.writeText(txt);
    setAviso("Lista de pendências copiada.");
  }

  const ultimo = (linhas || []).reduce((max, l) =>
    l.sincronizado_em && l.sincronizado_em > max ? l.sincronizado_em : max, "");

  return (
    <div>
      <div className="box">
        <h2>Sincronizar Catálogo de Exercícios</h2>
        <p>
          Puxa a lista do Catálogo (Apps Script) e grava no Supabase. O Catálogo continua
          sendo a fonte de verdade — isso aqui é um espelho consultável, seguro de rodar
          quantas vezes você quiser.
        </p>
        {erro && <div className="err">{erro}</div>}
        {aviso && <div className="ok-msg">{aviso}</div>}
        <div className="acoes">
          <button onClick={sincronizar} disabled={fase !== "idle"}>
            {fase === "buscando" ? "Buscando..." : fase === "gravando" ? "Gravando..." : "Sincronizar agora"}
          </button>
          {linhas !== null && (
            <span className="status">
              {linhas.length
                ? linhas.length + " no espelho" + (ultimo ? " · último sync " + new Date(ultimo).toLocaleString("pt-BR") : "")
                : "espelho vazio"}
            </span>
          )}
        </div>
        {fase === "gravando" && (
          <>
            <div className="barra"><i style={{ width: Math.round(prog * 100) + "%" }} /></div>
            <div className="status">{Math.round(prog * 100)}%</div>
          </>
        )}
        {manual && (
          <div style={{ marginTop: 18 }}>
            <p style={{ marginBottom: 8 }}>
              <b>Plano B:</b> abre a URL do Catálogo numa aba, copia todo o JSON e cola aqui.
            </p>
            <textarea value={colado} onChange={e => setColado(e.target.value)}
              placeholder='{"ok":true,"exercicios":[...]}' />
            <div className="acoes" style={{ marginTop: 10 }}>
              <button className="btn-sec" onClick={sincronizarColado} disabled={!colado.trim()}>
                Sincronizar do texto colado
              </button>
            </div>
          </div>
        )}
      </div>

      {ignorados.length > 0 && (
        <div className="box">
          <h2>Ignorados no último sync ({ignorados.length})</h2>
          <p>Linhas que não entraram no espelho. Corrige no Catálogo e sincroniza de novo.</p>
          <div className="lista">
            {ignorados.map((i, k) => (
              <div className="item" key={k}>
                <span className="eid">{String(i.id ?? "—")}</span>
                <span className="enm">{i.nome}</span>
                <span className="etg vazio">{i.motivo}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {linhas !== null && linhas.length > 0 && (
        <>
          <div className="cards">
            <div className="kpi g"><b>{stats.mig}</b><span>1 grupo · ok</span></div>
            <div className="kpi w"><b>{stats.pend}</b><span>2+ grupos · migrar</span></div>
            <div className="kpi r"><b>{stats.sem}</b><span>sem grupo</span></div>
          </div>

          {problemas.length > 0 && (
            <div className="box">
              <h2>Pendências de reestruturação ({problemas.length})</h2>
              <p>
                Exercícios que ainda não têm exatamente um grupo muscular. Enquanto estiverem
                aqui, ficam fora do cálculo de volume — o número nunca infla.
              </p>
              <div className="acoes" style={{ marginBottom: 14 }}>
                <button className="btn-sec" onClick={copiarPendencias}>Copiar lista</button>
              </div>
              <div className="lista">
                {problemas.map(l => (
                  <div className="item" key={l.id}>
                    <span className="eid">{l.id}</span>
                    <span className="enm">{l.exercicio}</span>
                    <span className={"etg" + ((l.grupos || []).length ? "" : " vazio")}>
                      {(l.grupos || []).join(" · ") || "sem grupo"}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ---------- Volume ---------- */
const MOTIVOS = {
  sem_link:          "sem link no catálogo",
  link_quebrado:     "link quebrado",
  catalogo_pendente: "catálogo com 2+ grupos",
  grupo_nao_mapeado: "grupo não mapeado",
  grupo_generico:    "grupo genérico",
  sem_series:        "sem nº de séries"
};

/* monta a matriz linha x treino a partir das linhas da view */
function montarTabela(dados) {
  const treinos = [...new Map(
    dados.map(d => [d.treino, d.treino_ordem])
  ).entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);

  const mapa = new Map();
  for (const d of dados) {
    if (!mapa.has(d.linha)) {
      mapa.set(d.linha, {
        linha: d.linha, tipo: d.tipo, ordem: d.linha_ordem,
        cels: {}, total: 0
      });
    }
    const r = mapa.get(d.linha);
    r.cels[d.treino] = (r.cels[d.treino] || 0) + d.series;
    r.total += d.series;
  }

  const ordenar = (a, b) =>
    a.ordem - b.ordem || a.linha.localeCompare(b.linha, "pt-BR");
  const musc = [...mapa.values()].filter(r => r.tipo === "muscular").sort(ordenar);
  const comp = [...mapa.values()].filter(r => r.tipo === "complementar").sort(ordenar);

  const somar = arr => {
    const t = { cels: {}, total: 0 };
    for (const r of arr) {
      for (const k of treinos) t.cels[k] = (t.cels[k] || 0) + (r.cels[k] || 0);
      t.total += r.total;
    }
    return t;
  };

  return { treinos, musc, comp, totMusc: somar(musc), totComp: somar(comp) };
}

/* desenha a tabela num canvas e devolve o canvas (para PNG) */
function desenharCanvas(tb, nomeAluno) {
  const S = 2;                              // escala p/ nitidez
  const colL = 210, colW = 78, padX = 24, padY = 20;
  const rowH = 26, headH = 34, tituloH = 44;
  const nCols = tb.treinos.length + 1;
  const W = padX * 2 + colL + colW * nCols;
  const nRows = tb.musc.length + (tb.comp.length ? tb.comp.length + 1 : 0);
  const H = padY * 2 + tituloH + headH + rowH * nRows +
            (tb.musc.length ? rowH + 8 : 0) + (tb.comp.length ? rowH + 8 : 0);

  const cv = document.createElement("canvas");
  cv.width = W * S; cv.height = H * S;
  const x = cv.getContext("2d");
  x.scale(S, S);
  const F = "600 13px Sora, system-ui, sans-serif";

  x.fillStyle = "#0e1116"; x.fillRect(0, 0, W, H);

  let y = padY + 20;
  x.fillStyle = "#7fd858"; x.font = "700 16px Sora, system-ui, sans-serif";
  x.textAlign = "left";
  x.fillText("Séries por ciclo · " + nomeAluno, padX, y);
  y += 26;

  const cx = i => padX + colL + colW * i + colW / 2;

  // cabeçalho
  x.font = "600 11px Sora, system-ui, sans-serif"; x.fillStyle = "#7fd858";
  x.textAlign = "center";
  tb.treinos.forEach((t, i) => x.fillText(t.toUpperCase(), cx(i), y + 14));
  x.fillText("TOTAL", cx(tb.treinos.length), y + 14);
  y += headH;
  x.strokeStyle = "#232a33"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(padX, y - 8); x.lineTo(W - padX, y - 8); x.stroke();

  const linha = (r, bold) => {
    x.textAlign = "left";
    x.font = (bold ? "700 " : "500 ") + "13px Sora, system-ui, sans-serif";
    x.fillStyle = bold ? "#7fd858" : "#e6edf3";
    x.fillText(r.linha, padX, y + 17);
    x.textAlign = "center";
    tb.treinos.forEach((t, i) => {
      const v = r.cels[t] || 0;
      x.fillStyle = v ? (bold ? "#7fd858" : "#e6edf3") : "#3d454f";
      x.font = (bold ? "700 " : "500 ") + "13px Sora, system-ui, sans-serif";
      x.fillText(String(v), cx(i), y + 17);
    });
    x.fillStyle = "#7fd858"; x.font = "700 13px Sora, system-ui, sans-serif";
    x.fillText(String(r.total), cx(tb.treinos.length), y + 17);
    y += rowH;
    x.strokeStyle = "#1b212a";
    x.beginPath(); x.moveTo(padX, y); x.lineTo(W - padX, y); x.stroke();
  };

  tb.musc.forEach(r => linha(r, false));
  if (tb.musc.length) {
    x.strokeStyle = "#232a33"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(padX, y + 1); x.lineTo(W - padX, y + 1); x.stroke();
    y += 8; linha({ linha: "TOTAL MUSCULAÇÃO", ...tb.totMusc }, true);
  }
  if (tb.comp.length) {
    y += 8;
    x.textAlign = "left"; x.fillStyle = "#8b949e";
    x.font = "600 10px Sora, system-ui, sans-serif";
    x.fillText("COMPLEMENTAR · FORA DO TOTAL", padX, y + 14);
    y += rowH;
    tb.comp.forEach(r => linha(r, false));
    linha({ linha: "TOTAL COMPLEMENTAR", ...tb.totComp }, true);
  }
  return cv;
}

/* HTML da janela espelho */
function htmlEspelho(tb, nome) {
  const cel = (r, t) => {
    const v = r.cels[t] || 0;
    return '<td class="' + (v ? "" : "z") + '">' + v + "</td>";
  };
  const tr = (r, cls) =>
    '<tr class="' + (cls || "") + '"><td class="l">' + r.linha + "</td>" +
    tb.treinos.map(t => cel(r, t)).join("") +
    '<td class="tt">' + r.total + "</td></tr>";

  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">' +
    "<title>Volume · " + nome + "</title><style>" +
    "body{margin:0;padding:18px;background:#0e1116;color:#e6edf3;" +
    "font-family:Sora,system-ui,sans-serif}" +
    "h1{font-size:14px;color:#7fd858;margin:0 0 12px;font-weight:700}" +
    "table{width:100%;border-collapse:collapse;font-size:13px}" +
    "th,td{padding:6px 10px;border-bottom:1px solid #1b212a;text-align:center}" +
    "th{color:#7fd858;font-size:10px;text-transform:uppercase;letter-spacing:.7px}" +
    "th.l,td.l{text-align:left;font-weight:500}" +
    "td.z{color:#3d454f}td.tt{color:#7fd858;font-weight:700}" +
    "tr.tot td{border-top:2px solid #232a33;font-weight:700;color:#7fd858}" +
    "tr.sec td{color:#8b949e;font-size:9px;text-transform:uppercase;" +
    "letter-spacing:.8px;text-align:left;padding-top:14px}" +
    "</style></head><body>" +
    "<h1>Séries por ciclo · " + nome + "</h1><table><tr><th class='l'></th>" +
    tb.treinos.map(t => "<th>" + t + "</th>").join("") + "<th>Total</th></tr>" +
    tb.musc.map(r => tr(r)).join("") +
    (tb.musc.length ? tr({ linha: "Total musculação", ...tb.totMusc }, "tot") : "") +
    (tb.comp.length
      ? "<tr class='sec'><td colspan='" + (tb.treinos.length + 2) +
        "'>Complementar · fora do total</td></tr>" +
        tb.comp.map(r => tr(r)).join("") +
        tr({ linha: "Total complementar", ...tb.totComp }, "tot")
      : "") +
    "</table></body></html>";
}

function PainelVolume() {
  const [alunos, setAlunos] = useState([]);
  const [sel, setSel]       = useState("");
  const [dados, setDados]   = useState(null);
  const [pend, setPend]     = useState([]);
  const [erro, setErro]     = useState("");
  const [aviso, setAviso]   = useState("");
  const janela = React.useRef(null);

  useEffect(() => {
    sb.from("alunos").select("id, nome").order("nome").then(({ data, error }) => {
      if (error) { setErro(error.message); return; }
      setAlunos(data || []);
      if (data && data.length) setSel(data[0].id);
    });
  }, []);

  const carregar = useCallback(async (alunoId) => {
    if (!alunoId) return;
    setDados(null); setErro("");
    const [v, p] = await Promise.all([
      sb.from("vw_volume_ciclo").select("*").eq("aluno_id", alunoId),
      sb.from("vw_volume_pendencias").select("*").eq("aluno_id", alunoId)
    ]);
    if (v.error) { setErro(v.error.message); setDados([]); return; }
    if (p.error) setErro(p.error.message);
    setDados(v.data || []);
    setPend(p.data || []);
  }, []);

  useEffect(() => { carregar(sel); }, [sel, carregar]);

  const tb = dados && dados.length ? montarTabela(dados) : null;
  const nomeAluno = (alunos.find(a => a.id === sel) || {}).nome || "aluno";

  // atualiza a janela espelho sempre que os dados mudarem
  useEffect(() => {
    const j = janela.current;
    if (!j || j.closed || !tb) return;
    j.document.open();
    j.document.write(htmlEspelho(tb, nomeAluno));
    j.document.close();
  }, [dados, sel]);

  function abrirEspelho() {
    if (!tb) return;
    const j = window.open("", "volume_idealis", "width=560,height=760");
    if (!j) { setErro("O navegador bloqueou a janela. Libera pop-up para este site."); return; }
    janela.current = j;
    j.document.open(); j.document.write(htmlEspelho(tb, nomeAluno)); j.document.close();
    j.focus();
  }

  function baixarPng() {
    if (!tb) return;
    const cv = desenharCanvas(tb, nomeAluno);
    const slug = nomeAluno.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase();
    const a = document.createElement("a");
    a.download = "volume_" + slug + "_" + new Date().toISOString().slice(0, 10) + ".png";
    a.href = cv.toDataURL("image/png");
    a.click();
    setAviso("PNG baixado.");
  }

  const cel = (r, t) => {
    const v = r.cels[t] || 0;
    return <td key={t} className={v ? "" : "z"}>{v}</td>;
  };
  const tr = (r, k, cls) => (
    <tr key={k} className={cls || ""}>
      <td className="l">{r.linha}</td>
      {tb.treinos.map(t => cel(r, t))}
      <td className="tt">{r.total}</td>
    </tr>
  );

  return (
    <div>
      <div className="acoes" style={{ marginBottom: 20 }}>
        <select value={sel} onChange={e => setSel(e.target.value)}>
          {alunos.length === 0 && <option value="">nenhum aluno</option>}
          {alunos.map(a => <option key={a.id} value={a.id}>{a.nome}</option>)}
        </select>
        <button className="btn-sec" onClick={() => carregar(sel)}>Recarregar</button>
      </div>

      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}

      {dados === null
        ? <div className="msg">Calculando...</div>
        : !tb
          ? <div className="msg">
              Nenhum exercício calculável para este aluno ainda.
              {pend.length > 0 && " " + pend.length + " prescrição(ões) em pendência, veja abaixo."}
            </div>
          : (
            <div className="box">
              <div style={{ display: "flex", justifyContent: "space-between",
                            alignItems: "center", marginBottom: 16 }}>
                <div>
                  <h2>Volume prescrito · séries por ciclo</h2>
                  <p style={{ margin: 0 }}>
                    Uma passada completa em {tb.treinos.join(" + ")}.
                  </p>
                </div>
                <div className="acoes">
                  <button className="btn-sec" onClick={abrirEspelho}>Janela separada</button>
                  <button className="btn-sec" onClick={baixarPng}>Baixar PNG</button>
                </div>
              </div>

              <table className="vol">
                <thead>
                  <tr>
                    <th className="l"></th>
                    {tb.treinos.map(t => <th key={t}>{t}</th>)}
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
                  {tb.musc.map((r, i) => tr(r, "m" + i))}
                  {tb.musc.length > 0 && tr({ linha: "Total musculação", ...tb.totMusc }, "tm", "tot")}
                  {tb.comp.length > 0 && (
                    <tr className="sec" key="sec">
                      <td colSpan={tb.treinos.length + 2}>Complementar · fora do total</td>
                    </tr>
                  )}
                  {tb.comp.map((r, i) => tr(r, "c" + i))}
                  {tb.comp.length > 0 && tr({ linha: "Total complementar", ...tb.totComp }, "tc", "tot")}
                </tbody>
              </table>
            </div>
          )}

      {pend.length > 0 && (
        <div className="box">
          <h2>Fora do cálculo ({pend.length})</h2>
          <p>
            Exercícios prescritos que ainda não entram no volume. Enquanto estiverem aqui,
            o número acima está subestimado — nunca inflado.
          </p>
          <div className="lista">
            {pend.map(p => (
              <div className="item" key={p.exercicio_id}>
                <span className="eid">{p.treino}</span>
                <span className="enm">{p.exercicio}</span>
                <span className="etg">
                  <span className="pend-tag">{MOTIVOS[p.situacao] || p.situacao}</span>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="futuro">
        <b>⏳ Volume Realizado — próximo</b>
        Vai comparar séries prescritas × séries efetivamente registradas em <code>logs</code>,
        por grupo, por ciclo. Não exige mudança de schema. Aguardando: histórico de logs
        com pelo menos 4 semanas.
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [sessao, setSessao] = useState(undefined);
  const [aba, setAba] = useState("alunos");

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSessao(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSessao(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (sessao === undefined) return <div className="msg">Carregando...</div>;
  if (!sessao) return <Login />;

  return (
    <div>
      <div className="top">
        <h1>Idealis</h1>
        <button className="sair" onClick={() => sb.auth.signOut()}>Sair</button>
      </div>
      <div className="tabs">
        <button className={"tab" + (aba === "alunos" ? " on" : "")}
          onClick={() => setAba("alunos")}>Alunos</button>
        <button className={"tab" + (aba === "volume" ? " on" : "")}
          onClick={() => setAba("volume")}>Volume</button>
        <button className={"tab" + (aba === "catalogo" ? " on" : "")}
          onClick={() => setAba("catalogo")}>Catálogo</button>
      </div>
      {aba === "alunos" ? <PainelAlunos />
        : aba === "volume" ? <PainelVolume />
        : <PainelCatalogo />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
