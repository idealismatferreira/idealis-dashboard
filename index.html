              {busy && (
                <>
                  <div className="barra"><i style={{ width: Math.round(prog * 100) + "%" }} /></div>
                  <div className="status">{Math.round(prog * 100)}%</div>
                </>
              )}
              <div className="acoes" style={{ marginTop: 18 }}>
                <button onClick={gravar} disabled={busy || !marcados}>
                  {busy ? "Gravando..." : "Importar " + marcados + " selecionado(s)"}
                </button>
                <button className="btn-sec" onClick={() => { setLinhas(null); setAviso(""); }}>
                  Voltar
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </>
  );
}

/* ---------- Volume ---------- */
const MOTIVOS = {
  sem_link:          "sem link no catálogo",
  link_quebrado:     "link quebrado",
  catalogo_pendente: "catálogo com 2+ grupos",
  grupo_generico:    "grupo genérico",
  sem_series:        "sem nº de séries",
  ambiguo:           "2+ grupos musculares",
  sem_grupo:         "sem grupo",
  grupo_nao_mapeado: "grupo fora do mapeamento"
};

/* "Juliana Amorim - Treino A - Quadríceps / Costas" -> "A" */
function rotuloTreino(nome) {
  const n = String(nome || "").trim();
  const m = n.match(/treino\s*([A-Za-z0-9]{1,3})(?![A-Za-z0-9])/i);
  if (m) return m[1].toUpperCase();
  const p = n.split(/\s+[-–]\s+/);
  const ult = p[p.length - 1] || n;
  return ult.length > 14 ? ult.slice(0, 13) + "…" : ult;
}

/* monta a matriz linha x treino a partir das linhas da view */
function montarTabela(dados) {
  const treinos = [...new Map(
    dados.map(d => [d.treino, d.treino_ordem])
  ).entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);

  const mapa = new Map();
  for (const d of dados) {
    if (!mapa.has(d.linha)) {
      mapa.set(d.linha, {
        linha: d.linha, tipo: d.tipo, ordem: d.linha_ordem,
        cels: {}, sec: {}, total: 0, totalSec: 0
      });
    }
    const r = mapa.get(d.linha);
    r.cels[d.treino] = (r.cels[d.treino] || 0) + (d.series || 0);
    r.sec[d.treino]  = (r.sec[d.treino]  || 0) + (d.series_sec || 0);
    r.total    += (d.series || 0);
    r.totalSec += (d.series_sec || 0);
  }

  const ordenar = (a, b) =>
    a.ordem - b.ordem || a.linha.localeCompare(b.linha, "pt-BR");
  const musc = [...mapa.values()].filter(r => r.tipo === "muscular").sort(ordenar);
  const comp = [...mapa.values()].filter(r => r.tipo === "complementar").sort(ordenar);
  const indef = [...mapa.values()].filter(r => r.tipo === "indefinido").sort(ordenar);

  const somar = arr => {
    const t = { cels: {}, sec: {}, total: 0, totalSec: 0 };
    for (const r of arr) {
      for (const k of treinos) {
        t.cels[k] = (t.cels[k] || 0) + (r.cels[k] || 0);
        t.sec[k]  = (t.sec[k]  || 0) + (r.sec[k]  || 0);
      }
      t.total    += r.total;
      t.totalSec += r.totalSec;
    }
    return t;
  };

  const rot = {};
  const usados = {};
  for (const t of treinos) {
    let r = rotuloTreino(t);
    if (usados[r]) { usados[r]++; r = r + "·" + usados[r]; } else usados[r] = 1;
    rot[t] = r;
  }

  return { treinos, rot, musc, comp, indef, totMusc: somar(musc),
           totComp: somar(comp), totIndef: somar(indef) };
}

/* "6+7*" quando há volume secundário; "6" quando não há */
function fmtCel(direto, sec) {
  const d = direto || 0, x = sec || 0;
  return x > 0 ? { d: String(d), s: "+" + x + "*" } : { d: String(d), s: "" };
}

/* desenha a tabela num canvas e devolve o canvas (para PNG) */
function desenharCanvas(tb, nomeAluno) {
  const S = 2;                              // escala p/ nitidez
  const colL = 210, colW = 78, padX = 24, padY = 20;
  const rowH = 26, headH = 34, tituloH = 44;
  const nCols = tb.treinos.length + 1;
  const W = padX * 2 + colL + colW * nCols;
  const nRows = tb.musc.length
    + (tb.comp.length ? tb.comp.length + 2 : 0)
    + (tb.indef.length ? tb.indef.length + 1 : 0);
  const H = padY * 2 + tituloH + headH + rowH * nRows +
            (tb.musc.length ? rowH + 8 : 0) + (tb.comp.length ? 8 : 0) +
            (tb.indef.length ? rowH + 16 : 0) + 26;

  const cv = document.createElement("canvas");
  cv.width = W * S; cv.height = H * S;
  const x = cv.getContext("2d");
  x.scale(S, S);
  const F = "600 13px Sora, system-ui, sans-serif";

  x.fillStyle = "#0b0f10"; x.fillRect(0, 0, W, H);

  let y = padY + 20;
  x.fillStyle = "#00daef"; x.font = "700 16px Sora, system-ui, sans-serif";
  x.textAlign = "left";
  x.fillText("Séries por ciclo · " + nomeAluno, padX, y);
  y += 26;

  const cx = i => padX + colL + colW * i + colW / 2;

  // cabeçalho
  x.font = "600 11px Sora, system-ui, sans-serif"; x.fillStyle = "#00daef";
  x.textAlign = "center";
  tb.treinos.forEach((t, i) => x.fillText(tb.rot[t], cx(i), y + 14));
  x.fillText("TOTAL", cx(tb.treinos.length), y + 14);
  y += headH;
  x.strokeStyle = "#1f2b2d"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(padX, y - 8); x.lineTo(W - padX, y - 8); x.stroke();

  const linha = (r, bold) => {
    x.textAlign = "left";
    x.font = (bold ? "700 " : "500 ") + "13px Sora, system-ui, sans-serif";
    x.fillStyle = bold ? "#00daef" : "#e6edf3";
    x.fillText(r.linha, padX, y + 17);
    x.textAlign = "center";
    const par = (dv, sv, px) => {
      const f = fmtCel(dv, sv);
      x.font = (bold ? "700 " : "500 ") + "13px Sora, system-ui, sans-serif";
      const wd = x.measureText(f.d).width;
      x.font = "500 10px Sora, system-ui, sans-serif";
      const ws = f.s ? x.measureText(f.s).width : 0;
      let cur = px - (wd + ws) / 2;
      x.textAlign = "left";
      x.font = (bold ? "700 " : "500 ") + "13px Sora, system-ui, sans-serif";
      x.fillStyle = (dv || 0) ? (bold ? "#00daef" : "#e6edf3") : "#33454a";
      x.fillText(f.d, cur, y + 17);
      if (f.s) {
        cur += wd;
        x.font = "500 10px Sora, system-ui, sans-serif";
        x.fillStyle = "#f0a35e";
        x.fillText(f.s, cur, y + 17);
      }
      x.textAlign = "center";
    };
    tb.treinos.forEach((t, i) => par(r.cels[t], r.sec[t], cx(i)));
    x.fillStyle = "#00daef";
    par(r.total, r.totalSec, cx(tb.treinos.length));
    y += rowH;
    x.strokeStyle = "#182224";
    x.beginPath(); x.moveTo(padX, y); x.lineTo(W - padX, y); x.stroke();
  };

  tb.musc.forEach(r => linha(r, false));
  if (tb.musc.length) {
    x.strokeStyle = "#1f2b2d"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(padX, y + 1); x.lineTo(W - padX, y + 1); x.stroke();
    y += 8; linha({ linha: "TOTAL MUSCULAÇÃO", ...tb.totMusc }, true);
  }
  if (tb.comp.length) {
    y += 8;
    x.textAlign = "left"; x.fillStyle = "#89a0a3";
    x.font = "600 10px Sora, system-ui, sans-serif";
    x.fillText("COMPLEMENTAR · FORA DO TOTAL", padX, y + 14);
    y += rowH;
    tb.comp.forEach(r => linha(r, false));
    linha({ linha: "TOTAL COMPLEMENTAR", ...tb.totComp }, true);
  }
  const temSec = [...tb.musc, ...tb.comp].some(r => r.totalSec > 0);
  if (temSec) {
    y += 6;
    x.textAlign = "left"; x.fillStyle = "#f0a35e";
    x.font = "500 10px Sora, system-ui, sans-serif";
    x.fillText("* recruta o grupo sem ser motor primario - fora do total", padX, y + 14);
    y += 20;
  }
  if (tb.indef.length) {
    y += 8;
    x.textAlign = "left"; x.fillStyle = "#f0a35e";
    x.font = "600 10px Sora, system-ui, sans-serif";
    x.fillText("SEM ATRIBUICAO · AJUSTAR CATALOGO", padX, y + 14);
    y += rowH;
    tb.indef.forEach(r => linha(r, false));
  }
  return cv;
}

/* HTML da janela espelho */
function htmlEspelho(tb, nome) {
  const cel = (r, t) => {
    const f = fmtCel(r.cels[t], r.sec[t]);
    return '<td class="' + ((r.cels[t] || 0) ? "" : "z") + '">' + f.d +
      (f.s ? '<i class="sc">' + f.s + "</i>" : "") + "</td>";
  };
  const tr = (r, cls) => {
    const ft = fmtCel(r.total, r.totalSec);
    return '<tr class="' + (cls || "") + '"><td class="l">' + r.linha + "</td>" +
      tb.treinos.map(t => cel(r, t)).join("") +
      '<td class="tt">' + ft.d + (ft.s ? '<i class="sc">' + ft.s + "</i>" : "") +
      "</td></tr>";
  };

  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">' +
    "<title>Volume · " + nome + "</title><style>" +
    "body{margin:0;padding:18px;background:#0b0f10;color:#e6edf3;" +
    "font-family:Sora,system-ui,sans-serif}" +
    "h1{font-size:14px;color:#00daef;margin:0 0 12px;font-weight:700}" +
    "table{width:100%;border-collapse:collapse;font-size:13px}" +
    "th,td{padding:6px 10px;border-bottom:1px solid #182224;text-align:center}" +
    "th{color:#00daef;font-size:10px;text-transform:uppercase;letter-spacing:.7px}" +
    "th.l,td.l{text-align:left;font-weight:500}" +
    "td.z{color:#33454a}td.tt{color:#00daef;font-weight:700}" +
    "tr.tot td{border-top:2px solid #1f2b2d;font-weight:700;color:#00daef}" +
    "tr.sec td{color:#89a0a3;font-size:9px;text-transform:uppercase;" +
    "letter-spacing:.8px;text-align:left;padding-top:14px}" +
    "tr.sec.al td{color:#f0a35e}" +
    ".leg{margin-top:14px;font-size:10px;color:#89a0a3;line-height:1.7}" +
    ".leg b{color:#00daef}" +
    "i.sc{font-style:normal;font-size:9px;color:#f0a35e;margin-left:1px}" +
    "</style></head><body>" +
    "<h1>Séries por ciclo · " + nome + "</h1><table><tr><th class='l'></th>" +
    tb.treinos.map(t => "<th>" + tb.rot[t] + "</th>").join("") + "<th>Total</th></tr>" +
    tb.musc.map(r => tr(r)).join("") +
    (tb.musc.length ? tr({ linha: "Total musculação", ...tb.totMusc }, "tot") : "") +
    (tb.comp.length
      ? "<tr class='sec'><td colspan='" + (tb.treinos.length + 2) +
        "'>Complementar · fora do total</td></tr>" +
        tb.comp.map(r => tr(r)).join("") +
        tr({ linha: "Total complementar", ...tb.totComp }, "tot")
      : "") +
    (tb.indef.length
      ? "<tr class='sec al'><td colspan='" + (tb.treinos.length + 2) +
        "'>Sem atribuição · ajustar catálogo</td></tr>" +
        tb.indef.map(r => tr(r)).join("")
      : "") +
    "</table><div class='leg'>" +
    tb.treinos.map(t => "<div><b>" + tb.rot[t] + "</b> " + t + "</div>").join("") +
    "<div style='margin-top:6px'>* série que também recruta o grupo, sem ser o motor primário. Não entra no total.</div>" +
    "</div></body></html>";
}

function PainelVolume() {
  const { alunoId: sel, alunos } = usarAluno();
  const [dados, setDados]   = useState(null);
  const [pend, setPend]     = useState([]);
  const [diverg, setDiverg] = useState([]);
  const [erro, setErro]     = useState("");
  const [aviso, setAviso]   = useState("");
  const janela = React.useRef(null);

  const carregar = useCallback(async (alunoId) => {
    if (!alunoId) { setDados(null); return; }
    setDados(null); setErro("");
    const [v, p, dv] = await Promise.all([
      sb.from("vw_volume_ciclo").select("*").eq("aluno_id", alunoId),
      sb.from("vw_volume_pendencias").select("*").eq("aluno_id", alunoId),
      sb.from("vw_series_divergentes").select("*").eq("aluno_id", alunoId)
    ]);
    if (v.error) { setErro(v.error.message); setDados([]); return; }
    if (p.error) setErro(p.error.message);
    setDados(v.data || []);
    setPend(p.data || []);
    setDiverg(dv.error ? [] : (dv.data || []));
  }, []);

  useEffect(() => { carregar(sel); }, [sel, carregar]);

  const tb = dados && dados.length ? montarTabela(dados) : null;
  const nomeAluno = (alunos.find(a => a.id === sel) || {}).nome || "aluno";

  // atualiza a janela espelho sempre que os dados mudarem
  useEffect(() => {
    const j = janela.current;
    if (!j || j.closed || !tb) return;
    j.document.open();
    j.document.write(htmlEspelho(tb, nomeAluno));
    j.document.close();
  }, [dados, sel]);

  function abrirEspelho() {
    if (!tb) return;
    const j = window.open("", "volume_idealis", "width=560,height=760");
    if (!j) { setErro("O navegador bloqueou a janela. Libera pop-up para este site."); return; }
    janela.current = j;
    j.document.open(); j.document.write(htmlEspelho(tb, nomeAluno)); j.document.close();
    j.focus();
  }

  function baixarPng() {
    if (!tb) return;
    const cv = desenharCanvas(tb, nomeAluno);
    const slug = nomeAluno.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase();
    const a = document.createElement("a");
    a.download = "volume_" + slug + "_" + new Date().toISOString().slice(0, 10) + ".png";
    a.href = cv.toDataURL("image/png");
    a.click();
    setAviso("PNG baixado.");
  }

  const cel = (r, t) => {
    const f = fmtCel(r.cels[t], r.sec[t]);
    return (
      <td key={t} className={(r.cels[t] || 0) ? "" : "z"}>
        {f.d}{f.s && <span className="sc">{f.s}</span>}
      </td>
    );
  };
  const tr = (r, k, cls) => {
    const ft = fmtCel(r.total, r.totalSec);
    return (
      <tr key={k} className={cls || ""}>
        <td className="l">{r.linha}</td>
        {tb.treinos.map(t => cel(r, t))}
        <td className="tt">{ft.d}{ft.s && <span className="sc">{ft.s}</span>}</td>
      </tr>
    );
  };

  return (
    <div>
      <div className="acoes" style={{ marginBottom: 20 }}>

        <button className="btn-sec" onClick={() => carregar(sel)}>Recarregar</button>
      </div>

      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}

      {!sel ? (
        <div className="sem-aluno">
          <b>Escolhe um aluno lá em cima</b>
          O volume prescrito aparece aqui.
        </div>
      ) : dados === null
        ? <div className="msg">Calculando...</div>
        : !tb
          ? <div className="msg">
              Nenhum exercício calculável para este aluno ainda.
              {pend.length > 0 && " " + pend.length + " prescrição(ões) em pendência, veja abaixo."}
            </div>
          : (
            <div className="box">
              <div style={{ display: "flex", justifyContent: "space-between",
                            alignItems: "center", marginBottom: 16 }}>
                <div>
                  <h2>Volume prescrito · séries por ciclo</h2>
                  <p style={{ margin: 0 }}>
                    Uma passada completa em {tb.treinos.map(t => tb.rot[t]).join(" + ")}.
                  </p>
                </div>
                <div className="acoes">
                  <button className="btn-sec" onClick={abrirEspelho}>Janela separada</button>
                  <button className="btn-sec" onClick={baixarPng}>Baixar PNG</button>
                </div>
              </div>

              <div className="vol-wrap">
              <table className="vol">
                <thead>
                  <tr>
                    <th className="l"></th>
                    {tb.treinos.map(t => <th key={t}>{tb.rot[t]}</th>)}
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
                  {tb.musc.map((r, i) => tr(r, "m" + i))}
                  {tb.musc.length > 0 && tr({ linha: "Total musculação", ...tb.totMusc }, "tm", "tot")}
                  {tb.comp.length > 0 && (
                    <tr className="sec" key="sec">
                      <td colSpan={tb.treinos.length + 2}>Complementar · fora do total</td>
                    </tr>
                  )}
                  {tb.comp.map((r, i) => tr(r, "c" + i))}
                  {tb.comp.length > 0 && tr({ linha: "Total complementar", ...tb.totComp }, "tc", "tot")}
                  {tb.indef.length > 0 && (
                    <tr className="sec al" key="seci">
                      <td colSpan={tb.treinos.length + 2}>Sem atribuição · ajustar catálogo</td>
                    </tr>
                  )}
                  {tb.indef.map((r, i) => tr(r, "i" + i))}
                </tbody>
              </table>
              </div>
              <div style={{ marginTop: 14, fontSize: 11, color: "var(--mut)", lineHeight: 1.8 }}>
                <div style={{ marginBottom: 8 }}>
                  <span className="sc" style={{ fontSize: 11 }}>*</span> série que
                  também recruta o grupo sem ser o motor primário — não entra no total.
                </div>
                {tb.treinos.map(t => (
                  <div key={t}>
                    <b style={{ color: "var(--accent)" }}>{tb.rot[t]}</b> · {t}
                  </div>
                ))}
              </div>
            </div>
          )}

      {diverg.length > 0 && (
        <div className="box">
          <h2>Séries divergentes ({diverg.length})</h2>
          <p>
            O campo <code>series</code> não concorda com o que o método calcula.
            O volume usa o método. Vale corrigir o texto no app para não confundir depois.
          </p>
          <div className="lista">
            {diverg.map(d => (
              <div className="item" key={d.exercicio + d.treino}>
                <span className="eid">{tb ? (tb.rot[d.treino] || d.treino) : d.treino}</span>
                <span className="enm">{d.exercicio}
                  <span style={{ color: "var(--mut)", fontWeight: 400 }}> · {d.metodo}</span>
                </span>
                <span className="etg">
                  campo diz {d.no_campo_series} · método diz <b>{d.pelo_metodo}</b>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {pend.length > 0 && (
        <div className="box">
          <h2>Fora do cálculo ({pend.length})</h2>
          <p>
            Exercícios prescritos que ainda não entram no volume. Enquanto estiverem aqui,
            o número acima está subestimado — nunca inflado.

/* Cria a FICHA. O login (Auth) é passo separado — ver aviso na tela. */
function ModalNovoAluno({ onFechar, onCriado }) {
  const { toast } = usarUI();
  useEsc(true, onFechar);
  const [nome, setNome]   = useState("");
  const [email, setEmail] = useState("");
  const [tel, setTel]     = useState("");
  const [nasc, setNasc]   = useState("");
  const [sexo, setSexo]   = useState("");
  const [modId, setModId] = useState("");
  const [acId, setAcId]   = useState("");
  const [obs, setObs]     = useState("");
  const [texto, setTexto] = useState("");
  const [mods, setMods]   = useState([]);
  const [acs, setAcs]     = useState([]);
  const [erro, setErro]   = useState("");
  const [busy, setBusy]   = useState(false);
  const [dupes, setDupes] = useState([]);

  useEffect(() => {
    Promise.all([
      sb.from("modalidades").select("id, nome").eq("ativa", true).order("ordem"),
      sb.from("academias").select("id, nome").eq("ativa", true).order("nome")
    ]).then(([m, a]) => {
      if (!m.error) setMods(m.data || []);
      if (!a.error) setAcs(a.data || []);
    });
  }, []);

  /* avisa se já existe alguém com nome parecido, antes de duplicar */
  useEffect(() => {
    const t = setTimeout(async () => {
      const n = nome.trim();
      if (n.length < 3) { setDupes([]); return; }
      const { data } = await sb.from("alunos").select("id, nome, status");
      setDupes((data || []).filter(a => cbCasa(a.nome, n)).slice(0, 4));
    }, 350);
    return () => clearTimeout(t);
  }, [nome]);

  const prev = texto.trim() ? textoParaEntradas(texto) : [];
  const validas = prev.filter(e => e.conhecida);

  async function criar() {
    if (!nome.trim()) { setErro("O nome é obrigatório."); return; }
    setBusy(true); setErro("");
    try {
      const ins = await sb.from("alunos").insert({
        nome: nome.trim(), status: "ativo",
        modalidade_id: modId || null,
        email: email.trim() || null,
        telefone: tel.trim() || null,
        nascimento: nasc || null,
        sexo: sexo || null,
        observacao: obs.trim() || null
      }).select("id").single();
      if (ins.error) throw new Error(ins.error.message);
      const alunoId = ins.data.id;

      if (acId) {
        const v = await sb.from("aluno_academias")
          .insert({ aluno_id: alunoId, academia_id: acId, principal: true });
        if (v.error) throw new Error(v.error.message);
      }

      if (validas.length) {
        const linhas = validas.map(e => ({
          aluno_id: alunoId, secao_id: e.secao_id, data: e.data,
          data_texto: e.data_texto, texto: e.texto, escala: e.escala || null,
          ordem: e.ordem, origem: "manual"
        }));
        const en = await sb.from("anamnese_entradas").insert(linhas);
        if (en.error) throw new Error(en.error.message);
      }

      toast(nome.trim() + " criado(a)" +
        (validas.length ? " com " + validas.length + " entrada(s)." : "."));
      onCriado(alunoId);
    } catch (e) { setErro(e.message); }
    setBusy(false);
  }

  return (
    <>
      <div className="drawer-bg" onClick={onFechar} />
      <div className="drawer" style={{ width: "min(700px,96vw)" }}>
        <div className="dr-top">
          <button className="dr-x" onClick={onFechar}>×</button>
          <h2>Novo aluno</h2>
          <div className="meta">Cria a ficha. O login do app é um passo separado.</div>
        </div>
        <div className="dr-body">
          {erro && <div className="err">{erro}</div>}

          <div className="ed-lab">Nome *</div>
          <input value={nome} onChange={e => setNome(e.target.value)}
            placeholder="Nome completo" style={{ marginBottom: 0 }} />
          {dupes.length > 0 && (
            <div className="err" style={{ background: "#2a2418", borderColor: "#5c4a24",
              color: "#f0a35e", marginTop: 8 }}>
              ⚠️ Já existe: {dupes.map(d => d.nome +
                (d.status !== "ativo" ? " (" + d.status + ")" : "")).join(" · ")}.
              Confere se não é a mesma pessoa.
            </div>
          )}

          <div className="nv-grid">
            <div>
              <div className="ed-lab">E-mail</div>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                placeholder="para o login depois" style={{ marginBottom: 0 }} />
            </div>
            <div>
              <div className="ed-lab">Telefone</div>
              <input value={tel} onChange={e => setTel(e.target.value)}
                placeholder="(11) 9..." style={{ marginBottom: 0 }} />
            </div>
            <div>
              <div className="ed-lab">Nascimento</div>
              <input type="date" value={nasc} onChange={e => setNasc(e.target.value)}
                style={{ marginBottom: 0 }} />
            </div>
            <div>
              <div className="ed-lab">Sexo</div>
              <div className="chips">
                {["Feminino", "Masculino"].map(o => (
                  <button key={o} className={"chip mini" + (sexo === o ? " on" : "")}
                    onClick={() => setSexo(sexo === o ? "" : o)}>{o}</button>

          <div className="ed-lab">Formato</div>

            </div>
          )}

          <div className="futuro" style={{ marginTop: 18 }}>

            Isto cria só a ficha. Para o aluno entrar no App Idealis, é preciso criar
            o usuário no Supabase (Authentication → Users) e ligar em <code>perfis</code>.

        </div>
      </div>
    </>
  );

/* ---------- Entradas segmentadas do aluno ---------- */
function PainelEntradas({ aluno }) {
  const { toast, confirmar } = usarUI();
  const [secoes, setSecoes] = useState([]);
  const [tipos, setTipos]   = useState([]);
  const [ents, setEnts]     = useState(null);
  const [cat, setCat]       = useState([]);
  const [erro, setErro]     = useState("");
  const [edit, setEdit]     = useState(null);   // {id?} + campos
  const [verArq, setVerArq] = useState(false);

  const carregar = useCallback(async () => {
    setErro("");
    const [se, ti, en, ca] = await Promise.all([
      sb.from("anamnese_secoes").select("*").eq("ativa", true).order("ordem"),
      sb.from("ocorrencia_tipos").select("*").eq("ativo", true).order("ordem"),
      sb.from("vw_anamnese_entradas").select("*").eq("aluno_id", aluno.id),
      sb.from("cardapio").select("id, exercicio").order("exercicio")
    ]);
    if (se.error || en.error) { setErro((se.error || en.error).message); return; }
    setSecoes(se.data || []); setTipos(ti.error ? [] : (ti.data || []));
    setEnts(en.data || []); setCat(ca.error ? [] : (ca.data || []));
  }, [aluno.id]);

  useEffect(() => { carregar(); }, [carregar]);

  function novaEntrada(secaoId) {
    setEdit({ secao_id: secaoId, data: dISO(new Date()), data_texto: "",
              texto: "", cardapio_id: null, tipo_id: null, regiao: "" });
  }

  async function salvar() {
    if (!edit) return;
    /* em seção de escala o autorrelato JÁ é a informação — texto vazio é válido.
       O mesmo vale quando você só quer registrar o exercício. */
    const temConteudo = edit.texto.trim() || edit.escala || edit.cardapio_id;
    if (!temConteudo) {
      setErro("Preenche pelo menos o texto, o autorrelato ou o exercício.");
      return;
    }
    const corpo = {
      aluno_id: aluno.id, secao_id: edit.secao_id,
      data: edit.data || null,
      data_texto: edit.data ? dBR(edit.data) : (edit.data_texto || null),
      texto: edit.texto.trim(),   /* pode ser vazio quando há escala/exercício */
      cardapio_id: edit.cardapio_id || null,
      tipo_id: edit.tipo_id || null,
      regiao: (edit.regiao || "").trim() || null,
      escala: edit.escala || null
    };
    const r = edit.id
      ? await sb.from("anamnese_entradas")
          .update({ ...corpo, atualizado_em: new Date().toISOString() }).eq("id", edit.id)
      : await sb.from("anamnese_entradas").insert({ ...corpo, origem: "manual" });
    if (r.error) { setErro(r.error.message); return; }
    toast(edit.id ? "Entrada atualizada." : "Entrada adicionada.");
    setEdit(null); await carregar();
  }

  async function arquivar(e, valor) {
    const r = await sb.from("anamnese_entradas")
      .update({ arquivada: valor }).eq("id", e.id);
    if (r.error) { setErro(r.error.message); return; }
    await carregar();
  }

  async function apagar(e) {
    const ok = await confirmar({
      titulo: "Apagar entrada?", texto: e.texto.slice(0, 90),
      alerta: "Não volta. Se for só para tirar da vista, use arquivar.",
      ok: "Apagar", perigo: true
    });
    if (!ok) return;
    const r = await sb.from("anamnese_entradas").delete().eq("id", e.id);
    if (r.error) { setErro(r.error.message); return; }
    toast("Entrada apagada."); await carregar();
  }

  function copiarTudo(meses, modo) {
    const corpo = entradasParaTexto(secoes, ents || [], meses, modo);
    const txt = modo === "planilha" ? corpo
      : "ANAMNESE · " + aluno.nome + (meses ? "  (últimos " + meses + " meses)" : "") +
        "\n" + "─".repeat(46) + "\n" + corpo;
    navigator.clipboard.writeText(txt);
    toast(meses ? "Copiado só o que é dos últimos " + meses + " meses."
                : "Anamnese copiada.");
  }

  const ordenar = arr => [...arr].sort((x, y) => {
    if (!!x.data !== !!y.data) return x.data ? -1 : 1;
    if (x.data && y.data) return x.data < y.data ? 1 : x.data > y.data ? -1 : 0;
    return (x.ordem || 0) - (y.ordem || 0);
  });

  if (ents === null) return <div className="msg">Carregando...</div>;

  if (!ents.length) return (
    <div className="sem-aluno">
      <b>Ainda não migrado</b>
      Este aluno ainda não tem entradas segmentadas.
      Use <b>Migrar anamneses</b> na aba Alunos.
    </div>
  );

  const secEd = edit ? secoes.find(x => x.id === edit.secao_id) : null;

  return (
    <div>
      {erro && <div className="err">{erro}</div>}
      <div className="acoes" style={{ marginBottom: 14 }}>
        <button className="btn-sec ico" title="Copiar anamnese"
          onClick={() => copiarTudo(null)}>
          <IconeCopiar />
        </button>
        <button className="btn-sec" onClick={() => copiarTudo(12)}>
          Copiar 12 meses
        </button>
        <button className="btn-sec" onClick={() => setVerArq(v => !v)}>
          {verArq ? "Ocultar arquivadas" : "Ver arquivadas"}
        </button>
      </div>

      {secoes.map(s => {
        const itens = ordenar((ents || []).filter(e =>
          e.secao_id === s.id && (verArq || !e.arquivada)));
        return (
          <div className={"sec-card" + (s.destaque ? " dor" : "") +
                          (itens.length ? "" : " vazia")} key={s.id}>
            <div className="sec-h">
              <b>{s.nome}</b>
              {itens.length > 1 && <i>{itens.length} entradas</i>}
              <span style={{ flex: 1 }} />
              <button className="sec-lapis" title={"Nova entrada em " + s.nome}
                onClick={() => novaEntrada(s.id)}>+</button>
            </div>
            {itens.length === 0
              ? <div className="vazio-nota">—</div>
              : itens.map(e => (
                <div className={"ent en2" + (e.arquivada ? " arq" : "")} key={e.id}>
                  <span className={"dt" + (e.data ? "" : " sem")}>
                    {e.data_texto || "—"}
                  </span>
                  <span className="tx">
                    {e.texto ? e.texto
                      : <span style={{ color: "var(--mut)", fontStyle: "italic" }}>
                          {e.escala || e.exercicio || "—"}
                        </span>}
                    {(e.exercicio || e.tipo || e.regiao || (e.escala && e.texto)) && (
                      <span className="en-tags">
                        {e.escala && e.texto && <span className="en-tag es">{e.escala}</span>}
                        {e.exercicio && <span className="en-tag ex">{e.exercicio}</span>}
                        {e.tipo && <span className="en-tag"
                          style={{ background: (e.tipo_cor || "#333") + "22",
                                   color: e.tipo_cor || "var(--mut)" }}>{e.tipo}</span>}
                        {e.regiao && <span className="en-tag rg">{e.regiao}</span>}
                      </span>
                    )}
                  </span>
                  <span className="en-ferr">
                    <button onClick={() => setEdit({ ...e })} title="Editar">✎</button>
                    <button onClick={() => arquivar(e, !e.arquivada)}
                      title={e.arquivada ? "Desarquivar" : "Arquivar"}>
                      {e.arquivada ? "↩" : "▾"}
                    </button>
                    <button onClick={() => apagar(e)} title="Apagar">×</button>
                  </span>
                </div>
              ))}
          </div>
        );
      })}

      {edit && secEd && (
        <>
          <div className="drawer-bg" style={{ zIndex: 88 }} onClick={() => setEdit(null)} />
          <div className="conf" style={{ width: "min(520px,94vw)", zIndex: 89 }}>
            <h3>{edit.id ? "Editar entrada" : "Nova entrada"} · {secEd.nome}</h3>

            <div className="ed-lab">Data</div>
            <input type="date" value={edit.data || ""}
              onChange={e => setEdit({ ...edit, data: e.target.value })}
              style={{ marginBottom: 0 }} />
            {!edit.data && (
              <input value={edit.data_texto || ""}
                onChange={e => setEdit({ ...edit, data_texto: e.target.value })}
                placeholder="ou data solta (ex: 15/03)"
                style={{ marginTop: 7, marginBottom: 0 }} />
            )}

            {secEd.usa_exercicio && (
              <>
                <div className="ed-lab">Exercício</div>
                <Combobox
                  opcoes={cat.map(c => ({ value: String(c.id), label: c.exercicio }))}
                  value={edit.cardapio_id ? String(edit.cardapio_id) : ""}
                  onChange={v => setEdit({ ...edit, cardapio_id: v ? Number(v) : null })}

            {secEd.usa_tipo && (
              <>
                <div className="ed-lab">Tipo</div>

                  {tipos.map(t => (
                    <button key={t.id}
                      className={"chip mini" + (edit.tipo_id === t.id ? " on" : "")}

/* ---------- Anamnese segmentada ---------- */
/* Converte o texto da anamnese em entradas, usando o MESMO parser
   já testado. Não inventa parse novo. */
/* autorrelato de escala: reconhece "Boa", "MUITO RUIM" etc. no texto */
const ESCALAS = ["Muito ruim", "Ruim", "Razoável", "Boa", "Excelente"];
function detectarEscala(texto) {
  const t = cbNorm(texto).trim();
  /* do mais longo para o mais curto, senão "Ruim" casaria dentro de "Muito ruim" */
  const ord = [...ESCALAS].sort((a, b) => b.length - a.length);
  for (const e of ord) {
    const n = cbNorm(e);
    if (t === n || new RegExp("(^|[^a-z])" + n + "([^a-z]|$)").test(t)) return e;
  }
  return null;
}

function textoParaEntradas(txt) {
  const out = [];
  for (const sec of parseAnamnese(txt)) {
    if (!sec.entradas.length) continue;
    sec.entradas.forEach((e, i) => {
      const f = fatiarEntrada(e);
      if (!f.texto.trim()) return;
      out.push({
        secao_id: sec.rotulo,
        conhecida: sec.conhecida,
        data: f.ts ? dISO(new Date(f.ts)) : null,
        data_texto: f.data || null,
        texto: f.texto.trim(),
        escala: sec.rotulo === "Coord" ? detectarEscala(f.texto) : null,
        ordem: i
      });
    });
  }
  return out;
}

/* regenera o texto no formato da planilha a partir das entradas.
   Depois de migrar, a fonte de verdade são as entradas — o campo
   `anamneses.texto` vira foto do estado anterior e NÃO acompanha as edições. */
/* Regenera o texto a partir das entradas.
   modo "leitura"  = para colar em bloco de notas (padrão)
   modo "planilha" = formato "- Obj:" da WTAN, para voltar ao Sheets

   Depois de migrar, a fonte de verdade são as entradas — o campo
   `anamneses.texto` vira foto do estado anterior e NÃO acompanha as edições. */
function entradasParaTexto(secoes, entradas, meses, modo) {
  const planilha = modo === "planilha";
  const corte = meses ? Date.now() - meses * 30.44 * 864e5 : null;

  const ordenar = arr => [...arr].sort((x, y) => {
    if (!!x.data !== !!y.data) return x.data ? -1 : 1;
    if (x.data && y.data) return x.data < y.data ? 1 : x.data > y.data ? -1 : 0;
    return (x.ordem || 0) - (y.ordem || 0);
  });

  /* texto só com pontuação não vale nada ao lado da escala:
     "- Coord: . [Boa]" deve virar só "Boa" */
  const trivial = t => !String(t || "").replace(/[\s.,;:\-–—]/g, "").length;

  const linhaDe = e => {
    let corpo = trivial(e.texto) ? "" : String(e.texto).trim();
    const extras = [];
    if (e.escala) extras.push(e.escala);
    /* não repete o exercício se ele já está escrito na frase */
    if (e.exercicio && !cbNorm(corpo).includes(cbNorm(e.exercicio))) {
      extras.push(e.exercicio);
    }
    if (!corpo && extras.length) { corpo = extras.shift(); }
    const suf = extras.length ? " [" + extras.join(" · ") + "]" : "";
    const pref = e.data_texto ? e.data_texto + (planilha ? ": " : "  ·  ") : "";
    return pref + corpo + suf;
  };

  const L = [];
  for (const sec of secoes) {
    let itens = entradas.filter(e => e.secao_id === sec.id && !e.arquivada);
    if (corte) {
      /* sem data não dá para filtrar: mantém, é mais seguro que esconder */
      itens = itens.filter(e => !e.data || parseISO(e.data).getTime() >= corte);
    }
    if (!itens.length) continue;
    if (planilha) {
      L.push("- " + sec.id + ":");
      ordenar(itens).forEach(e => L.push(linhaDe(e)));
    } else {
      if (L.length) L.push("");
      L.push(String(sec.nome).toUpperCase());
      ordenar(itens).forEach(e => L.push(linhaDe(e)));
    }
  }
  return L.join("\n");
}

function PainelMigracao({ onFechar }) {
  const { toast } = usarUI();
  const [lista, setLista]   = useState(null);
  const [sel, setSel]       = useState("");
  const [texto, setTexto]   = useState("");
  const [prev, setPrev]     = useState([]);
  const [erro, setErro]     = useState("");
  const [busy, setBusy]     = useState(false);
  const [busca, setBusca]   = useState("");
  useEsc(true, onFechar);

  const carregar = useCallback(async () => {
    const { data, error } = await sb.from("vw_anamnese_migracao")
      .select("*").order("nome");
    if (error) { setErro(error.message); return; }
    setLista(data || []);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  async function abrir(alunoId) {
    setSel(alunoId); setErro(""); setPrev([]); setTexto("");
    const { data, error } = await sb.from("vw_anamnese_atual")
      .select("texto").eq("aluno_id", alunoId).single();
    if (error) { setErro("Este aluno não tem anamnese em texto."); return; }
    setTexto(data.texto || "");
    setPrev(textoParaEntradas(data.texto || ""));
  }

  async function migrar() {
    if (!sel || !prev.length) return;
    setBusy(true); setErro("");
    const jaTem = (lista.find(l => l.aluno_id === sel) || {}).entradas || 0;
    if (jaTem > 0) {
      const del = await sb.from("anamnese_entradas").delete().eq("aluno_id", sel);
      if (del.error) { setBusy(false); setErro(del.error.message); return; }
    }
    const linhas = prev.filter(e => e.conhecida).map(e => ({
      aluno_id: sel, secao_id: e.secao_id, data: e.data,
      data_texto: e.data_texto, texto: e.texto, escala: e.escala || null,
      ordem: e.ordem, origem: "migrado"
    }));
    const r = await sb.from("anamnese_entradas").insert(linhas);
    setBusy(false);
    if (r.error) { setErro(r.error.message); return; }
    toast(linhas.length + " entrada(s) migrada(s).");
    await carregar();
  }

  const desconhecidas = prev.filter(e => !e.conhecida);
  const validas = prev.filter(e => e.conhecida);
  const semData = validas.filter(e => !e.data).length;

  const porSecao = [];
  for (const e of validas) {
    let g = porSecao.find(x => x.secao === e.secao_id);
    if (!g) { g = { secao: e.secao_id, itens: [] }; porSecao.push(g); }
    g.itens.push(e);
  }

  const visiveis = (lista || []).filter(l =>
    !busca.trim() || cbCasa(l.nome, busca));
  const jaMigrados = (lista || []).filter(l => l.migrado).length;

  return (
    <>
      <div className="drawer-bg" onClick={onFechar} />
      <div className="drawer" style={{ width: "min(980px,97vw)" }}>
        <div className="dr-top">
          <button className="dr-x" onClick={onFechar}>×</button>
          <h2>Migrar anamnese para entradas</h2>
          <div className="meta">
            O texto original continua intacto. Migrar cria as entradas segmentadas.
            {lista && " · " + jaMigrados + " de " + lista.length + " já migrados"}
          </div>
        </div>
        <div className="dr-body">
          {erro && <div className="err">{erro}</div>}

          <div className="mig-cols">
            <div>
              <div style={{ position: "relative", marginBottom: 10 }}>
                <input value={busca} onChange={e => setBusca(e.target.value)}
                  placeholder="Buscar aluno..." style={{ marginBottom: 0 }} />
                {busca && <button className="cb-lim" onClick={() => setBusca("")}>×</button>}
              </div>
              {lista === null ? <div className="msg">Carregando...</div>
               : visiveis.map(l => (
                <div key={l.aluno_id}
                  className={"mig-al" + (sel === l.aluno_id ? " on" : "") +
                    (l.migrado ? " feito" : "")}
                  onClick={() => abrir(l.aluno_id)}>
                  <b>{l.nome}</b>
                  <span>
                    {l.migrado ? "✓ " + l.entradas + " entradas"
                      : l.tem_texto ? l.tamanho_texto + " chars"
                      : "sem anamnese"}
                  </span>
                </div>
              ))}
            </div>

            <div>
              {!sel ? (
                <div className="sem-aluno">
                  <b>Escolhe um aluno à esquerda</b>
                  A prévia da migração aparece aqui.
                </div>
              ) : (
                <>
                  <div className="cards" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
                    <div className="kpi g"><b>{validas.length}</b><span>entradas</span></div>
                    <div className="kpi w"><b>{semData}</b><span>sem data</span></div>
                    <div className="kpi r"><b>{desconhecidas.length}</b>
                      <span>fora do padrão</span></div>
                  </div>

                  {desconhecidas.length > 0 && (
                    <div className="err" style={{ background: "#2a2418",
                      borderColor: "#5c4a24", color: "#f0a35e" }}>
                      ⚠️ {desconhecidas.length} entrada(s) com rótulo fora das 14 seções
                      conhecidas <b>não serão migradas</b>:{" "}
                      {[...new Set(desconhecidas.map(e => e.secao_id))].join(", ")}.
                      O texto original continua com elas.
                    </div>
                  )}

                  {porSecao.map(g => (
                    <div className="mig-sec" key={g.secao}>
                      <div className="mig-sh">
                        {nomeSecao(g.secao)} <i>{g.itens.length}</i>
                      </div>
                      {g.itens.map((e, i) => (
                        <div className="mig-it" key={i}>
                          <span className={"dt" + (e.data ? "" : " sem")}>
                            {e.data_texto || "—"}
                          </span>
                          <span className="tx">
                            {e.texto}
                            {e.escala && <span className="en-tag es"
                              style={{ marginLeft: 7 }}>{e.escala}</span>}
                          </span>
                        </div>
                      ))}
                    </div>
                  ))}

                  <div className="acoes" style={{ marginTop: 18 }}>
                    <button onClick={migrar} disabled={busy || !validas.length}>
                      {busy ? "Migrando..."
                        : ((lista.find(l => l.aluno_id === sel) || {}).migrado
                            ? "Refazer migração" : "Migrar " + validas.length + " entradas")}
                    </button>
                    <span className="status">
                      o texto original não é alterado
                    </span>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

/* ---------- Perguntas bônus ---------- */
/* "09/08/26" — mesmo formato usado nas anamneses */
function hojeCurto() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + p(d.getFullYear() % 100);
}

/* tira o prefixo de data na hora de copiar — o aluno não precisa vê-la */
function semData(t) {
  return String(t || "").replace(/^\s*\d{2}\/\d{2}\/\d{2}\s*:\s*/, "").trim();
}

function PainelPerguntas({ aluno }) {
  const [lista, setLista] = useState(null);
  const [nova, setNova]   = useState("");
  const [erro, setErro]   = useState("");
  const [aviso, setAviso] = useState("");
  const [verUsadas, setVer] = useState(false);

  const carregar = useCallback(async () => {
    const { data, error } = await sb.from("perguntas")
      .select("id, texto, status, criado_em, usada_em")
      .eq("aluno_id", aluno.id)
      .order("criado_em", { ascending: false });
    if (error) { setErro(error.message); setLista([]); return; }
    setLista(data || []);
  }, [aluno.id]);

  useEffect(() => { carregar(); }, [carregar]);

  async function adicionar() {
    const t = nova.trim();
    if (!t) return;
    /* não duplica a data se o texto já vier com uma */
    const jaTem = /^\s*\d{2}\/\d{2}\/\d{2}\s*:/.test(t);
    const texto = jaTem ? t : hojeCurto() + ": " + t;
    const { error } = await sb.from("perguntas")
      .insert({ aluno_id: aluno.id, texto });
    if (error) { setErro(error.message); return; }
    setNova(""); await carregar();
  }

  async function marcar(p, status) {
    const { error } = await sb.from("perguntas")
      .update({ status, usada_em: status === "usada" ? new Date().toISOString() : null })
      .eq("id", p.id);
    if (error) { setErro(error.message); return; }
    await carregar();
  }

  async function remover(p) {
    const { error } = await sb.from("perguntas").delete().eq("id", p.id);
    if (error) { setErro(error.message); return; }
    await carregar();
  }

  const pend = (lista || []).filter(p => p.status === "pendente");
  const resto = (lista || []).filter(p => p.status !== "pendente");

  const [copiado, setCopiado] = useState(null);

  function copiarUma(p) {
    navigator.clipboard.writeText(semData(p.texto));
    setCopiado(p.id);
    setTimeout(() => setCopiado(c => (c === p.id ? null : c)), 1400);
  }

  function copiarPendentes() {
    if (!pend.length) return;
    navigator.clipboard.writeText(pend.map(p => "• " + semData(p.texto)).join("\n"));
    setAviso("Perguntas copiadas (sem as datas).");
  }

  return (
    <div>
      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}

      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        <input value={nova} onChange={e => setNova(e.target.value)}
          onKeyDown={e => e.key === "Enter" && adicionar()}
          placeholder={hojeCurto() + ": nova pergunta para puxar assunto..."}
          style={{ marginBottom: 0 }} />
        <button onClick={adicionar} disabled={!nova.trim()}
          style={{ width: "auto", padding: "11px 18px" }}>Adicionar</button>
      </div>

      {lista === null ? <div className="msg">Carregando...</div> : (
        <>
          <div className="sec-h" style={{ justifyContent: "space-between" }}>
            <b>Pendentes ({pend.length})</b>
            {pend.length > 0 && (
              <button className="btn-sec" style={{ padding: "4px 10px", fontSize: 11 }}
                onClick={copiarPendentes}>Copiar todas</button>
            )}
          </div>
          {pend.length === 0
            ? <div className="vazio-nota">Nenhuma pergunta pendente.</div>
            : pend.map(p => (
                <div className="pq-it" key={p.id}>
                  <span className="txt">
                    {/^\s*(\d{2}\/\d{2}\/\d{2})\s*:/.test(p.texto) && (
                      <span className="pq-data">
                        {p.texto.match(/^\s*(\d{2}\/\d{2}\/\d{2})/)[1]}
                      </span>
                    )}
                    {semData(p.texto)}
                  </span>
                  <span className="bt">
                    <button className="btn-sec ico" title="Copiar pergunta"
                      aria-label="Copiar pergunta" onClick={() => copiarUma(p)}>
                      {copiado === p.id ? <IconeCheck /> : <IconeCopiar />}
                    </button>
                    <button className="btn-sec" onClick={() => marcar(p, "usada")}>usei</button>
                    <button className="btn-sec" onClick={() => remover(p)}>×</button>
                  </span>
                </div>
              ))}

          {resto.length > 0 && (
            <>
              <div className="sec-h" style={{ marginTop: 24 }}>
                <b style={{ color: "var(--mut)" }}>
                  Já usadas ({resto.length})
                </b>
                <button className="btn-sec" style={{ padding: "3px 9px", fontSize: 11 }}
                  onClick={() => setVer(v => !v)}>{verUsadas ? "ocultar" : "mostrar"}</button>
              </div>
              {verUsadas && resto.map(p => (
                <div className="pq-it usada" key={p.id}>
                  <span className="txt">
                    {/^\s*(\d{2}\/\d{2}\/\d{2})\s*:/.test(p.texto) && (
                      <span className="pq-data">
                        {p.texto.match(/^\s*(\d{2}\/\d{2}\/\d{2})/)[1]}
                      </span>
                    )}
                    {semData(p.texto)}
                    {p.usada_em && (
                      <span style={{ color: "var(--mut)", fontSize: 11 }}>
                        {" · " + new Date(p.usada_em).toLocaleDateString("pt-BR")}
                      </span>
                    )}
                  </span>
                  <span className="bt">
                    <button className="btn-sec ico" title="Copiar pergunta"
                      aria-label="Copiar pergunta" onClick={() => copiarUma(p)}>
                      {copiado === p.id ? <IconeCheck /> : <IconeCopiar />}
                    </button>
                    <button className="btn-sec" onClick={() => marcar(p, "pendente")}>voltar</button>
                    <button className="btn-sec" onClick={() => remover(p)}>×</button>
                  </span>
                </div>
              ))}
            </>
          )}
        </>
      )}
    </div>
  );
}





/* ---------- Toast e confirmação ---------- */
const CtxUI = React.createContext({ toast: () => {}, confirmar: async () => false });
const usarUI = () => React.useContext(CtxUI);

function ProvedorUI({ children }) {
  const [toasts, setToasts] = useState([]);
  const [conf, setConf]     = useState(null);

  const toast = useCallback((texto, tipo) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, texto, tipo: tipo || "ok" }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3600);
  }, []);

  const confirmar = useCallback((opts) => new Promise(resolve => {
    setConf({ ...opts, resolve });
  }), []);

  function fechar(v) { if (conf) { conf.resolve(v); setConf(null); } }

  useEffect(() => {
    if (!conf) return;
    const t = e => {
      if (e.key === "Escape") fechar(false);
      if (e.key === "Enter")  fechar(true);
    };
    document.addEventListener("keydown", t);
    return () => document.removeEventListener("keydown", t);
  }, [conf]);

  return (
    <CtxUI.Provider value={{ toast, confirmar }}>
      {children}
      <div className="toasts">
        {toasts.map(t => (
          <div key={t.id} className={"toast " + t.tipo}>{t.texto}</div>
        ))}
      </div>
      {conf && (
        <>
          <div className="drawer-bg" style={{ zIndex: 90 }} onClick={() => fechar(false)} />
          <div className="conf">
            <h3>{conf.titulo}</h3>
            {conf.texto && <p>{conf.texto}</p>}
            {conf.alerta && <div className="conf-al">⚠️ {conf.alerta}</div>}
            <div className="conf-bt">
              <button className="btn-sec" onClick={() => fechar(false)}>
                {conf.cancelar || "Cancelar"}
              </button>
              <button className={conf.perigo ? "perigo" : ""} onClick={() => fechar(true)}>
                {conf.ok || "Confirmar"}
              </button>
            </div>
          </div>
        </>
      )}
    </CtxUI.Provider>
  );
}

/* Esc fecha o overlay mais recente */
function useEsc(ativo, aoFechar) {
  useEffect(() => {
    if (!ativo) return;
    const t = e => { if (e.key === "Escape") { e.stopPropagation(); aoFechar(); } };
    document.addEventListener("keydown", t);
    return () => document.removeEventListener("keydown", t);
  }, [ativo, aoFechar]);
}

/* ---------- Aluno global ---------- */
/* Um seletor só para a dashboard inteira. Antes cada aba tinha o seu,
   então trocar de aba obrigava a escolher o aluno de novo. */
const CtxAluno = React.createContext({ alunoId: "", setAlunoId: () => {}, alunos: [] });
const usarAluno = () => React.useContext(CtxAluno);

function ProvedorAluno({ children }) {
  const [alunos, setAlunos]   = useState([]);
  const [alunoId, setAlunoId] = useState(() => {
    const p = (location.hash || "").replace(/^#\/?/, "").split("/");
    return p[1] || "";
  });
  const [carr, setCarr]       = useState(true);

  const recarregar = useCallback(async () => {
    const { data, error } = await sb.from("alunos")
      .select("id, nome, status").order("nome");
    if (!error) setAlunos(data || []);
    setCarr(false);
  }, []);

  useEffect(() => { recarregar(); }, [recarregar]);

  /* o aluno também vai para a URL: #/treinos/<id> sobrevive ao F5 */
  useEffect(() => {
    const base = (location.hash || "#/alunos").split("/")[1] || "alunos";
    const novo = "#/" + base + (alunoId ? "/" + alunoId : "");
    if (location.hash !== novo) history.replaceState(null, "", novo);
  }, [alunoId]);

  const valor = { alunoId, setAlunoId, alunos, carregando: carr, recarregar,
                  aluno: alunos.find(a => a.id === alunoId) || null };
  return <CtxAluno.Provider value={valor}>{children}</CtxAluno.Provider>;
}

function BarraAluno() {

/* ---------- Combobox com busca fuzzy ---------- */
/* tolera acento, maiúscula e termos fora de ordem: "fabio silva"
   encontra "Ana Paula Silva Di Fabio" */
const cbNorm = t => String(t || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase();

function cbCasa(alvo, q) {
  const a = cbNorm(alvo);
  const toks = cbNorm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return true;
  return toks.every(t => a.includes(t));
}

/* opcoes: [{ value, label, grupo? }] */
function Combobox({ opcoes, value, onChange, placeholder, className }) {
  const [aberto, setAberto] = useState(false);
  const [busca, setBusca]   = useState("");
  const [idx, setIdx]       = useState(0);
  const ref = React.useRef(null);

  const sel = opcoes.find(o => o.value === value);

  useEffect(() => {
    const fora = e => { if (ref.current && !ref.current.contains(e.target)) setAberto(false); };
    document.addEventListener("mousedown", fora);
    return () => document.removeEventListener("mousedown", fora);
  }, []);

  const filtradas = aberto
    ? opcoes.filter(o => cbCasa(o.label + " " + (o.grupo || ""), busca))
    : [];

  function escolher(o) {
    onChange(o ? o.value : "");
    setBusca(""); setAberto(false); setIdx(0);
  }

  function tecla(e) {
    if (e.key === "ArrowDown") { e.preventDefault(); setIdx(i => Math.min(i + 1, filtradas.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setIdx(i => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); if (filtradas[idx]) escolher(filtradas[idx]); }
    else if (e.key === "Escape") { setAberto(false); setBusca(""); }
  }

  let grupoAtual = null;

  return (
    <div className="cb" ref={ref}>
      <input
        className={className}
        value={aberto ? busca : (sel ? sel.label : "")}
        placeholder={placeholder || "Buscar..."}
        onFocus={() => { setAberto(true); setBusca(""); setIdx(0); }}
        onChange={e => { setBusca(e.target.value); setAberto(true); setIdx(0); }}
        onKeyDown={tecla} />
      {sel && !aberto && (
        <button className="cb-lim" title="Limpar"
          onClick={e => { e.stopPropagation(); escolher(null); }}>×</button>
      )}
      {aberto && (
        <div className="cb-lista">
          {filtradas.length === 0
            ? <div className="cb-vazio">Nada encontrado</div>
            : filtradas.map((o, i) => {
                const cab = o.grupo && o.grupo !== grupoAtual;
                if (cab) grupoAtual = o.grupo;
                return (
                  <React.Fragment key={o.value}>
                    {cab && <div className="cb-grp">{o.grupo}</div>}
                    <div className={"cb-op" + (i === idx ? " on" : "")}
                      onMouseEnter={() => setIdx(i)}
                      onMouseDown={e => { e.preventDefault(); escolher(o); }}>
                      {o.label}
                    </div>
                  </React.Fragment>
                );
              })}
        </div>
      )}
    </div>
  );
}

/* ---------- Planejamento de Periodização ---------- */
const PL_COR = {

/* colunas alternam: ímpares em amarelo, pares em ciano.
   nas pares, nome da fase e objetivo usam o ciano mais forte */
const PL_COL = [
  { num: "#EFFF82", nome: "#EEFF7F", data: "#EEFF7F", objetivo: "#EEFF7F", texto: "#EEFF7F" },
  { num: "#D2FFFE", nome: "#51D9D9", data: "#D2FFFE", objetivo: "#51D9D9", texto: "#D2FFFE" }
];
const plCor = i => PL_COL[i % 2];
const PL_LABELS = ["Início", "Objetivo", "Métodos", "Observações"];

function dISO(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function dBR(iso) {
  if (!iso) return "";
  const [a, m, d] = String(iso).slice(0, 10).split("-");
  return d + "/" + m + "/" + a.slice(2);
}
function parseISO(iso) { return new Date(String(iso).slice(0, 10) + "T12:00:00"); }
function addDias(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function proxSegunda(d) {
  const x = new Date(d.getTime());
  const w = x.getDay();
  x.setDate(x.getDate() + (w === 1 ? 0 : (8 - w) % 7));
  return x;
}

/* "Fase de Hipertrofia de Qualidade I" -> "Hipertrofia de Qualidade" */
function nucleoFase(nome) {
  return String(nome || "").trim()
    .replace(/^Fase\s+(de\s+|d[ao]\s+)?/i, "")
    .replace(/\s+(I|1)\s*$/, "")
    .trim();
}
function obsAuto(nome, dataII) {
  const n = nucleoFase(nome);
  if (!n || !dataII) return "";
  return '(teremos a fase "' + n + ' II" - ' + dBR(dISO(dataII)) + ")";
}

/* a partir do início da fase 1 e da duração, calcula as 4 fases.
   regra observada nos planejamentos reais:
   fase II = início + duração ; próxima fase = fase II + duração  */
function calcularDatas(inicioISO, semanas) {
  if (!inicioISO) return [];
  const dur = (semanas || 6) * 7;
  const out = [];
  let cur = parseISO(inicioISO);
  for (let i = 0; i < 4; i++) {
    const fim = addDias(cur, dur - 1);
    const faseII = proxSegunda(addDias(cur, dur));
    out.push({ inicio: dISO(cur), fim: dISO(fim), faseII });
    cur = proxSegunda(addDias(faseII, dur));
  }
  return out;
}

/* fases.id nao tem default no banco — o UUID e gerado no cliente,
   igual o App Idealis ja faz. Fallback para quando crypto.randomUUID
   nao existe (ex.: pagina aberta via file://). */
function novoUUID() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  if (typeof crypto !== "undefined" && crypto.getRandomValues) {
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  }
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function faseVazia(pos) {
  return { posicao: pos, template_id: "", nome: "", inicio: "", fim: "",
           objetivo: "", metodos: "", observacao: "" };
}

/* desenha o planejamento num canvas (fundo preto, para o Photoshop) */
/* 1800x670: formato que encaixa no PDF sem redimensionar */
function desenharPlanejamento(plan, fases, aluno) {
  const W = 1800, H = 670;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = PL_COR.bg; x.fillRect(0, 0, W, H);

  const F = (px, peso) => (peso || 700) + " " + px + "px Sora, system-ui, sans-serif";
  const padL = 26, colLab = 132, gap = 12;
  const colW = (W - padL * 2 - colLab - gap * 3) / 4;
  const cx = i => padL + colLab + i * (colW + gap) + colW / 2;

  /* quebra texto respeitando as quebras de linha originais */
  function linhas(txt, max) {
    const out = [];
    for (const bruto of String(txt || "").split("\n")) {
      const t = bruto.trim();
      if (!t) { out.push(""); continue; }
      let atual = "";
      for (const pal of t.split(/\s+/)) {
        const teste = atual ? atual + " " + pal : pal;
        if (x.measureText(teste).width > max && atual) { out.push(atual); atual = pal; }
        else atual = teste;
      }
      if (atual) out.push(atual);
    }
    return out;
  }
  function bloco(txt, px, cxi, y, cor, tam, lh) {
    x.font = F(tam, 600); x.fillStyle = cor; x.textAlign = "center";
    const ls = linhas(txt, colW - 24);
    ls.forEach((l, i) => x.fillText(l, cxi, y + i * lh));
    return ls.length * lh;
  }

  /* cabeçalho */
  x.textAlign = "center";
  x.font = F(31); x.fillStyle = PL_COR.titulo;
  x.fillText(plan.titulo || "Planejamento de Periodização", W / 2, 40);
  x.font = F(21); x.fillStyle = PL_COR.aluno;
  x.fillText(aluno || "", W / 2, 68);

  /* colunas */
  let y = 112;
  fases.forEach((f, i) => {
    const C = plCor(i);
    x.font = F(16); x.fillStyle = C.num;
    x.fillText("Fase " + (i + 1), cx(i), y);
    bloco(f.nome, 0, cx(i), y + 21, C.nome, 13, 16);
  });

  /* rótulos e conteúdo, linha a linha */
  /* altura de cada linha calculada pelo conteúdo real, para o
     documento ocupar a página inteira em vez de sobrar espaço embaixo */
  const linhasDoc = [
    { lab: "Início",      get: f => dBR(f.inicio), cor: (i) => plCor(i).data,     tam: 19, lh: 24 },
    { lab: "Objetivo",    get: f => f.objetivo,    cor: (i) => plCor(i).objetivo, tam: 13, lh: 17 },
    { lab: "Métodos",     get: f => f.metodos,     cor: (i) => plCor(i).texto,    tam: 13, lh: 17 },
    { lab: "Observações", get: f => f.observacao,  cor: () => PL_COR.obs,         tam: 12, lh: 15 }
  ];

  const alturas = linhasDoc.map(L => {
    x.font = F(L.tam, 600);
    const n = Math.max(...fases.map(f => linhas(L.get(f), colW - 24).length), 1);
    return n * L.lh;
  });

  const topo = 168, base = H - 44;
  const usado = alturas.reduce((a, b) => a + b, 0);
  const folga = Math.max(12, (base - topo - usado) / linhasDoc.length);

  let cy = topo;
  linhasDoc.forEach((L, k) => {
    x.textAlign = "right"; x.font = F(15); x.fillStyle = PL_COR.label;
    x.fillText(L.lab, padL + colLab - 14, cy + 3);
    fases.forEach((f, i) => bloco(L.get(f), 0, cx(i), cy, L.cor(i), L.tam, L.lh));
    cy += alturas[k] + folga;
  });

  /* data de emissão */
  x.textAlign = "right"; x.font = F(24); x.fillStyle = PL_COR.aluno;
  x.fillText(dBR(plan.data_emissao).replace(/(\d{2})$/, "20$1"), W - padL, H - 18);

  return cv;
}

function PainelPlanejamento() {
  const { alunoId: sel, alunos } = usarAluno();
  const [tpls, setTpls]       = useState([]);
  const [cats, setCats]       = useState([]);
  const [plan, setPlan]       = useState(null);
  const [fases, setFases]     = useState([1, 2, 3, 4].map(faseVazia));
  const [erro, setErro]       = useState("");
  const [aviso, setAviso]     = useState("");
  const [busy, setBusy]       = useState(false);
  const [sujo, setSujo]       = useState(false);

  useEffect(() => {
    (async () => {
      const [t, c] = await Promise.all([
        sb.from("fase_templates").select("*").eq("ativo", true).order("ordem"),
        sb.from("fase_categorias").select("*").order("ordem")
      ]);
      if (!t.error) setTpls(t.data || []);
      if (!c.error) setCats(c.data || []);
    })();
  }, []);

  const carregar = useCallback(async (alunoId) => {
    if (!alunoId) return;
    setErro(""); setAviso(""); setSujo(false);
    const { data, error } = await sb.from("planejamentos")
      .select("*").eq("aluno_id", alunoId)
      .order("data_emissao", { ascending: false }).limit(1);
    if (error) { setErro(error.message); return; }
    const p = (data && data[0]) || null;
    if (!p) {
      setPlan({ aluno_id: alunoId, titulo: "Planejamento de Periodização",
                data_emissao: dISO(new Date()), duracao_semanas: 6 });
      setFases([1, 2, 3, 4].map(faseVazia));
      return;
    }
    setPlan(p);
    const f = await sb.from("fases").select("*")
      .eq("planejamento_id", p.id).order("posicao");
    const mapa = new Map((f.data || []).map(r => [r.posicao, r]));
    setFases([1, 2, 3, 4].map(i => {
      const r = mapa.get(i);
      return r ? {
        id: r.id, posicao: i, template_id: r.template_id || "", nome: r.nome || "",
        inicio: r.inicio || "", fim: r.fim || "", objetivo: r.objetivo || "",
        metodos: r.metodos || "", observacao: r.observacao || ""
      } : faseVazia(i);
    }));
  }, []);

  useEffect(() => { carregar(sel); }, [sel, carregar]);

  function mudarFase(i, campo, valor) {
    setFases(fs => fs.map((f, k) => k === i ? { ...f, [campo]: valor } : f));
    setSujo(true);
  }

  /* aplica o template: nome, objetivo e métodos */
  function aplicarTemplate(i, tid) {
    const t = tpls.find(x => x.id === tid);
    setFases(fs => fs.map((f, k) => {
      if (k !== i) return f;
      if (!t) return { ...f, template_id: "" };
      return { ...f, template_id: tid,
        nome: "Fase de " + t.nome + " I",
        objetivo: t.objetivo, metodos: t.metodos };
    }));
    setSujo(true);
  }

  /* recalcula as 4 datas a partir do início da fase 1 */
  function gerarDatas() {
    const base = fases[0].inicio;
    if (!base) { setErro("Preenche a data de início da Fase 1 primeiro."); return; }
    const dur = (plan && plan.duracao_semanas) || 6;
    const calc = calcularDatas(base, dur);
    setFases(fs => fs.map((f, i) => ({
      ...f,
      inicio: calc[i].inicio,
      fim: calc[i].fim,
      observacao: obsAuto(f.nome, calc[i].faseII) || f.observacao
    })));
    setSujo(true); setErro("");
    setAviso("Datas e observações geradas. Ajusta o que quiser antes de salvar.");
  }

  async function salvar() {
    if (!sel) return;
    const faltando = fases.filter(f => f.nome && !f.inicio);
    if (faltando.length) {
      setErro("Fase " + faltando[0].posicao + " tem nome mas está sem data de início.");
      return;
    }
    setBusy(true); setErro("");
    try {
      let pid = plan && plan.id;
      const corpo = {
        aluno_id: sel,
        titulo: (plan && plan.titulo) || "Planejamento de Periodização",
        data_emissao: (plan && plan.data_emissao) || dISO(new Date()),
        duracao_semanas: (plan && plan.duracao_semanas) || 6
      };
      if (pid) {
        const u = await sb.from("planejamentos")
          .update({ ...corpo, atualizado_em: new Date().toISOString() }).eq("id", pid);
        if (u.error) throw new Error(u.error.message);
      } else {
        const ins = await sb.from("planejamentos").insert(corpo).select("id").single();
        if (ins.error) throw new Error(ins.error.message);
        pid = ins.data.id;
        setPlan(p => ({ ...(p || {}), ...corpo, id: pid }));
      }

      for (const f of fases) {
        if (!f.nome || !f.inicio) continue;
        const dur = (plan && plan.duracao_semanas) || 6;
        const fim = f.fim || dISO(addDias(parseISO(f.inicio), dur * 7 - 1));
        const linha = {
          aluno_id: sel, planejamento_id: pid, posicao: f.posicao,
          template_id: f.template_id || null, nome: f.nome,
          inicio: f.inicio, fim,
          objetivo: f.objetivo || null, metodos: f.metodos || null,
          observacao: f.observacao || null
        };
        if (f.id) {
          const u = await sb.from("fases").update(linha).eq("id", f.id);
          if (u.error) throw new Error(u.error.message);
        } else {
          const novo = novoUUID();
          const ins = await sb.from("fases").insert({ id: novo, ...linha });
          if (ins.error) throw new Error(ins.error.message);
          setFases(fs => fs.map(y => y.posicao === f.posicao ? { ...y, id: novo } : y));
        }
      }
      setSujo(false);
      setAviso("Planejamento salvo. As fases já aparecem no App do aluno.");
      await carregar(sel);
    } catch (e) { setErro(e.message); }
    setBusy(false);
  }

  function baixarPng() {
    const nome = (alunos.find(a => a.id === sel) || {}).nome || "";
    const cv = desenharPlanejamento(plan || {}, fases, nome);
    const slug = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase();
    const a = document.createElement("a");
    a.download = "planejamento_" + slug + "_" +
      ((plan && plan.data_emissao) || dISO(new Date())) + ".png";
    a.href = cv.toDataURL("image/png");
    a.click();
    setAviso("PNG baixado em 1800×670, fundo preto.");
  }

  const nomeAluno = (alunos.find(a => a.id === sel) || {}).nome || "";
  const temX = fases.some(f =>
    (f.objetivo + " " + f.metodos + " " + f.nome).includes("«x»"));

  const grupos = cats.map(c => ({
    ...c, itens: tpls.filter(t => t.categoria_id === c.id)
  })).filter(g => g.itens.length);

  const cel = (f, i, campo, cls, rows) => (
    <textarea className={cls} rows={rows || 3} value={f[campo]}
      onChange={e => mudarFase(i, campo, e.target.value)} />
  );

  return (
    <div>
      <div className="pl-top">

        <input type="date" value={(plan && plan.data_emissao) || ""}
          onChange={e => { setPlan(p => ({ ...p, data_emissao: e.target.value })); setSujo(true); }}
          title="Data de emissão" />
        <select value={(plan && plan.duracao_semanas) || 6}
          onChange={e => { setPlan(p => ({ ...p, duracao_semanas: +e.target.value })); setSujo(true); }}
          style={{ minWidth: 130 }}>
          {[4, 5, 6, 7, 8].map(n => <option key={n} value={n}>{n} semanas</option>)}
        </select>
        <button className="btn-sec" onClick={gerarDatas}>Gerar datas</button>
        <button onClick={salvar} disabled={busy || !sujo}>
          {busy ? "Salvando..." : "Salvar"}
        </button>
        <button className="btn-sec" onClick={baixarPng}>Baixar PNG</button>
      </div>

      {erro && <div className="err">{erro}</div>}
      {aviso && <div className="ok-msg">{aviso}</div>}
      {temX && (
        <div className="err" style={{ background: "#2a2418", borderColor: "#5c4a24", color: "#f0a35e" }}>
          ⚠️ Existe <b>«x»</b> em algum campo — é placeholder do template. Substitui antes de exportar.
        </div>
      )}

      {!sel && (
        <div className="sem-aluno">
          <b>Escolhe um aluno lá em cima</b>
          O planejamento de periodização dele aparece aqui.
        </div>
      )}

      <div className="pl-tit" style={{ display: sel ? "block" : "none" }}>
        <h2>{(plan && plan.titulo) || "Planejamento de Periodização"}</h2>
        <div className="aln">{nomeAluno}</div>
      </div>

      <div className="pl-grid" style={{ display: sel ? "" : "none" }}>
        <div className="pl-lab" />
        {fases.map((f, i) => (
          <div className={"pl-cel " + (i % 2 ? "cb2" : "ca")} key={"h" + i}>
            <div className="fnum">Fase {i + 1}</div>
            <div style={{ marginBottom: 6 }}>
              <Combobox className="tsel"
                opcoes={grupos.flatMap(g =>
                  g.itens.map(t => ({ value: t.id, label: t.nome, grupo: g.nome })))}
                value={f.template_id}
                onChange={v => aplicarTemplate(i, v)}
                placeholder="Buscar template..." />
            </div>
            <textarea className="fnome" rows={2} value={f.nome}
              onChange={e => mudarFase(i, "nome", e.target.value)}
              placeholder="Nome da fase" />
          </div>
        ))}

        <div className="pl-lab">Início</div>
        {fases.map((f, i) => (
          <div className={"pl-cel " + (i % 2 ? "cb2" : "ca")} key={"d" + i}>
            <input type="date" className="fdata" value={f.inicio}
              onChange={e => mudarFase(i, "inicio", e.target.value)} />
            {f.inicio && f.fim && (
              <div style={{ textAlign: "center", marginTop: 4 }}>
                <span className={"pl-sit " + (
                  dISO(new Date()) < f.inicio ? "futura"
                  : dISO(new Date()) > f.fim ? "encerrada" : "ativa")}>
                  {dISO(new Date()) < f.inicio ? "futura"
                   : dISO(new Date()) > f.fim ? "encerrada" : "ativa"}
                  {" · até " + dBR(f.fim)}
                </span>
              </div>
            )}
          </div>
        ))}

        <div className="pl-lab">Objetivo</div>
        {fases.map((f, i) => <div className={"pl-cel " + (i % 2 ? "cb2" : "ca")} key={"o" + i}>{cel(f, i, "objetivo", "fobj", 5)}</div>)}

        <div className="pl-lab">Métodos</div>
        {fases.map((f, i) => <div className={"pl-cel " + (i % 2 ? "cb2" : "ca")} key={"m" + i}>{cel(f, i, "metodos", "", 5)}</div>)}

        <div className="pl-lab">Observações</div>
        {fases.map((f, i) => <div className={"pl-cel " + (i % 2 ? "cb2" : "ca")} key={"b" + i}>{cel(f, i, "observacao", "fobs", 3)}</div>)}
      </div>

      <div className="pl-hint">
        Preenche a data da <b>Fase 1</b> e clica em <b>Gerar datas</b> — as outras três e as
        observações da "Fase II" saem sozinhas, sempre em segunda-feira. Tudo continua editável.
        <br />
        Salvar cria as fases direto na tabela do App: o aluno passa a ver o planejamento por lá.
      </div>
    </div>
  );
}

/* soma a duração total do cardio, para mostrar "16min" como o App faz */
function duracaoCardio(c) {
  if (!c || !Array.isArray(c.blocos)) return null;
  const seg = t => {
    const m = String(t || "").match(/^\s*([\d.,]+)\s*(min|m|'|s|"|seg)?/i);
    if (!m) return 0;
    const v = parseFloat(String(m[1]).replace(",", "."));
    const u = (m[2] || "s").toLowerCase();
    return (u === "min" || u === "m" || u === "'") ? v * 60 : v;
  };
  const um = c.blocos.reduce((a, b) => a + seg(b.tempo), 0);
  const tot = um * (c.repetir || 1);
  if (!tot) return null;
  return tot >= 60 ? Math.round(tot / 60) + "min" : Math.round(tot) + "s";
}
const DESC_OPC  = ["30~45","45~60","60~90","90~120","120~180"];
const SERIES_OPC = [1,2,3,4,5,6];

/* formato canônico: "3 x 8 a 12" */
function montaSeries(n, reps) {
  const nn = String(n || "").trim(), rr = String(reps || "").trim();
  if (!nn) return rr || null;
  return rr ? nn + " x " + rr : nn;
}
function parseSeries(txt) {
  const m = String(txt || "").match(/^\s*(\d+)\s*[x×]\s*(.+)$/i);
  if (m) return { n: m[1], reps: m[2].trim() };
  const so = String(txt || "").match(/^\s*(\d+)\s*$/);
  return so ? { n: so[1], reps: "" } : { n: "", reps: String(txt || "").trim() };
}

    if (cat) return;
    sb.from("cardapio").select("id, exercicio, grupos").order("exercicio")
      .then(({ data, error }) => { if (!error) setCat(data || []); });
  }, [cat]);

    setQ(c.exercicio); setAbr(false);
  }

  return (
    <div style={{ position: "relative" }} ref={ref}>
      <input value={q}
        onChange={e => { setQ(e.target.value); onTexto(e.target.value); setAbr(true); }}
        onFocus={() => setAbr(true)}
        onKeyDown={e => {
          if (e.key === "ArrowDown") { e.preventDefault(); setIdx(i => Math.min(i + 1, ops.length - 1)); }
          else if (e.key === "ArrowUp") { e.preventDefault(); setIdx(i => Math.max(i - 1, 0)); }
          else if (e.key === "Enter" && ops[idx]) { e.preventDefault(); escolher(ops[idx]); }
          else if (e.key === "Escape") setAbr(false);
        }}
        placeholder="Ex: Supino Reto" style={{ marginBottom: 0 }} />
      {abr && ops.length > 0 && (
        <div className="ac-lista">
          {ops.map((c, i) => (
            <div key={c.id} className={"ac-op" + (i === idx ? " on" : "")}
              onMouseEnter={() => setIdx(i)}
              onMouseDown={e => { e.preventDefault(); escolher(c); }}>
              {c.exercicio}
              <small>{(c.grupos || []).join(" · ") || "sem grupo"}</small>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function EditorExercicio({ ex, treinoId, ordem, onFechar, onSalvo }) {
  useEsc(true, onFechar);
  const novo = !ex;
  const p0 = parseSeries(ex ? ex.series : "");
  const [nome, setNome]     = useState(ex ? ex.nome || "" : "");
  const [cardId, setCardId] = useState(ex ? ex.cardapio_id : null);
  const [nSer, setNSer]     = useState(p0.n || "3");
  const [reps, setReps]     = useState(p0.reps || "");
  const [desc, setDesc]     = useState(ex ? ex.descanso || "" : "");
  const [obs, setObs]       = useState(ex ? ex.observacao || "" : "");
  const [filmar, setFilmar] = useState(ex ? !!ex.filmar : false);
  const [metodo, setMetodo] = useState(ex ? ex.metodo : null);

  const [verMet, setVerMet] = useState(false);
  const [erro, setErro]     = useState("");
  const [busy, setBusy]     = useState(false);
  const [ehCard, setEhCard] = useState(!!(ex && ex.cardio));
  const [card, setCard]     = useState(
    (ex && ex.cardio) ? ex.cardio : { nome: "", repetir: 1, blocos: [] });

  function mudarBloco(i, campo, v) {
    setCard(c => ({ ...c, blocos: c.blocos.map((b, k) =>
      k === i ? { ...b, [campo]: v } : b) }));
  }
  function addBloco() {
    setCard(c => ({ ...c, blocos: [...c.blocos,
      { tempo: "60s", rotulo: "", nivel: "leve" }] }));
  }
  function removeBloco(i) {
    setCard(c => ({ ...c, blocos: c.blocos.filter((_, k) => k !== i) }));
  }
  function moverBloco(i, d) {
    const j = i + d;
    setCard(c => {
      if (j < 0 || j >= c.blocos.length) return c;
      const b = [...c.blocos];
      [b[i], b[j]] = [b[j], b[i]];
      return { ...c, blocos: b };
    });
  }

  useEffect(() => {
    sb.from("metodos").select("id, nome, familia, tipo, series")
      .order("familia").order("nome")

  }, []);

  async function salvar() {
    if (!nome.trim()) { setErro("Preenche o nome do exercício."); return; }
    if (ehCard && !card.blocos.length) {
      setErro("Adiciona pelo menos um bloco de cardio."); return;
    }
    setBusy(true); setErro("");
    /* cardio e musculação são excludentes: um exercício de cardio
       não tem séries, método nem descanso */
    const corpo = ehCard
      ? {
          nome: nome.trim(),
          cardapio_id: cardId || null,
          observacao: obs.trim() || null,
          filmar: !!filmar,
          cardio: {
            nome: card.nome.trim() || nome.trim(),
            repetir: Math.max(1, parseInt(card.repetir, 10) || 1),
            blocos: card.blocos.map(b => ({
              tempo: String(b.tempo || "").trim(),
              rotulo: String(b.rotulo || "").trim(),
              nivel: b.nivel || "leve"
            }))
          },
          series: null, descanso: null, metodo: null
        }
      : {
          nome: nome.trim(),
          series: metodo ? montaSeries(metodo.series.length, reps)

          cardapio_id: cardId || null,
          descanso: desc.trim() || null,
          observacao: obs.trim() || null,
          filmar: !!filmar,
          metodo: metodo || null,
          cardio: null

    try {
      if (novo) {
        const id = novoUUID();
        const r = await sb.from("exercicios")
          .insert({ id, treino_id: treinoId, ordem, ...corpo });
        if (r.error) throw new Error(r.error.message);
      } else {
        /* update parcial: nao toca em done_date, cardio, audio_url nem ordem */
        const r = await sb.from("exercicios").update(corpo).eq("id", ex.id);
        if (r.error) throw new Error(r.error.message);
      }
      onSalvo();
    } catch (e) { setErro(e.message); }
    setBusy(false);
  }

  const famMet = [...new Set(mets.map(m => m.familia || "Sem família"))];

  return (
    <>

      <div className="ed">

        </div>

        <div className="ed-b">
          {erro && <div className="err">{erro}</div>}

          <div className="ed-lab">Exercício</div>
          <BuscaExercicio valor={nome}
            onPick={(id, txt) => { setCardId(id); setNome(txt); }}

          <div className="ed-cnt" style={{ marginTop: 5 }}>
            {cardId ? "vinculado ao catálogo · id " + cardId
